<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JPG to PDF - Free Online Tool | ToolNest</title>

  <meta
    name="description"
    content="Convert JPG, PNG and WEBP images into a PDF online for free."
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }


    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
    }

    .logo span {
      color: #666;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      color: #000;
    }


    /* Main */

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }


    /* Heading */

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .heading h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .heading p {
      margin: 0;
      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }


    /* Tool Box */

    .tool-box {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 30px;
    }


    /* Upload Area */

    .upload-area {
      display: block;

      border: 2px dashed #ccc;
      border-radius: 12px;

      padding: 45px 20px;

      text-align: center;
      cursor: pointer;

      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #888;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .upload-area h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .upload-area p {
      margin: 0;
      color: #777;
      font-size: 15px;
    }


    /* Hide File Input */

    #imageInput {
      display: none;
    }


    /* Selected Images */

    .images-section {
      display: none;
      margin-top: 30px;
    }

    .images-section h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }


    .images-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(160px, 1fr));

      gap: 16px;
    }


    /* Image Card */

    .image-item {
      position: relative;

      background: #ffffff;

      border: 1px solid #e5e5e5;
      border-radius: 10px;

      overflow: hidden;
    }

    .image-item img {
      width: 100%;
      height: 140px;

      display: block;

      object-fit: cover;
      background: #f6f7fb;
    }

    .image-name {
      padding: 10px;

      font-size: 12px;
      color: #666;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Remove Button */

    .remove-button {
      position: absolute;

      top: 8px;
      right: 8px;

      width: 30px;
      height: 30px;

      border: none;
      border-radius: 50%;

      background: #222;
      color: #ffffff;

      font-size: 18px;
      cursor: pointer;

      line-height: 1;
    }


    /* Actions */

    .actions {
      display: none;

      margin-top: 30px;

      text-align: center;
    }


    button {
      border: none;
      border-radius: 8px;

      padding: 13px 22px;

      font-size: 15px;
      cursor: pointer;

      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .primary-button {
      background: #222;
      color: #ffffff;
    }

    .secondary-button {
      background: #e9e9e9;
      color: #222;

      margin-left: 10px;
    }


    /* Status */

    .status {
      margin-top: 18px;

      text-align: center;

      color: #777;
      font-size: 14px;
    }


    /* Footer */

    footer {
      text-align: center;

      padding: 35px 20px;

      background: #ffffff;
      border-top: 1px solid #e5e5e5;

      color: #777;
      font-size: 14px;
    }


    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding: 15px 20px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        padding: 40px 15px 60px;
      }

      .heading h1 {
        font-size: 30px;
      }

      .tool-box {
        padding: 20px;
      }

      .upload-area {
        padding: 35px 15px;
      }

      .images-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .primary-button,
      .secondary-button {
        display: block;
        width: 100%;
      }

      .secondary-button {
        margin: 10px 0 0;
      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- Main -->

  <main class="container">


    <div class="heading">

      <h1>
        JPG to PDF
      </h1>

      <p>
        Convert one or more images into a single PDF file.
      </p>

    </div>



    <div class="tool-box">


      <!-- Upload Area -->

      <label
        for="imageInput"
        class="upload-area"
      >

        <div class="upload-icon">
          🖼️
        </div>

        <h2>
          Upload Images
        </h2>

        <p>
          Click here to choose JPG, PNG or WEBP images.
        </p>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >



      <!-- Selected Images -->

      <div
        class="images-section"
        id="imagesSection"
      >

        <h2>
          Selected Images
        </h2>


        <div
          class="images-grid"
          id="imagesGrid"
        >
        </div>

      </div>



      <!-- Buttons -->

      <div
        class="actions"
        id="actions"
      >

        <button
          class="primary-button"
          id="createButton"
        >
          Create PDF
        </button>


        <button
          class="secondary-button"
          id="clearButton"
        >
          Clear Images
        </button>

      </div>



      <!-- Status -->

      <div
        class="status"
        id="status"
      >
      </div>


    </div>


  </main>



  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>



  <script>


    const imageInput =
      document.getElementById("imageInput");


    const imagesGrid =
      document.getElementById("imagesGrid");


    const imagesSection =
      document.getElementById("imagesSection");


    const actions =
      document.getElementById("actions");


    const createButton =
      document.getElementById("createButton");


    const clearButton =
      document.getElementById("clearButton");


    const status =
      document.getElementById("status");


    let images = [];



    /* Upload Images */

    imageInput.addEventListener(
      "change",
      function(event) {

        const files =
          Array.from(event.target.files);


        files.forEach(
          function(file) {

            const reader =
              new FileReader();


            reader.onload =
              function(e) {

                images.push({

                  name:
                    file.name,

                  data:
                    e.target.result

                });


                displayImages();

              };


            reader.readAsDataURL(file);

          }
        );


        imageInput.value = "";

      }
    );



    /* Display Images */

    function displayImages() {

      imagesGrid.innerHTML = "";


      if (
        images.length === 0
      ) {

        imagesSection.style.display =
          "none";


        actions.style.display =
          "none";


        status.textContent =
          "";


        return;

      }


      imagesSection.style.display =
        "block";


      actions.style.display =
        "block";


      images.forEach(
        function(image, index) {

          const item =
            document.createElement("div");


          item.className =
            "image-item";


          const imageElement =
            document.createElement("img");


          imageElement.src =
            image.data;


          imageElement.alt =
            image.name;


          const removeButton =
            document.createElement("button");


          removeButton.className =
            "remove-button";


          removeButton.textContent =
            "×";


          removeButton.addEventListener(
            "click",
            function() {

              images.splice(
                index,
                1
              );


              displayImages();

            }
          );


          const name =
            document.createElement("div");


          name.className =
            "image-name";


          name.textContent =
            image.name;


          item.appendChild(
            imageElement
          );


          item.appendChild(
            removeButton
          );


          item.appendChild(
            name
          );


          imagesGrid.appendChild(
            item
          );

        }
      );


      status.textContent =
        images.length
        +
        (
          images.length === 1
            ? " image selected."
            : " images selected."
        );

    }



    /* Clear Images */

    clearButton.addEventListener(
      "click",
      function() {

        images = [];


        displayImages();

      }
    );



    /* Create PDF */

    createButton.addEventListener(
      "click",
      async function() {

        if (
          images.length === 0
        ) {

          return;

        }


        createButton.disabled =
          true;


        status.textContent =
          "Creating your PDF...";


        try {

          const {
            jsPDF
          } =
            window.jspdf;


          const pdf =
            new jsPDF({

              orientation:
                "portrait",

              unit:
                "mm",

              format:
                "a4"

            });


          for (
            let i = 0;
            i < images.length;
            i++
          ) {

            const image =
              images[i];


            const imageElement =
              new Image();


            await new Promise(
              function(resolve) {

                imageElement.onload =
                  resolve;


                imageElement.src =
                  image.data;

              }
            );


            const pageWidth =
              210;


            const pageHeight =
              297;


            const margin =
              10;


            const maxWidth =
              pageWidth -
              margin * 2;


            const maxHeight =
              pageHeight -
              margin * 2;


            const ratio =
              Math.min(

                maxWidth /
                imageElement.width,

                maxHeight /
                imageElement.height

              );


            const width =
              imageElement.width *
              ratio;


            const height =
              imageElement.height *
              ratio;


            const x =
              (
                pageWidth -
                width
              )
              / 2;


            const y =
              (
                pageHeight -
                height
              )
              / 2;


            if (
              i > 0
            ) {

              pdf.addPage();

            }


            pdf.addImage(

              image.data,

              "JPEG",

              x,

              y,

              width,

              height

            );

          }


          pdf.save(
            "toolnest-images.pdf"
          );


          status.textContent =
            "PDF created successfully!";

        }

        catch(error) {

          console.error(error);


          status.textContent =
            "Something went wrong while creating the PDF.";

        }


        createButton.disabled =
          false;

      }
    );


  </script>


</body>

</html>
