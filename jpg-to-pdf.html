<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Images to PDF - Free Online Tool | ToolNest</title>

  <meta
    name="description"
    content="Convert JPG, PNG and WEBP images into a PDF online for free."
  >


  <!-- jsPDF -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #242424;
      color: #f1f1f1;
    }


    /* Navigation */

    nav {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 30px;

      background: #1b1b1b;

      border-bottom:
        1px solid #3a3a3a;
    }


    .logo {
      color: #ffffff;

      font-size: 24px;
      font-weight: bold;

      text-decoration: none;
    }


    .logo span {
      color: #b7b7b7;
    }


    .back-link {
      color: #c7c7c7;

      font-size: 15px;

      text-decoration: none;
    }


    .back-link:hover {
      color: #ffffff;
    }


    /* Main */

    .container {
      width: 100%;
      max-width: 1500px;

      margin: 0 auto;

      padding:
        35px 30px
        80px;
    }


    /* Heading */

    .heading {
      text-align: center;

      margin-bottom: 30px;
    }


    .heading h1 {
      margin: 0 0 14px;

      font-size: 42px;
      font-weight: 700;
    }


    .heading p {
      margin: 0;

      color: #c4c4c4;

      font-size: 17px;
      line-height: 1.6;
    }


    /* Features */

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 28px;

      margin-top: 16px;

      color: #c9c9c9;

      font-size: 15px;
    }


    .features span {
      white-space: nowrap;
    }


    .features strong {
      color: #49c58b;
      margin-right: 5px;
    }


    /* Main Work Area */

    .work-area {
      margin-top: 32px;

      background: #303842;

      border-radius: 12px;

      padding: 16px;
    }


    /* Drop Zone */

    .drop-zone {
      min-height: 380px;

      border:
        2px dashed
        #aeb5bd;

      border-radius: 10px;

      position: relative;

      padding: 25px;

      display: flex;
      flex-direction: column;
      align-items: center;

      transition:
        background 0.2s,
        border-color 0.2s;
    }


    .drop-zone.drag-over {
      background: #39434f;

      border-color:
        #ffffff;
    }


    /* Upload Area */

    .upload-area {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 260px;

      cursor: pointer;
    }


    .upload-icon {
      width: 70px;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: #47525f;

      font-size: 34px;

      margin-bottom: 15px;
    }


    .upload-area h2 {
      margin: 0 0 10px;

      font-size: 25px;
    }


    .upload-area p {
      margin: 0;

      color: #c4c4c4;

      font-size: 16px;
    }


    #imageInput {
      display: none;
    }


    /* Selected Images */

    .selected-area {
      width: 100%;

      display: none;
    }


    .selected-header {
      text-align: center;

      color: #c5c5c5;

      font-size: 15px;

      margin:
        5px
        0
        25px;
    }


    /* Image Grid */

    .images-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 20px;

      min-height: 180px;
    }


    /* Image Item */

    .image-item {
      width: 180px;

      position: relative;

      cursor: grab;

      text-align: center;
    }


    .image-item.dragging {
      opacity: 0.4;
    }


    .image-preview {
      width: 180px;
      height: 180px;

      object-fit: contain;

      background: #4b5765;

      border-radius: 10px;

      padding: 8px;

      display: block;
    }


    /* Image Controls */

    .image-controls {
      display: flex;
      justify-content: center;

      gap: 12px;

      margin-bottom: 8px;
    }


    .image-control {
      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;

      background: transparent;

      color: #d5d5d5;

      font-size: 18px;

      cursor: pointer;

      border-radius: 6px;
    }


    .image-control:hover {
      background: #4a5562;
    }


    .remove-button {
      color: #ff7777;
    }


    .remove-button:hover {
      background: #5a4548;
    }


    /* Image Name */

    .image-name {
      margin-top: 10px;

      color: #d0d0d0;

      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Add Images Button */

    .add-more {
      margin-top: 20px;

      display: flex;
      justify-content: center;
    }


    .add-more button {
      background: #47525f;

      color: #ffffff;

      border: none;

      padding:
        10px
        18px;

      border-radius: 7px;

      cursor: pointer;

      font-size: 14px;
    }


    .add-more button:hover {
      background: #596674;
    }


    /* Settings */

    .settings {
      margin-top: 26px;

      background: #303842;

      border-radius: 12px;

      padding:
        16px
        25px;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 22px;
    }


    .setting {
      display: flex;
      align-items: center;

      gap: 8px;
    }


    .setting label {
      color: #d4d4d4;

      font-size: 14px;
    }


    select {
      min-width: 105px;

      padding:
        7px
        30px
        7px
        10px;

      background: #39434f;

      color: #ffffff;

      border:
        1px solid
        #59636e;

      border-radius: 6px;

      font-size: 14px;

      cursor: pointer;
    }


    select:focus {
      outline: none;

      border-color:
        #89939e;
    }


    /* Create Button */

    .create-section {
      text-align: center;

      margin-top: 28px;
    }


    #createButton {
      min-width: 350px;

      padding:
        17px
        40px;

      border: none;

      border-radius: 40px;

      background: #e58a00;

      color: #ffffff;

      font-size: 28px;

      cursor: pointer;

      transition:
        transform 0.2s,
        opacity 0.2s;
    }


    #createButton:hover {
      transform: translateY(-2px);
    }


    #createButton:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;
    }


    /* Status */

    #status {
      margin-top: 18px;

      text-align: center;

      color: #c4c4c4;

      min-height: 20px;

      font-size: 14px;
    }


    /* Footer */

    footer {
      text-align: center;

      padding: 30px 20px;

      border-top:
        1px solid
        #3a3a3a;

      color: #999;

      font-size: 14px;
    }


    /* Mobile */

    @media (
      max-width: 700px
    ) {

      nav {
        padding: 0 18px;
      }


      .container {
        padding:
          30px 15px
          60px;
      }


      .heading h1 {
        font-size: 32px;
      }


      .heading p {
        font-size: 15px;
      }


      .features {
        gap: 12px;
      }


      .work-area {
        padding: 10px;
      }


      .drop-zone {
        padding: 15px;
      }


      .image-item {
        width: 140px;
      }


      .image-preview {
        width: 140px;
        height: 140px;
      }


      .settings {
        flex-direction: column;

        align-items: stretch;

        gap: 15px;
      }


      .setting {
        justify-content: space-between;
      }


      select {
        width: 150px;
      }


      #createButton {
        width: 100%;

        min-width: 0;

        font-size: 22px;
      }

    }


    @media (
      max-width: 500px
    ) {

      .back-link {
        font-size: 13px;
      }


      .images-grid {
        gap: 12px;
      }


      .image-item {
        width: 130px;
      }


      .image-preview {
        width: 130px;
        height: 130px;
      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- Main -->

  <main
    class="container"
  >


    <!-- Heading -->

    <section
      class="heading"
    >

      <h1>
        Images to PDF
      </h1>


      <p>
        Convert photos and other images
        to PDF quickly and easily.
      </p>


      <div
        class="features"
      >

        <span>
          <strong>✓</strong>
          Free
        </span>


        <span>
          <strong>✓</strong>
          Online
        </span>


        <span>
          <strong>✓</strong>
          No limits
        </span>


        <span>
          <strong>✓</strong>
          Secure
        </span>

      </div>

    </section>



    <!-- Work Area -->

    <section
      class="work-area"
    >


      <div
        class="drop-zone"
        id="dropZone"
      >


        <!-- Upload -->

        <label
          for="imageInput"
          class="upload-area"
          id="uploadArea"
        >

          <div
            class="upload-icon"
          >
            🖼️
          </div>


          <h2>
            Upload Images
          </h2>


          <p>
            Click or drag JPG, PNG or WEBP images here.
          </p>

        </label>


        <input
          type="file"
          id="imageInput"
          accept="image/jpeg,image/png,image/webp"
          multiple
        >



        <!-- Selected Images -->

        <div
          class="selected-area"
          id="selectedArea"
        >


          <div
            class="selected-header"
          >
            Drag and drop images
            to change their order.
          </div>


          <div
            class="images-grid"
            id="imagesGrid"
          >
          </div>


          <div
            class="add-more"
          >

            <button
              id="addMoreButton"
              type="button"
            >
              + Add More Images
            </button>

          </div>


        </div>


      </div>


    </section>



    <!-- Settings -->

    <section
      class="settings"
    >


      <div
        class="setting"
      >

        <label
          for="pageSize"
        >
          Page size
        </label>


        <select
          id="pageSize"
        >

          <option value="a4">
            A4
          </option>

          <option value="letter">
            Letter
          </option>

          <option value="a3">
            A3
          </option>

        </select>

      </div>



      <div
        class="setting"
      >

        <label
          for="orientation"
        >
          Orientation
        </label>


        <select
          id="orientation"
        >

          <option value="auto">
            Automatic
          </option>

          <option value="portrait">
            Portrait
          </option>

          <option value="landscape">
            Landscape
          </option>

        </select>

      </div>



      <div
        class="setting"
      >

        <label
          for="margin"
        >
          Margin
        </label>


        <select
          id="margin"
        >

          <option value="0">
            No margin
          </option>

          <option value="5">
            Small
          </option>

          <option value="10">
            Normal
          </option>

          <option value="20">
            Large
          </option>

        </select>

      </div>


    </section>



    <!-- Create PDF -->

    <div
      class="create-section"
    >

      <button
        id="createButton"
        type="button"
      >
        Create PDF
      </button>


      <div
        id="status"
      >
      </div>

    </div>


  </main>



  <!-- Footer -->

  <footer>

    © 2026 ToolNest
    ·
    Simple, Fast & Free

  </footer>



  <script>


    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const dropZone =
      document.getElementById(
        "dropZone"
      );


    const uploadArea =
      document.getElementById(
        "uploadArea"
      );


    const selectedArea =
      document.getElementById(
        "selectedArea"
      );


    const imagesGrid =
      document.getElementById(
        "imagesGrid"
      );


    const addMoreButton =
      document.getElementById(
        "addMoreButton"
      );


    const createButton =
      document.getElementById(
        "createButton"
      );


    const pageSize =
      document.getElementById(
        "pageSize"
      );


    const orientation =
      document.getElementById(
        "orientation"
      );


    const margin =
      document.getElementById(
        "margin"
      );


    const status =
      document.getElementById(
        "status"
      );


    let images = [];

    let draggedIndex = null;



    /* File Upload */

    imageInput.addEventListener(
      "change",
      function(event) {

        addFiles(
          Array.from(
            event.target.files
          )
        );

      }
    );



    /* Add More Images */

    addMoreButton.addEventListener(
      "click",
      function() {

        imageInput.click();

      }
    );



    /* Drag Over */

    dropZone.addEventListener(
      "dragover",
      function(event) {

        event.preventDefault();

        dropZone.classList.add(
          "drag-over"
        );

      }
    );



    /* Drag Leave */

    dropZone.addEventListener(
      "dragleave",
      function() {

        dropZone.classList.remove(
          "drag-over"
        );

      }
    );



    /* Drop Files */

    dropZone.addEventListener(
      "drop",
      function(event) {

        event.preventDefault();

        dropZone.classList.remove(
          "drag-over"
        );


        const files =
          Array.from(
            event.dataTransfer.files
          );


        addFiles(
          files
        );

      }
    );



    /* Add Files */

    function addFiles(files) {

      const validFiles =
        files.filter(
          function(file) {

            return (
              file.type === "image/jpeg"
              ||
              file.type === "image/png"
              ||
              file.type === "image/webp"
            );

          }
        );


      if (
        validFiles.length === 0
      ) {

        status.textContent =
          "Please upload JPG, PNG or WEBP images.";

        return;

      }


      validFiles.forEach(
        function(file) {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              images.push({

                name:
                  file.name,

                data:
                  event.target.result

              });


              displayImages();

            };


          reader.readAsDataURL(
            file
          );

        }
      );


      status.textContent =
        "";

    }



    /* Display Images */

    function displayImages() {

      imagesGrid.innerHTML =
        "";


      if (
        images.length === 0
      ) {

        uploadArea.style.display =
          "flex";


        selectedArea.style.display =
          "none";


        return;

      }


      uploadArea.style.display =
        "none";


      selectedArea.style.display =
        "block";


      images.forEach(
        function(image, index) {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "image-item";


          item.draggable =
            true;


          item.dataset.index =
            index;



          /* Controls */

          const controls =
            document.createElement(
              "div"
            );


          controls.className =
            "image-controls";


          const removeButton =
            document.createElement(
              "button"
            );


          removeButton.className =
            "image-control remove-button";


          removeButton.type =
            "button";


          removeButton.innerHTML =
            "🗑";


          removeButton.title =
            "Remove image";


          removeButton.addEventListener(
            "click",
            function() {

              images.splice(
                index,
                1
              );


              displayImages();

            }
          );


          controls.appendChild(
            removeButton
          );



          /* Preview */

          const preview =
            document.createElement(
              "img"
            );


          preview.className =
            "image-preview";


          preview.src =
            image.data;


          preview.alt =
            image.name;



          /* Name */

          const name =
            document.createElement(
              "div"
            );


          name.className =
            "image-name";


          name.textContent =
            image.name;



          item.appendChild(
            controls
          );


          item.appendChild(
            preview
          );


          item.appendChild(
            name
          );


          /* Drag Events */

          item.addEventListener(
            "dragstart",
            function() {

              draggedIndex =
                index;


              item.classList.add(
                "dragging"
              );

            }
          );


          item.addEventListener(
            "dragend",
            function() {

              item.classList.remove(
                "dragging"
              );


              draggedIndex =
                null;

            }
          );


          item.addEventListener(
            "dragover",
            function(event) {

              event.preventDefault();

            }
          );


          item.addEventListener(
            "drop",
            function(event) {

              event.preventDefault();


              const targetIndex =
                index;


              if (
                draggedIndex === null
                ||
                draggedIndex === targetIndex
              ) {

                return;

              }


              const movedImage =
                images.splice(
                  draggedIndex,
                  1
                )[0];


              images.splice(
                targetIndex,
                0,
                movedImage
              );


              displayImages();

            }
          );


          imagesGrid.appendChild(
            item
          );

        }
      );

    }



    /* Create PDF */

    createButton.addEventListener(
      "click",
      async function() {


        if (
          images.length === 0
        ) {

          status.textContent =
            "Please upload at least one image.";

          return;

        }


        createButton.disabled =
          true;


        createButton.textContent =
          "Creating PDF...";


        status.textContent =
          "Please wait while your PDF is being created.";


        try {


          const {
            jsPDF
          } =
            window.jspdf;


          const selectedMargin =
            Number(
              margin.value
            );


          let pdf =
            null;


          for (
            let i = 0;
            i < images.length;
            i++
          ) {


            const image =
              images[i];


            const imageElement =
              new Image();


            await new Promise(
              function(resolve) {

                imageElement.onload =
                  resolve;


                imageElement.src =
                  image.data;

              }
            );


            let pageOrientation =
              orientation.value;


            if (
              pageOrientation ===
              "auto"
            ) {

              pageOrientation =
                imageElement.width >
                imageElement.height

                  ? "landscape"
                  : "portrait";

            }


            if (
              i === 0
            ) {

              pdf =
                new jsPDF({

                  orientation:
                    pageOrientation,

                  unit:
                    "mm",

                  format:
                    pageSize.value

                });

            }

            else {

              pdf.addPage(
                pageSize.value,
                pageOrientation
              );

            }


            const pageWidth =
              pdf.internal.pageSize.getWidth();


            const pageHeight =
              pdf.internal.pageSize.getHeight();


            const availableWidth =
              pageWidth -
              (
                selectedMargin * 2
              );


            const availableHeight =
              pageHeight -
              (
                selectedMargin * 2
              );


            const ratio =
              Math.min(

                availableWidth /
                imageElement.width,

                availableHeight /
                imageElement.height

              );


            const imageWidth =
              imageElement.width *
              ratio;


            const imageHeight =
              imageElement.height *
              ratio;


            const x =
              (
                pageWidth -
                imageWidth
              )
              / 2;


            const y =
              (
                pageHeight -
                imageHeight
              )
              / 2;


            pdf.addImage(

              image.data,

              "JPEG",

              x,

              y,

              imageWidth,

              imageHeight

            );

          }


          pdf.save(
            "toolnest-images.pdf"
          );


          status.textContent =
            "Your PDF was created successfully!";


        }

        catch(error) {

          console.error(
            error
          );


          status.textContent =
            "Something went wrong while creating the PDF.";

        }


        createButton.disabled =
          false;


        createButton.textContent =
          "Create PDF";

      }
    );


  </script>


</body>

</html>
