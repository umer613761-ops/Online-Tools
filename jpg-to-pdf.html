<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Images to PDF - Free Online Tool | ToolNest
  </title>

  <meta
    name="description"
    content="Convert multiple JPG, PNG and WEBP images into a PDF online for free."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }


    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;

      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;

      text-decoration: none;
      color: #222;
    }

    .logo span {
      color: #666;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      color: #000;
    }


    /* Main */

    .container {
      max-width: 950px;
      margin: 0 auto;

      padding: 55px 20px 80px;
    }


    /* Heading */

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .heading h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .heading p {
      margin: 0;

      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }


    /* Tool Box */

    .tool-box {
      background: #ffffff;

      border: 1px solid #e5e5e5;
      border-radius: 14px;

      padding: 30px;
    }


    /* Upload Area */

    .upload-area {
      display: block;

      border: 2px dashed #ccc;
      border-radius: 12px;

      padding: 45px 20px;

      text-align: center;
      cursor: pointer;

      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #888;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .upload-area h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .upload-area p {
      margin: 0;

      color: #777;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }


    /* Selected Images */

    .images-section {
      display: none;
      margin-top: 35px;
    }

    .images-section h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .images-help {
      margin: 0 0 20px;

      color: #777;
      font-size: 14px;
    }

    .image-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(160px, 1fr));

      gap: 15px;
    }


    /* Image Card */

    .image-card {
      position: relative;

      background: #f6f7fb;

      border: 1px solid #e5e5e5;
      border-radius: 10px;

      padding: 10px;

      cursor: grab;
    }

    .image-card.dragging {
      opacity: 0.5;
    }

    .image-card img {
      width: 100%;
      height: 130px;

      display: block;

      object-fit: cover;

      border-radius: 7px;
    }

    .image-name {
      margin-top: 10px;

      font-size: 12px;
      color: #666;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Remove Button */

    .remove-button {
      position: absolute;

      top: 16px;
      right: 16px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: #222;
      color: white;

      font-size: 18px;
      line-height: 1;

      cursor: pointer;
    }

    .remove-button:hover {
      opacity: 0.8;
    }


    /* Settings */

    .settings {
      display: none;

      margin-top: 35px;

      padding-top: 30px;

      border-top: 1px solid #e5e5e5;
    }

    .settings h2 {
      margin: 0 0 20px;
      font-size: 22px;
    }

    .settings-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .setting-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: bold;
    }

    select {
      width: 100%;

      padding: 12px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: white;

      font-size: 15px;
      color: #222;
    }

    select:focus {
      outline: none;
      border-color: #777;
    }


    /* Actions */

    .actions {
      display: none;

      margin-top: 30px;

      text-align: center;
    }

    button {
      border: none;
      border-radius: 8px;

      padding: 14px 25px;

      font-size: 16px;
      cursor: pointer;

      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .create-button {
      background: #222;
      color: white;

      min-width: 180px;
    }

    .clear-button {
      margin-left: 10px;

      background: #e9e9e9;
      color: #222;
    }


    /* Status */

    .status {
      margin-top: 18px;

      text-align: center;

      color: #777;
      font-size: 14px;
    }


    /* Footer */

    footer {
      text-align: center;

      padding: 35px 20px;

      background: #ffffff;
      border-top: 1px solid #e5e5e5;

      color: #777;
      font-size: 14px;
    }


    /* Mobile */

    @media (max-width: 650px) {

      nav {
        padding: 15px 20px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        padding: 45px 15px 60px;
      }

      .heading h1 {
        font-size: 30px;
      }

      .tool-box {
        padding: 20px;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .image-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .clear-button {
        margin-left: 0;
        margin-top: 10px;
      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>


  <!-- Main -->

  <main class="container">


    <!-- Heading -->

    <div class="heading">

      <h1>
        Images to PDF
      </h1>

      <p>
        Convert your images into a PDF quickly and easily.
        Upload multiple images and arrange them in any order.
      </p>

    </div>


    <!-- Tool -->

    <div class="tool-box">


      <!-- Upload -->

      <label
        for="imageInput"
        class="upload-area"
      >

        <div class="upload-icon">
          🖼️
        </div>

        <h2>
          Upload Images
        </h2>

        <p>
          Select JPG, PNG or WEBP images from your device.
        </p>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >


      <!-- Selected Images -->

      <section
        class="images-section"
        id="imagesSection"
      >

        <h2>
          Selected Images
        </h2>

        <p class="images-help">
          Drag images to change their order.
        </p>


        <div
          class="image-grid"
          id="imageGrid"
        >
        </div>

      </section>


      <!-- Settings -->

      <section
        class="settings"
        id="settings"
      >

        <h2>
          PDF Settings
        </h2>


        <div class="settings-grid">


          <div class="setting-group">

            <label for="pageSize">
              Page Size
            </label>

            <select id="pageSize">

              <option value="a4">
                A4
              </option>

              <option value="letter">
                Letter
              </option>

              <option value="a3">
                A3
              </option>

            </select>

          </div>


          <div class="setting-group">

            <label for="orientation">
              Orientation
            </label>

            <select id="orientation">

              <option value="auto">
                Automatic
              </option>

              <option value="portrait">
                Portrait
              </option>

              <option value="landscape">
                Landscape
              </option>

            </select>

          </div>


          <div class="setting-group">

            <label for="margin">
              Margin
            </label>

            <select id="margin">

              <option value="0">
                No Margin
              </option>

              <option value="10">
                Small
              </option>

              <option value="20">
                Medium
              </option>

            </select>

          </div>


        </div>

      </section>


      <!-- Actions -->

      <div
        class="actions"
        id="actions"
      >

        <button
          class="create-button"
          id="createButton"
        >
          Create PDF
        </button>


        <button
          class="clear-button"
          id="clearButton"
        >
          Clear Images
        </button>


        <div
          class="status"
          id="status"
        >
        </div>

      </div>


    </div>


  </main>


  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>


  <!-- PDF Library -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  >
  </script>


  <script>


    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const imageGrid =
      document.getElementById(
        "imageGrid"
      );


    const imagesSection =
      document.getElementById(
        "imagesSection"
      );


    const settings =
      document.getElementById(
        "settings"
      );


    const actions =
      document.getElementById(
        "actions"
      );


    const status =
      document.getElementById(
        "status"
      );


    const createButton =
      document.getElementById(
        "createButton"
      );


    const clearButton =
      document.getElementById(
        "clearButton"
      );


    let images = [];

    let draggedIndex = null;


    /* Upload Images */

    imageInput.addEventListener(
      "change",
      function(event) {

        const files =
          Array.from(
            event.target.files
          );


        files.forEach(
          function(file) {

            if (
              !file.type.startsWith(
                "image/"
              )
            ) {
              return;
            }


            const reader =
              new FileReader();


            reader.onload =
              function(e) {

                images.push({

                  name:
                    file.name,

                  data:
                    e.target.result

                });


                renderImages();

              };


            reader.readAsDataURL(
              file
            );

          }
        );


        imageInput.value =
          "";

      }
    );


    /* Render Images */

    function renderImages() {

      imageGrid.innerHTML =
        "";


      images.forEach(
        function(image, index) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "image-card";


          card.draggable =
            true;


          card.dataset.index =
            index;


          card.innerHTML =
            `

            <button
              class="remove-button"
              type="button"
              title="Remove image"
            >
              ×
            </button>


            <img
              src="${image.data}"
              alt="${image.name}"
            >


            <div class="image-name">
              ${image.name}
            </div>

            `;


          /* Remove Image */

          card
            .querySelector(
              ".remove-button"
            )
            .addEventListener(
              "click",
              function() {

                images.splice(
                  index,
                  1
                );


                renderImages();

              }
            );


          /* Drag Start */

          card.addEventListener(
            "dragstart",
            function() {

              draggedIndex =
                index;


              card.classList.add(
                "dragging"
              );

            }
          );


          /* Drag End */

          card.addEventListener(
            "dragend",
            function() {

              card.classList.remove(
                "dragging"
              );

            }
          );


          /* Drag Over */

          card.addEventListener(
            "dragover",
            function(event) {

              event.preventDefault();

            }
          );


          /* Drop */

          card.addEventListener(
            "drop",
            function(event) {

              event.preventDefault();


              const targetIndex =
                index;


              if (
                draggedIndex === null
                ||
                draggedIndex === targetIndex
              ) {
                return;
              }


              const movedImage =
                images.splice(
                  draggedIndex,
                  1
                )[0];


              images.splice(
                targetIndex,
                0,
                movedImage
              );


              draggedIndex =
                null;


              renderImages();

            }
          );


          imageGrid.appendChild(
            card
          );

        }
      );


      /* Show Sections */

      if (
        images.length > 0
      ) {

        imagesSection.style.display =
          "block";


        settings.style.display =
          "block";


        actions.style.display =
          "block";


        status.textContent =
          images.length
          +
          (
            images.length === 1
              ? " image selected."
              : " images selected."
          );

      }


      /* Hide Sections */

      else {

        imagesSection.style.display =
          "none";


        settings.style.display =
          "none";


        actions.style.display =
          "none";

      }

    }


    /* Clear Images */

    clearButton.addEventListener(
      "click",
      function() {

        images =
          [];


        imageGrid.innerHTML =
          "";


        renderImages();

      }
    );


    /* Create PDF */

    createButton.addEventListener(
      "click",
      async function() {


        if (
          images.length === 0
        ) {

          return;

        }


        createButton.textContent =
          "Creating PDF...";


        createButton.disabled =
          true;


        const {
          jsPDF
        } =
          window.jspdf;


        const pageSize =
          document.getElementById(
            "pageSize"
          ).value;


        const orientation =
          document.getElementById(
            "orientation"
          ).value;


        const margin =
          parseInt(
            document.getElementById(
              "margin"
            ).value
          );


        let pdfOrientation =
          orientation;


        if (
          orientation === "auto"
        ) {

          pdfOrientation =
            "portrait";

        }


        let pdf =
          new jsPDF({

            orientation:
              pdfOrientation,

            unit:
              "mm",

            format:
              pageSize

          });


        for (
          let i = 0;
          i < images.length;
          i++
        ) {


          if (
            i > 0
          ) {

            pdf.addPage();

          }


          const image =
            new Image();


          await new Promise(
            function(resolve) {


              image.onload =
                resolve;


              image.src =
                images[i].data;

            }
          );


          let pageWidth =
            pdf.internal.pageSize.getWidth();


          let pageHeight =
            pdf.internal.pageSize.getHeight();


          /* Automatic Orientation */

          if (
            orientation === "auto"
          ) {


            const imageLandscape =
              image.width >
              image.height;


            const pageLandscape =
              pageWidth >
              pageHeight;


            if (
              imageLandscape !==
              pageLandscape
            ) {

              pdf.deletePage(
                pdf.internal.getNumberOfPages()
              );


              pdf.addPage(
                pageSize,
                imageLandscape
                  ? "landscape"
                  : "portrait"
              );


              pageWidth =
                pdf.internal.pageSize.getWidth();


              pageHeight =
                pdf.internal.pageSize.getHeight();

            }

          }


          const availableWidth =
            pageWidth -
            margin * 2;


          const availableHeight =
            pageHeight -
            margin * 2;


          const imageRatio =
            image.width /
            image.height;


          const availableRatio =
            availableWidth /
            availableHeight;


          let finalWidth;
          let finalHeight;


          if (
            imageRatio >
            availableRatio
          ) {

            finalWidth =
              availableWidth;


            finalHeight =
              availableWidth /
              imageRatio;

          }

          else {

            finalHeight =
              availableHeight;


            finalWidth =
              availableHeight *
              imageRatio;

          }


          const x =
            (
              pageWidth -
              finalWidth
            ) / 2;


          const y =
            (
              pageHeight -
              finalHeight
            ) / 2;


          pdf.addImage(

            images[i].data,

            "JPEG",

            x,

            y,

            finalWidth,

            finalHeight

          );

        }


        pdf.save(
          "toolnest-images.pdf"
        );


        createButton.textContent =
          "Create PDF";


        createButton.disabled =
          false;

      }
    );


  </script>


</body>

</html>
