<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PDF to Images - Free Online Tool | ToolNest
  </title>

  <meta
    name="description"
    content="Convert PDF pages to JPG or PNG images online for free."
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family: Arial, sans-serif;

      background: #f6f7fb;
      color: #222;
    }


    /* Navigation */

    nav {
      background: #ffffff;

      border-bottom:
        1px solid #e5e5e5;

      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .logo {
      font-size: 24px;

      font-weight: bold;

      text-decoration: none;

      color: #222;
    }


    .logo span {
      color: #666;
    }


    .back-link {
      color: #555;

      text-decoration: none;

      font-size: 15px;
    }


    .back-link:hover {
      color: #000;
    }


    /* Main */

    .container {
      max-width: 900px;

      margin: 0 auto;

      padding:
        60px 20px
        80px;
    }


    /* Heading */

    .heading {
      text-align: center;

      margin-bottom: 35px;
    }


    .heading h1 {
      margin:
        0 0 12px;

      font-size: 38px;
    }


    .heading p {
      margin: 0;

      color: #777;

      font-size: 16px;

      line-height: 1.6;
    }


    /* Tool Box */

    .tool-box {
      background: #ffffff;

      border:
        1px solid #e5e5e5;

      border-radius: 14px;

      padding: 30px;
    }


    /* Upload Area */

    .upload-area {
      display: block;

      border:
        2px dashed #ccc;

      border-radius: 12px;

      padding:
        55px 20px;

      text-align: center;

      cursor: pointer;

      transition:
        border-color 0.2s,
        background 0.2s;
    }


    .upload-area:hover {
      border-color: #888;

      background: #fafafa;
    }


    .upload-icon {
      font-size: 48px;

      margin-bottom: 15px;
    }


    .upload-area h2 {
      margin:
        0 0 10px;

      font-size: 21px;
    }


    .upload-area p {
      margin: 0;

      color: #777;

      font-size: 14px;
    }


    input[type="file"] {
      display: none;
    }


    /* Editor */

    .editor {
      display: none;

      margin-top: 30px;
    }


    /* File Information */

    .file-info {
      text-align: center;

      margin-bottom: 30px;
    }


    .file-name {
      font-size: 16px;

      font-weight: bold;

      margin-bottom: 8px;

      word-break: break-word;
    }


    .page-count {
      color: #777;

      font-size: 14px;
    }


    /* Format Settings */

    .settings {
      border-top:
        1px solid #e5e5e5;

      padding-top: 25px;

      margin-bottom: 30px;
    }


    .settings h2 {
      margin:
        0 0 18px;

      font-size: 21px;
    }


    .format-options {
      display: flex;

      gap: 15px;

      flex-wrap: wrap;
    }


    .format-option {
      flex: 1;

      min-width: 180px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      padding: 18px;

      cursor: pointer;

      transition:
        border-color 0.2s,
        background 0.2s;
    }


    .format-option:hover {
      border-color: #999;

      background: #fafafa;
    }


    .format-option input {
      margin-right: 8px;
    }


    .format-option strong {
      font-size: 16px;
    }


    .format-option span {
      display: block;

      color: #777;

      font-size: 13px;

      margin-top: 7px;

      margin-left: 23px;
    }


    /* Convert Button */

    .convert-section {
      text-align: center;

      margin-bottom: 30px;
    }


    button {
      border: none;

      border-radius: 8px;

      padding:
        13px 22px;

      font-size: 15px;

      cursor: pointer;

      transition:
        opacity 0.2s;
    }


    button:hover {
      opacity: 0.85;
    }


    .primary-button {
      background: #222;

      color: white;
    }


    .secondary-button {
      background: #e9e9e9;

      color: #222;
    }


    .convert-button {
      padding:
        14px 35px;

      font-size: 16px;
    }


    /* Results */

    .results {
      display: none;

      border-top:
        1px solid #e5e5e5;

      padding-top: 30px;
    }


    .results h2 {
      margin:
        0 0 8px;

      font-size: 21px;
    }


    .results-description {
      margin:
        0 0 25px;

      color: #777;

      font-size: 14px;
    }


    /* Image Grid */

    .image-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 20px;
    }


    .image-card {
      border:
        1px solid #e5e5e5;

      border-radius: 12px;

      overflow: hidden;

      background: #fafafa;
    }


    .image-preview {
      width: 100%;

      height: 220px;

      display: flex;

      justify-content: center;
      align-items: center;

      background: #f3f4f6;

      padding: 10px;
    }


    .image-preview img {
      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      border-radius: 4px;
    }


    .image-details {
      padding: 15px;
    }


    .image-details h3 {
      margin:
        0 0 12px;

      font-size: 15px;
    }


    .download-button {
      width: 100%;

      background: #222;

      color: white;
    }


    /* Bottom Buttons */

    .bottom-actions {
      display: flex;

      justify-content: center;

      gap: 12px;

      margin-top: 30px;

      flex-wrap: wrap;
    }


    /* Loading */

    .loading {
      display: none;

      text-align: center;

      color: #777;

      margin:
        20px 0;
    }


    /* Footer */

    footer {
      text-align: center;

      padding:
        35px 20px;

      background: #ffffff;

      border-top:
        1px solid #e5e5e5;

      color: #777;

      font-size: 14px;
    }


    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding:
          15px 20px;
      }


      .logo {
        font-size: 21px;
      }


      .container {
        padding:
          45px 15px
          60px;
      }


      .heading h1 {
        font-size: 30px;
      }


      .tool-box {
        padding: 20px;
      }


      .format-options {
        flex-direction: column;
      }


      .format-option {
        width: 100%;
      }


      .image-grid {
        grid-template-columns:
          1fr;
      }


      .bottom-actions {
        flex-direction: column;
      }


      .bottom-actions button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- Main -->

  <main class="container">


    <!-- Heading -->

    <div class="heading">

      <h1>
        PDF to Images
      </h1>

      <p>
        Convert every page of your PDF into
        high-quality JPG or PNG images.
      </p>

    </div>



    <!-- Tool -->

    <div class="tool-box">


      <!-- Upload -->

      <label
        for="pdfInput"
        class="upload-area"
      >

        <div class="upload-icon">
          📄
        </div>


        <h2>
          Upload a PDF
        </h2>


        <p>
          Click here to choose a PDF from your device.
        </p>

      </label>


      <input
        type="file"
        id="pdfInput"
        accept="application/pdf"
      >



      <!-- Editor -->

      <div
        class="editor"
        id="editor"
      >


        <!-- File Info -->

        <div class="file-info">

          <div
            class="file-name"
            id="fileName"
          >
          </div>


          <div
            class="page-count"
            id="pageCount"
          >
          </div>

        </div>



        <!-- Format -->

        <div class="settings">

          <h2>
            Image Format
          </h2>


          <div class="format-options">


            <!-- PNG -->

            <label class="format-option">

              <input
                type="radio"
                name="format"
                value="png"
                checked
              >

              <strong>
                PNG
              </strong>


              <span>
                High quality with no compression.
              </span>

            </label>



            <!-- JPG -->

            <label class="format-option">

              <input
                type="radio"
                name="format"
                value="jpg"
              >

              <strong>
                JPG
              </strong>


              <span>
                Smaller file size for photos and images.
              </span>

            </label>


          </div>

        </div>



        <!-- Convert -->

        <div class="convert-section">

          <button
            class="primary-button convert-button"
            id="convertButton"
          >
            Convert PDF
          </button>

        </div>



        <!-- Loading -->

        <div
          class="loading"
          id="loading"
        >
          Converting your PDF...
        </div>



        <!-- Results -->

        <div
          class="results"
          id="results"
        >

          <h2>
            Converted Images
          </h2>


          <p class="results-description">
            Preview and download each converted page.
          </p>


          <div
            class="image-grid"
            id="imageGrid"
          >
          </div>

        </div>



        <!-- Bottom Actions -->

        <div class="bottom-actions">

          <button
            class="secondary-button"
            id="newPdfButton"
          >
            Choose Another PDF
          </button>

        </div>


      </div>


    </div>


  </main>



  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>



  <!-- PDF.js -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  >
  </script>



  <script>


    const pdfInput =
      document.getElementById(
        "pdfInput"
      );


    const editor =
      document.getElementById(
        "editor"
      );


    const fileName =
      document.getElementById(
        "fileName"
      );


    const pageCount =
      document.getElementById(
        "pageCount"
      );


    const convertButton =
      document.getElementById(
        "convertButton"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const results =
      document.getElementById(
        "results"
      );


    const imageGrid =
      document.getElementById(
        "imageGrid"
      );


    const newPdfButton =
      document.getElementById(
        "newPdfButton"
      );


    let selectedFile = null;

    let pdfDocument = null;



    /* Upload PDF */

    pdfInput.addEventListener(
      "change",
      async function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        if (
          file.type !==
          "application/pdf"
        ) {

          alert(
            "Please select a PDF file."
          );

          return;

        }


        selectedFile =
          file;


        fileName.textContent =
          file.name;


        try {

          const fileData =
            await file.arrayBuffer();


          const loadingTask =
            pdfjsLib.getDocument(
              {
                data:
                  fileData
              }
            );


          pdfDocument =
            await loadingTask.promise;


          pageCount.textContent =
            pdfDocument.numPages
            +
            (
              pdfDocument.numPages === 1
                ? " page"
                : " pages"
            );


          editor.style.display =
            "block";


          results.style.display =
            "none";


          imageGrid.innerHTML =
            "";

        }

        catch (error) {

          alert(
            "This PDF could not be opened."
          );


          console.error(
            error
          );

        }

      }
    );



    /* Convert PDF */

    convertButton.addEventListener(
      "click",
      async function() {

        if (!pdfDocument) {
          return;
        }


        loading.style.display =
          "block";


        results.style.display =
          "none";


        imageGrid.innerHTML =
          "";


        convertButton.disabled =
          true;


        const selectedFormat =
          document.querySelector(
            'input[name="format"]:checked'
          ).value;


        try {


          for (
            let pageNumber = 1;

            pageNumber <=
            pdfDocument.numPages;

            pageNumber++
          ) {


            const page =
              await pdfDocument.getPage(
                pageNumber
              );


            const viewport =
              page.getViewport(
                {
                  scale: 2
                }
              );


            const canvas =
              document.createElement(
                "canvas"
              );


            const context =
              canvas.getContext(
                "2d"
              );


            canvas.width =
              viewport.width;


            canvas.height =
              viewport.height;


            if (
              selectedFormat ===
              "jpg"
            ) {

              context.fillStyle =
                "#ffffff";


              context.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
              );

            }


            await page.render(
              {
                canvasContext:
                  context,

                viewport:
                  viewport
              }
            ).promise;


            let imageData;


            if (
              selectedFormat ===
              "png"
            ) {

              imageData =
                canvas.toDataURL(
                  "image/png"
                );

            }

            else {

              imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  0.92
                );

            }


            createImageCard(
              imageData,
              pageNumber,
              selectedFormat
            );


          }


          results.style.display =
            "block";

        }

        catch (error) {

          alert(
            "Something went wrong while converting the PDF."
          );


          console.error(
            error
          );

        }

        finally {

          loading.style.display =
            "none";


          convertButton.disabled =
            false;

        }

      }
    );



    /* Create Image Card */

    function createImageCard(
      imageData,
      pageNumber,
      format
    ) {


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "image-card";


      const previewContainer =
        document.createElement(
          "div"
        );


      previewContainer.className =
        "image-preview";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageData;


      image.alt =
        "PDF page "
        +
        pageNumber;


      previewContainer.appendChild(
        image
      );



      const details =
        document.createElement(
          "div"
        );


      details.className =
        "image-details";


      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        "Page "
        +
        pageNumber
        +
        " ("
        +
        format.toUpperCase()
        +
        ")";



      const downloadButton =
        document.createElement(
          "button"
        );


      downloadButton.className =
        "download-button";


      downloadButton.textContent =
        "Download "
        +
        format.toUpperCase();



      downloadButton.addEventListener(
        "click",
        function() {


          const link =
            document.createElement(
              "a"
            );


          link.href =
            imageData;


          link.download =
            "pdf-page-"
            +
            pageNumber
            +
            "."
            +
            format;


          link.click();

        }
      );


      details.appendChild(
        title
      );


      details.appendChild(
        downloadButton
      );


      card.appendChild(
        previewContainer
      );


      card.appendChild(
        details
      );


      imageGrid.appendChild(
        card
      );

    }



    /* Choose Another PDF */

    newPdfButton.addEventListener(
      "click",
      function() {


        pdfInput.value =
          "";


        selectedFile =
          null;


        pdfDocument =
          null;


        editor.style.display =
          "none";


        results.style.display =
          "none";


        imageGrid.innerHTML =
          "";


        fileName.textContent =
          "";


        pageCount.textContent =
          "";

      }
    );


  </script>


</body>

</html>
