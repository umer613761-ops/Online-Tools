<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Generator - Free Online Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .options {
      margin-top: 20px;
    }

    .option {
      margin: 12px 0;
    }

    input[type="checkbox"] {
      margin-right: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #password {
      margin-top: 25px;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Password Generator</h1>

    <p class="subtitle">
      Create a random password instantly.
    </p>

    <label for="length">Password Length</label>

    <input
      type="number"
      id="length"
      value="12"
      min="4"
      max="50"
    >

    <div class="options">

      <div class="option">
        <input type="checkbox" id="uppercase" checked>
        <label for="uppercase">Include Uppercase Letters (A-Z)</label>
      </div>

      <div class="option">
        <input type="checkbox" id="lowercase" checked>
        <label for="lowercase">Include Lowercase Letters (a-z)</label>
      </div>

      <div class="option">
        <input type="checkbox" id="numbers" checked>
        <label for="numbers">Include Numbers (0-9)</label>
      </div>

      <div class="option">
        <input type="checkbox" id="symbols">
        <label for="symbols">Include Symbols (!@#$%)</label>
      </div>

    </div>

    <button onclick="generatePassword()">
      Generate Password
    </button>

    <div id="password">
      Your password will appear here
    </div>

    <a class="back" href="index.html">
      ← Back to Homepage
    </a>

  </div>

  <script>

    function generatePassword() {

      const length =
        parseInt(document.getElementById("length").value);

      const uppercase =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const lowercase =
        "abcdefghijklmnopqrstuvwxyz";

      const numbers =
        "0123456789";

      const symbols =
        "!@#$%^&*()_+-=[]{}";

      let characters = "";

      if (document.getElementById("uppercase").checked) {
        characters += uppercase;
      }

      if (document.getElementById("lowercase").checked) {
        characters += lowercase;
      }

      if (document.getElementById("numbers").checked) {
        characters += numbers;
      }

      if (document.getElementById("symbols").checked) {
        characters += symbols;
      }

      if (characters === "") {
        document.getElementById("password").textContent =
          "Please select at least one option.";
        return;
      }

      let password = "";

      for (let i = 0; i < length; i++) {
        const randomIndex =
          Math.floor(Math.random() * characters.length);

        password += characters[randomIndex];
      }

      document.getElementById("password").textContent =
        password;
    }

  </script>

</body>
</html>
