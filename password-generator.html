<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Generator - Free Online Tools</title>

  <meta
    name="description"
    content="Generate strong random passwords with uppercase letters, lowercase letters, numbers and symbols."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #222;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Main */

    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    /* Password Result */

    .password-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #password {
      flex: 1;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f4f7fb;
      word-break: break-all;
    }

    /* Length */

    .length-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    /* Options */

    .options {
      margin-top: 25px;
    }

    .option {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }

    .option input {
      margin-right: 10px;
    }

    /* Buttons */

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .generate-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      font-size: 16px;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* Mobile */

    @media (max-width: 600px) {

      nav {
        flex-direction: column;
        gap: 10px;
      }

      .nav-links a {
        margin: 0 8px;
      }

      .container {
        margin: 20px 10px;
        padding: 20px;
      }

      .password-box {
        flex-direction: column;
      }

    }
  </style>
</head>

<body>

  <!-- Navigation -->

  <nav>

    <a href="index.html" class="logo">
      Free Online Tools
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#tools">All Tools</a>
    </div>

  </nav>


  <!-- Main -->

  <main class="container">

    <h1>Password Generator</h1>

    <p class="subtitle">
      Create a strong random password instantly.
    </p>


    <!-- Password -->

    <div class="password-box">

      <div id="password">
        Click Generate Password
      </div>

      <button onclick="copyPassword()">
        Copy
      </button>

    </div>


    <!-- Length -->

    <div class="length-row">

      <label for="length">
        Password Length
      </label>

      <strong id="lengthValue">
        12
      </strong>

    </div>

    <input
      type="range"
      id="length"
      min="6"
      max="50"
      value="12"
      oninput="updateLength()"
    >


    <!-- Options -->

    <div class="options">

      <div class="option">
        <input
          type="checkbox"
          id="uppercase"
          checked
        >

        <label for="uppercase">
          Include Uppercase Letters
        </label>
      </div>


      <div class="option">
        <input
          type="checkbox"
          id="lowercase"
          checked
        >

        <label for="lowercase">
          Include Lowercase Letters
        </label>
      </div>


      <div class="option">
        <input
          type="checkbox"
          id="numbers"
          checked
        >

        <label for="numbers">
          Include Numbers
        </label>
      </div>


      <div class="option">
        <input
          type="checkbox"
          id="symbols"
        >

        <label for="symbols">
          Include Symbols
        </label>
      </div>

    </div>


    <!-- Generate -->

    <button
      class="generate-button"
      onclick="generatePassword()"
    >
      Generate Password
    </button>

  </main>


  <!-- Footer -->

  <footer>
    © 2026 Free Online Tools
  </footer>


  <script>

    function updateLength() {

      document.getElementById(
        "lengthValue"
      ).textContent =
        document.getElementById(
          "length"
        ).value;

    }


    function generatePassword() {

      const length =
        parseInt(
          document.getElementById(
            "length"
          ).value
        );


      const uppercase =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const lowercase =
        "abcdefghijklmnopqrstuvwxyz";

      const numbers =
        "0123456789";

      const symbols =
        "!@#$%^&*()_+-=[]{}";


      let characters = "";


      if (
        document.getElementById(
          "uppercase"
        ).checked
      ) {
        characters += uppercase;
      }


      if (
        document.getElementById(
          "lowercase"
        ).checked
      ) {
        characters += lowercase;
      }


      if (
        document.getElementById(
          "numbers"
        ).checked
      ) {
        characters += numbers;
      }


      if (
        document.getElementById(
          "symbols"
        ).checked
      ) {
        characters += symbols;
      }


      if (characters === "") {

        document.getElementById(
          "password"
        ).textContent =
          "Select at least one option.";

        return;

      }


      let password = "";


      const randomValues =
        new Uint32Array(length);

      crypto.getRandomValues(
        randomValues
      );


      for (
        let i = 0;
        i < length;
        i++
      ) {

        const randomIndex =
          randomValues[i]
          % characters.length;

        password +=
          characters[randomIndex];

      }


      document.getElementById(
        "password"
      ).textContent =
        password;

    }


    function copyPassword() {

      const password =
        document.getElementById(
          "password"
        ).textContent;


      if (
        password ===
          "Click Generate Password" ||
        password ===
          "Select at least one option."
      ) {
        return;
      }


      navigator.clipboard
        .writeText(password)
        .then(function() {

          alert(
            "Password copied!"
          );

        });

    }

  </script>

</body>
</html>
