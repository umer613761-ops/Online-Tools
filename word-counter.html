<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Word Counter - Free Online Tools</title>

  <meta
    name="description"
    content="Free online word counter. Count words, characters, characters without spaces, sentences and paragraphs instantly."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #222;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Main */

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    /* Buttons */

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* Results */

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .result-card {
      background: #f4f7fb;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .result-card strong {
      display: block;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .result-card span {
      color: #666;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* Mobile */

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 10px;
      }

      .nav-links a {
        margin: 0 8px;
      }

      .container {
        margin: 20px 10px;
        padding: 20px;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation -->

  <nav>

    <a href="index.html" class="logo">
      Free Online Tools
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#tools">All Tools</a>
    </div>

  </nav>


  <!-- Main Tool -->

  <main class="container">

    <h1>Word Counter</h1>

    <p class="subtitle">
      Count words, characters, sentences and paragraphs instantly.
    </p>


    <textarea
      id="text"
      placeholder="Type or paste your text here..."
    ></textarea>


    <!-- Buttons -->

    <div class="buttons">

      <button onclick="copyText()">
        Copy Text
      </button>

      <button onclick="clearText()">
        Clear Text
      </button>

    </div>


    <!-- Results -->

    <div class="results">

      <div class="result-card">
        <strong id="words">0</strong>
        <span>Words</span>
      </div>

      <div class="result-card">
        <strong id="characters">0</strong>
        <span>Characters</span>
      </div>

      <div class="result-card">
        <strong id="noSpaces">0</strong>
        <span>Without Spaces</span>
      </div>

      <div class="result-card">
        <strong id="sentences">0</strong>
        <span>Sentences</span>
      </div>

      <div class="result-card">
        <strong id="paragraphs">0</strong>
        <span>Paragraphs</span>
      </div>

    </div>

  </main>


  <!-- Footer -->

  <footer>
    © 2026 Free Online Tools
  </footer>


  <script>

    const text =
      document.getElementById("text");


    text.addEventListener("input", updateCount);


    function updateCount() {

      const value = text.value;


      /* Words */

      const wordCount =
        value.trim() === ""
          ? 0
          : value.trim().split(/\s+/).length;

      document.getElementById("words").textContent =
        wordCount;


      /* Characters */

      document.getElementById("characters").textContent =
        value.length;


      /* Characters Without Spaces */

      document.getElementById("noSpaces").textContent =
        value.replace(/\s/g, "").length;


      /* Sentences */

      const sentenceCount =
        value.trim() === ""
          ? 0
          : value
              .split(/[.!?]+/)
              .filter(
                sentence =>
                  sentence.trim().length > 0
              ).length;

      document.getElementById("sentences").textContent =
        sentenceCount;


      /* Paragraphs */

      const paragraphCount =
        value.trim() === ""
          ? 0
          : value
              .split(/\n+/)
              .filter(
                paragraph =>
                  paragraph.trim().length > 0
              ).length;

      document.getElementById("paragraphs").textContent =
        paragraphCount;

    }


    /* Copy Text */

    function copyText() {

      navigator.clipboard.writeText(text.value);

      alert("Text copied!");

    }


    /* Clear Text */

    function clearText() {

      text.value = "";

      updateCount();

    }

  </script>

</body>
</html>
