  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
    }

    .logo span {
      color: #555;
    }

    .nav-links a {
      text-decoration: none;
      color: #555;
      margin-left: 20px;
      font-size: 15px;
    }

    .nav-links a:hover {
      color: #000;
    }

    /* Main */

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    /* Buttons */

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* Results */

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .result-card {
      background: #f4f7fb;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .result-card strong {
      display: block;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .result-card span {
      color: #666;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding: 15px 20px;
      }

      .nav-links {
        display: none;
      }

      .container {
        margin: 20px 10px;
        padding: 20px;
      }

      button {
        flex: 1;
      }

    }
  </style>

</head>

  <!-- Main Tool -->

```
<h1>Word Counter</h1>

<p class="subtitle">
  Count and analyze your words, characters, sentences and more.
</p>


<textarea
  id="text"
  placeholder="Type or paste your text here..."
></textarea>


<!-- Buttons -->

<div class="buttons">

  <button onclick="copyText()">
    Copy Text
  </button>

  <button onclick="clearText()">
    Clear Text
  </button>

</div>


<!-- Results -->

<div class="results">

  <div class="result-card">
    <strong id="words">0</strong>
    <span>Words</span>
  </div>

  <div class="result-card">
    <strong id="characters">0</strong>
    <span>Characters</span>
  </div>

  <div class="result-card">
    <strong id="noSpaces">0</strong>
    <span>Without Spaces</span>
  </div>

  <div class="result-card">
    <strong id="sentences">0</strong>
    <span>Sentences</span>
  </div>

  <div class="result-card">
    <strong id="paragraphs">0</strong>
    <span>Paragraphs</span>
  </div>

  <div class="result-card">
    <strong id="readingTime">0 min</strong>
    <span>Reading Time</span>
  </div>

  <div class="result-card">
    <strong id="speakingTime">0 min</strong>
    <span>Speaking Time</span>
  </div>

  <div class="result-card">
    <strong id="averageWordLength">0</strong>
    <span>Avg. Word Length</span>
  </div>

</div>
```

  </main>

  <!-- Footer -->

  <footer>
    © 2026 Text Tools · Simple, Fast & Free
  </footer>

  <script>

    const text =
      document.getElementById("text");


    text.addEventListener(
      "input",
      updateCount
    );


    function updateCount() {

      const value =
        text.value;


      /* Get Words */

      const words =
        value.trim() === ""
          ? []
          : value
              .trim()
              .split(/\s+/);


      const wordCount =
        words.length;


      document.getElementById(
        "words"
      ).textContent =
        wordCount;


      /* Characters */

      document.getElementById(
        "characters"
      ).textContent =
        value.length;


      /* Characters Without Spaces */

      document.getElementById(
        "noSpaces"
      ).textContent =
        value
          .replace(/\s/g, "")
          .length;


      /* Sentences */

      const sentenceCount =
        value.trim() === ""
          ? 0
          : value
              .split(/[.!?]+/)
              .filter(
                sentence =>
                  sentence.trim().length > 0
              ).length;


      document.getElementById(
        "sentences"
      ).textContent =
        sentenceCount;


      /* Paragraphs */

      const paragraphCount =
        value.trim() === ""
          ? 0
          : value
              .split(/\n+/)
              .filter(
                paragraph =>
                  paragraph.trim().length > 0
              ).length;


      document.getElementById(
        "paragraphs"
      ).textContent =
        paragraphCount;


      /* Reading Time */

      const readingMinutes =
        Math.ceil(
          wordCount / 200
        );


      document.getElementById(
        "readingTime"
      ).textContent =
        wordCount === 0
          ? "0 min"
          : readingMinutes + " min";


      /* Speaking Time */

      const speakingMinutes =
        Math.ceil(
          wordCount / 130
        );


      document.getElementById(
        "speakingTime"
      ).textContent =
        wordCount === 0
          ? "0 min"
          : speakingMinutes + " min";


      /* Average Word Length */

      const totalLetters =
        words.reduce(
          function(total, word) {

            return (
              total +
              word.replace(
                /[^a-zA-Z0-9]/g,
                ""
              ).length
            );

          },
          0
        );


      const averageLength =
        wordCount === 0
          ? 0
          : (
              totalLetters /
              wordCount
            ).toFixed(1);


      document.getElementById(
        "averageWordLength"
      ).textContent =
        averageLength;

    }


    /* Copy Text */

    function copyText() {

      if (text.value === "") {

        alert(
          "There is no text to copy."
        );

        return;

      }


      navigator.clipboard
        .writeText(
          text.value
        )
        .then(function() {

          alert(
            "Text copied!"
          );

        });

    }


    /* Clear Text */

    function clearText() {

      text.value =
        "";

      updateCount();

    }

  </script>

</body>
</html>
