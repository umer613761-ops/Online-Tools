<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}


/* =========================
   PAGE
========================= */

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #f4f3ef;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO CARD
========================= */

.logo-card {
    width: 715px;
    max-width: 100%;

    padding:
        42px
        36px
        34px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #ffffff;

    border:
        1px solid
        #e7e4de;

    border-radius: 48px;

    box-shadow:
        0 10px 30px
        rgba(45, 50, 55, 0.06);
}


/* =========================
   LOGO CONTENT

   THE WIDTH OF THIS AREA
   FOLLOWS THE TOOLNEST TEXT
========================= */

.logo-content {
    display: inline-flex;
    flex-direction: column;

    align-items: stretch;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    display: flex;
    justify-content: center;

    white-space: nowrap;

    font-size: 88px;

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


/* =========================
   TOOL
========================= */

.logo-tool {
    color: #1e2d40;

    font-weight: 900;
}


/* =========================
   NEST
========================= */

.logo-nest {
    color: #1f5db8;

    font-weight: 900;
}


/* =========================
   TAGLINE ROW

   SAME TOTAL WIDTH AS
   TOOLNEST
========================= */

.tagline-row {
    width: 100%;

    margin-top: 15px;

    display: flex;
    align-items: center;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    background: #7b8793;

    border-radius: 10px;

    opacity: 0.7;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    margin:
        0
        14px;

    color: #566474;

    font-size: 16px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: 2.8px;

    white-space: nowrap;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    body {
        padding: 18px;
    }


    .logo-card {
        padding:
            7vw
            3vw
            5vw;

        border-radius: 36px;
    }


    .logo-name {
        font-size: 12.3vw;

        letter-spacing: -0.42vw;
    }


    .tagline-row {
        margin-top: 2vw;
    }


    .tagline-line {
        height: 0.28vw;
    }


    .logo-tagline {
        margin:
            0
            2vw;

        font-size: 2.25vw;

        letter-spacing: 0.39vw;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO CARD
========================= -->

<div class="logo-card">


    <div class="logo-content">


        <!-- =========================
             TOOLNEST
        ========================= -->

        <div class="logo-name">

            <span class="logo-tool">
                TOOL
            </span>

            <span class="logo-nest">
                NEST
            </span>

        </div>



        <!-- =========================
             TAGLINE + SIDE LINES
        ========================= -->

        <div class="tagline-row">


            <!-- LEFT LINE -->

            <div class="tagline-line"></div>



            <!-- TAGLINE -->

            <div class="logo-tagline">

                SMART TOOLS. SIMPLE TASKS.

            </div>



            <!-- RIGHT LINE -->

            <div class="tagline-line"></div>


        </div>


    </div>


</div>


</body>

</html>
