<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Text Preview</title>

<style>

/* =========================
   PAGE PREVIEW
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f4f5f7;

    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   LOGO TEXT CONTAINER
========================= */

.logo-preview {
    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 50px 70px;

    background: #ffffff;
}


/* =========================
   MAIN LOGO NAME
========================= */

.logo-name {
    display: flex;
    align-items: baseline;

    line-height: 1;

    white-space: nowrap;

    letter-spacing: -2px;
}


/* =========================
   TOOL
========================= */

.logo-tool {
    color: #34465b;

    font-size: 58px;

    font-weight: 500;

    letter-spacing: -2.5px;
}


/* =========================
   NEST
========================= */

.logo-nest {
    color: #426c9c;

    font-size: 58px;

    font-weight: 700;

    letter-spacing: -2.5px;
}


/* =========================
   TAGLINE ROW
========================= */

.logo-tagline-row {
    width: 100%;

    margin-top: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 14px;

    white-space: nowrap;
}


/* =========================
   TAGLINE LINES
========================= */

.tagline-line {
    width: 42px;

    height: 1px;

    background: #788491;
}


/* =========================
   TAGLINE TEXT
========================= */

.logo-tagline {
    color: #536273;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 2.5px;

    line-height: 1;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo-preview {
        padding: 35px 20px;
    }

    .logo-tool,
    .logo-nest {
        font-size: 42px;

        letter-spacing: -2px;
    }

    .logo-tagline-row {
        margin-top: 14px;

        gap: 9px;
    }

    .tagline-line {
        width: 25px;
    }

    .logo-tagline {
        font-size: 8px;

        letter-spacing: 1.5px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TEXT-ONLY TOOLNEST LOGO
========================= -->

<div class="logo-preview">


    <!-- MAIN NAME -->

    <div class="logo-name">

        <span class="logo-tool">Tool</span>

        <span class="logo-nest">Nest</span>

    </div>


    <!-- TAGLINE -->

    <div class="logo-tagline-row">

        <div class="tagline-line"></div>

        <div class="logo-tagline">
            SMART TOOLS. SIMPLE TASKS.
        </div>

        <div class="tagline-line"></div>

    </div>


</div>


</body>

</html>
