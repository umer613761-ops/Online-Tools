<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToolNest Logo</title>

    <style>

        /* =========================
           PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f7fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================
           LOGO CONTAINER
        ========================= */

        .logo {
            display: inline-flex;

            flex-direction: column;
            align-items: center;

            text-decoration: none;

            padding: 30px;
        }


        /* =========================
           TOOLNEST
        ========================= */

        .logo-name {
            display: flex;
            align-items: center;

            color: #243447;

            font-size: 64px;
            font-weight: 700;

            letter-spacing: -2px;

            line-height: 1;
        }


        /* TOOL */

        .logo-tool {
            color: #243447;

            font-weight: 700;
        }


        /* NEST */

        .logo-nest {
            color: #2f6ea8;

            font-weight: 800;
        }


        /* =========================
           TAGLINE ROW
        ========================= */

        .tagline-row {
            width: 100%;

            margin-top: 18px;

            display: flex;
            align-items: center;

            gap: 16px;
        }


        /* =========================
           LINES
        ========================= */

        .tagline-line {
            flex: 1;

            height: 1px;

            background: #7b8998;
        }


        /* =========================
           TAGLINE
        ========================= */

        .logo-tagline {
            color: #566779;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 4px;

            white-space: nowrap;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .logo-name {
                font-size: 42px;

                letter-spacing: -1px;
            }

            .tagline-row {
                margin-top: 14px;

                gap: 10px;
            }

            .logo-tagline {
                font-size: 8px;

                letter-spacing: 2px;
            }

        }

    </style>
</head>

<body>


    <!-- =========================
         TOOLNEST LOGO
    ========================= -->

    <a
        href="#"
        class="logo"
        aria-label="ToolNest Home"
    >

        <!-- BRAND NAME -->

        <div class="logo-name">

            <span class="logo-tool">
                TOOL
            </span>

            <span class="logo-nest">
                NEST
            </span>

        </div>


        <!-- TAGLINE -->

        <div class="tagline-row">

            <div class="tagline-line"></div>

            <div class="logo-tagline">
                SMART TOOLS. SIMPLE TASKS.
            </div>

            <div class="tagline-line"></div>

        </div>

    </a>


</body>
</html>
