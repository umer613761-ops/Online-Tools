<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo</title>

<style>

/* =========================
   PAGE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO AREA
   MATCHES REFERENCE SHAPE
========================= */

.logo-preview {
    width: 715px;
    max-width: 100%;

    padding: 32px 18px 16px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #f6f6f7 55%,
            #eceef1 100%
        );
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;

    font-size: 90px;
    line-height: 1;

    letter-spacing: -3px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-weight: 900;
}


/* =========================
   TOOL
========================= */

.logo-tool {
    color: #1f2f43;

    font-weight: 900;
}


/* =========================
   NEST
========================= */

.logo-nest {
    color: #1f5db9;

    font-weight: 900;
}


/* =========================
   TAGLINE ROW
========================= */

.tagline-row {
    width: 100%;

    margin-top: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 17px;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    background: #6d7782;

    opacity: 0.75;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    color: #566474;

    font-size: 24px;

    line-height: 1;

    font-weight: 700;

    letter-spacing: 5px;

    white-space: nowrap;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 715px) {

    .logo-preview {
        padding:
            4.5vw
            2.5vw
            2.2vw;
    }

    .logo-name {
        font-size: 12.6vw;

        letter-spacing: -0.42vw;
    }

    .tagline-row {
        margin-top: 1.8vw;

        gap: 2.3vw;
    }

    .tagline-line {
        height: 0.28vw;
    }

    .logo-tagline {
        font-size: 3.35vw;

        letter-spacing: 0.7vw;
    }

}

</style>
</head>

<body>


<div class="logo-preview">


    <!-- =========================
         TOOLNEST
    ========================= -->

    <div class="logo-name">

        <span class="logo-tool">
            TOOL
        </span>

        <span class="logo-nest">
            NEST
        </span>

    </div>


    <!-- =========================
         TAGLINE
    ========================= -->

    <div class="tagline-row">

        <div class="tagline-line"></div>

        <div class="logo-tagline">
            SMART TOOLS. SIMPLE TASKS.
        </div>

        <div class="tagline-line"></div>

    </div>


</div>


</body>
</html>
