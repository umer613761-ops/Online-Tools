<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOOLNEST Logo Preview</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;

    font-family: Arial, Helvetica, sans-serif;
}


/* LOGO */

.logo-preview {
    padding: 45px 60px;

    display: flex;
    flex-direction: column;
    align-items: center;

    background: #ffffff;
}


/* MAIN NAME */

.logo-name {
    display: flex;
    align-items: baseline;

    white-space: nowrap;

    line-height: 1;

    font-size: 46px;

    letter-spacing: -1.5px;
}

.logo-tool {
    color: #34465b;

    font-weight: 600;
}

.logo-nest {
    color: #426c9c;

    font-weight: 700;
}


/* TAGLINE */

.logo-tagline-row {
    margin-top: 15px;

    display: flex;
    align-items: center;

    gap: 10px;

    white-space: nowrap;
}

.tagline-line {
    width: 38px;
    height: 1px;

    background: #7a8794;
}

.logo-tagline {
    color: #536273;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 1.8px;
}


/* MOBILE */

@media (max-width: 600px) {

    .logo-preview {
        padding: 35px 20px;
    }

    .logo-name {
        font-size: 36px;
    }

    .logo-tagline {
        font-size: 8px;
        letter-spacing: 1.2px;
    }

    .tagline-line {
        width: 22px;
    }

}

</style>

</head>


<body>


<div class="logo-preview">


    <div class="logo-name">

        <span class="logo-tool">
            TOOL
        </span>

        <span class="logo-nest">
            NEST
        </span>

    </div>


    <div class="logo-tagline-row">

        <div class="tagline-line"></div>

        <div class="logo-tagline">
            SMART TOOLS. SIMPLE TASKS.
        </div>

        <div class="tagline-line"></div>

    </div>


</div>


</body>

</html>
