<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo Preview</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f5f7fa;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO
========================= */

.logo {
    display: flex;
    align-items: center;

    gap: 18px;

    padding: 30px;

    background: #ffffff;
}


/* =========================
   LOGO SYMBOL
========================= */

.logo-mark {
    width: 110px;
    height: 110px;

    flex-shrink: 0;
}

.logo-mark svg {
    width: 100%;
    height: 100%;

    display: block;
}


/* =========================
   LOGO TEXT AREA
========================= */

.logo-content {
    display: flex;
    flex-direction: column;

    justify-content: center;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    display: flex;
    align-items: center;

    line-height: 1;

    white-space: nowrap;
}

.logo-tool {
    color: #26384c;

    font-size: 46px;
    font-weight: 400;

    letter-spacing: -2px;
}

.logo-nest {
    color: #315f91;

    font-size: 46px;
    font-weight: 800;

    letter-spacing: -2px;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline-row {
    margin-top: 13px;

    display: flex;
    align-items: center;

    gap: 10px;

    white-space: nowrap;
}

.tagline-line {
    width: 24px;
    height: 1px;

    background: #34485d;

    opacity: 0.7;
}

.logo-tagline {
    color: #435568;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1.4px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo {
        gap: 12px;

        padding: 20px;
    }

    .logo-mark {
        width: 72px;
        height: 72px;
    }

    .logo-tool,
    .logo-nest {
        font-size: 32px;
    }

    .logo-tagline-row {
        margin-top: 8px;

        gap: 6px;
    }

    .tagline-line {
        width: 16px;
    }

    .logo-tagline {
        font-size: 7px;

        letter-spacing: 0.9px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO
========================= -->

<div class="logo">


    <!-- =========================
         CIRCULAR SYMBOL
    ========================= -->

    <div class="logo-mark">

        <svg
            viewBox="0 0 120 120"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="ToolNest Logo"
        >


            <!-- MAIN OPEN CIRCLE -->

            <path
                d="
                    M 27 82
                    C 15 62,
                      20 35,
                      42 22

                    C 60 12,
                      82 18,
                      95 36
                "
                fill="none"
                stroke="#2b3e53"
                stroke-width="6"
                stroke-linecap="round"
            />


            <!-- BLUE RIGHT CURVE -->

            <path
                d="
                    M 94 42
                    C 105 61,
                      100 83,
                      82 96

                    C 73 102,
                      66 104,
                      59 104
                "
                fill="none"
                stroke="#3c6fa4"
                stroke-width="6"
                stroke-linecap="round"
            />


            <!-- LOWER CURVE -->

            <path
                d="
                    M 54 104
                    C 40 103,
                      28 94,
                      23 82
                "
                fill="none"
                stroke="#2b3e53"
                stroke-width="6"
                stroke-linecap="round"
            />


            <!-- LEFT BLUE INNER CURVE -->

            <path
                d="
                    M 31 77
                    C 25 62,
                      29 46,
                      39 35
                "
                fill="none"
                stroke="#3c6fa4"
                stroke-width="5"
                stroke-linecap="round"
            />


            <!-- TOP DOT -->

            <circle
                cx="61"
                cy="23"
                r="8"
                fill="#2b3e53"
            />


            <!-- BOTTOM LEFT DOT -->

            <circle
                cx="31"
                cy="94"
                r="8"
                fill="#2b3e53"
            />


        </svg>

    </div>



    <!-- =========================
         LOGO TEXT
    ========================= -->

    <div class="logo-content">


        <div class="logo-name">

            <span class="logo-tool">
                Tool
            </span>

            <span class="logo-nest">
                Nest
            </span>

        </div>



        <!-- =========================
             TAGLINE
        ========================= -->

        <div class="logo-tagline-row">

            <div class="tagline-line"></div>

            <div class="logo-tagline">
                SMART TOOLS. SIMPLE TASKS.
            </div>

            <div class="tagline-line"></div>

        </div>


    </div>


</div>


</body>

</html>
