<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO TEST AREA
========================= */

.logo-test {
    width: 715px;
    height: 187px;

    max-width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff 0%,
            #f5f5f6 65%,
            #eceef1 100%
        );

    overflow: hidden;
}


/* =========================
   MAIN LOGO TEXT
========================= */

.logo-name {
    display: flex;
    align-items: center;

    white-space: nowrap;

    font-size: 88px;

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


/* TOOL */

.logo-tool {
    color: #1e2d40;

    font-weight: 900;
}


/* NEST */

.logo-nest {
    color: #1f5db8;

    font-weight: 900;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    .logo-test {
        width: 100vw;
        height: 26.15vw;
    }

    .logo-name {
        font-size: 12.3vw;

        letter-spacing: -0.42vw;
    }

}

</style>
</head>

<body>


<div class="logo-test">

    <div class="logo-name">

        <span class="logo-tool">TOOL</span><span class="logo-nest">NEST</span>

    </div>

</div>


</body>
</html>
