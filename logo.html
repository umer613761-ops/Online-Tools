<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}


/* =========================
   PAGE
========================= */

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #f5f7fa;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO CARD
========================= */

.logo-card {
    width: 715px;
    max-width: 100%;

    padding:
        34px
        36px
        26px;

    display: flex;
    justify-content: center;

    background: #fbfcfd;

    border: 1px solid #e4e9ee;

    border-radius: 22px;

    box-shadow:
        0 8px 24px
        rgba(40, 55, 70, 0.04);
}


/* =========================
   LOGO CONTENT

   Width follows TOOLNEST
========================= */

.logo-content {
    display: inline-flex;
    flex-direction: column;

    align-items: stretch;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    display: flex;
    justify-content: center;

    white-space: nowrap;

    font-size: 88px;

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


/* TOOL */

.logo-tool {
    color: #1e2d40;

    font-weight: 900;
}


/* NEST */

.logo-nest {
    color: #1f5db8;

    font-weight: 900;
}


/* =========================
   TAGLINE ROW

   Same total width as TOOLNEST
========================= */

.tagline-row {
    width: 100%;

    margin-top: 15px;

    display: flex;
    align-items: center;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    background: #7b8793;

    border-radius: 10px;

    opacity: 0.7;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    margin:
        0
        14px;

    color: #566474;

    font-size: 16px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: 2.8px;

    white-space: nowrap;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    body {
        padding: 18px;
    }

    .logo-card {
        padding:
            5vw
            3vw
            4vw;

        border-radius: 18px;
    }

    .logo-name {
        font-size: 12.3vw;

        letter-spacing: -0.42vw;
    }

    .tagline-row {
        margin-top: 2vw;
    }

    .tagline-line {
        height: 0.28vw;
    }

    .logo-tagline {
        margin:
            0
            2vw;

        font-size: 2.25vw;

        letter-spacing: 0.39vw;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO CARD
========================= -->

<div class="logo-card">

    <div class="logo-content">


        <!-- TOOLNEST -->

        <div class="logo-name">

            <span class="logo-tool">
                TOOL
            </span>

            <span class="logo-nest">
                NEST
            </span>

        </div>


        <!-- TAGLINE + LINES -->

        <div class="tagline-row">

            <div class="tagline-line"></div>


            <div class="logo-tagline">

                SMART TOOLS. SIMPLE TASKS.

            </div>


            <div class="tagline-line"></div>

        </div>


    </div>

</div>


</body>

</html>
