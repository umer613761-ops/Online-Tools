<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO TEST AREA
========================= */

.logo-test {
    width: 715px;
    height: 187px;

    max-width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff 0%,
            #f5f5f6 65%,
            #eceef1 100%
        );

    overflow: hidden;
}


/* =========================
   MAIN LOGO CONTENT

   BOTH THE TOOLNEST TEXT
   AND THE TAGLINE ROW USE
   THIS EXACT SAME WIDTH
========================= */

.logo-content {
    width: 675px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;

    font-size: 88px;

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


/* TOOL */

.logo-tool {
    color: #1e2d40;

    font-weight: 900;
}


/* NEST */

.logo-nest {
    color: #1f5db8;

    font-weight: 900;
}


/* =========================
   TAGLINE ROW

   EXACT SAME WIDTH AS
   THE TOOLNEST AREA
========================= */

.tagline-row {
    width: 100%;

    margin-top: 14px;

    display: flex;
    align-items: center;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    background: #7b8793;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    margin-left: 17px;
    margin-right: 17px;

    color: #566474;

    font-size: 23px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: 4px;

    white-space: nowrap;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    .logo-test {
        width: 100vw;
        height: 26.15vw;
    }

    .logo-content {
        width: 94.4vw;
    }

    .logo-name {
        font-size: 12.3vw;

        letter-spacing: -0.42vw;
    }

    .tagline-row {
        margin-top: 1.95vw;
    }

    .tagline-line {
        height: 0.28vw;
    }

    .logo-tagline {
        margin-left: 2.35vw;
        margin-right: 2.35vw;

        font-size: 3.2vw;

        letter-spacing: 0.56vw;
    }

}

</style>
</head>

<body>


<div class="logo-test">

    <div class="logo-content">


        <!-- MAIN NAME -->

        <div class="logo-name">

            <span class="logo-tool">TOOL</span><span class="logo-nest">NEST</span>

        </div>


        <!-- TAGLINE + LINES -->

        <div class="tagline-row">

            <div class="tagline-line"></div>

            <div class="logo-tagline">
                SMART TOOLS. SIMPLE TASKS.
            </div>

            <div class="tagline-line"></div>

        </div>


    </div>

</div>


</body>
</html>
