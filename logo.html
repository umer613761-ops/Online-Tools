<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}


/* =========================
   PAGE
========================= */

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #eef3f8;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO CARD
========================= */

.logo-card {
    width: 715px;
    max-width: 100%;

    position: relative;

    overflow: hidden;

    padding:
        42px
        36px
        34px;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f7faff 100%
        );

    border:
        1px solid
        rgba(210, 222, 235, 0.9);

    border-radius: 38px;

    box-shadow:
        0 12px 35px
        rgba(40, 70, 100, 0.08);
}


/* =========================
   SOFT BACKGROUND SHAPES
========================= */

.logo-card::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    top: -130px;
    right: -80px;

    border-radius: 50%;

    background:
        rgba(47, 110, 168, 0.07);

    pointer-events: none;
}


.logo-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    bottom: -110px;
    left: -70px;

    border-radius: 50%;

    background:
        rgba(31, 93, 184, 0.05);

    pointer-events: none;
}


/* =========================
   LOGO CONTENT
========================= */

.logo-content {
    position: relative;
    z-index: 1;

    display: inline-flex;
    flex-direction: column;

    align-items: stretch;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    display: flex;
    justify-content: center;

    white-space: nowrap;

    font-size: 88px;

    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


/* =========================
   TOOL
========================= */

.logo-tool {
    color: #1e2d40;

    font-weight: 900;
}


/* =========================
   NEST
========================= */

.logo-nest {
    color: #1f5db8;

    font-weight: 900;
}


/* =========================
   TAGLINE ROW
========================= */

.tagline-row {
    width: 100%;

    margin-top: 15px;

    display: flex;
    align-items: center;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            rgba(123, 135, 147, 0.45),
            rgba(123, 135, 147, 0.85)
        );
}


.tagline-line:last-child {
    background:
        linear-gradient(
            90deg,
            rgba(123, 135, 147, 0.85),
            rgba(123, 135, 147, 0.45)
        );
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    margin:
        0
        14px;

    color: #566474;

    font-size: 16px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: 2.8px;

    white-space: nowrap;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    body {
        padding: 18px;
    }


    .logo-card {
        padding:
            7vw
            3vw
            5vw;

        border-radius: 30px;
    }


    .logo-card::before {
        width: 32vw;
        height: 32vw;

        top: -18vw;
        right: -10vw;
    }


    .logo-card::after {
        width: 28vw;
        height: 28vw;

        bottom: -18vw;
        left: -10vw;
    }


    .logo-name {
        font-size: 12.3vw;

        letter-spacing: -0.42vw;
    }


    .tagline-row {
        margin-top: 2vw;
    }


    .tagline-line {
        height: 0.28vw;
    }


    .logo-tagline {
        margin:
            0
            2vw;

        font-size: 2.25vw;

        letter-spacing: 0.39vw;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO CARD
========================= -->

<div class="logo-card">

    <div class="logo-content">


        <!-- TOOLNEST -->

        <div class="logo-name">

            <span class="logo-tool">
                TOOL
            </span>

            <span class="logo-nest">
                NEST
            </span>

        </div>


        <!-- TAGLINE -->

        <div class="tagline-row">

            <div class="tagline-line"></div>


            <div class="logo-tagline">

                SMART TOOLS. SIMPLE TASKS.

            </div>


            <div class="tagline-line"></div>

        </div>


    </div>

</div>


</body>

</html>
