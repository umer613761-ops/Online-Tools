<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ToolNest Logo</title>


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}


/* =========================
   PAGE
========================= */

body {
    margin: 0;

    min-height: 100vh;

    padding: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #ffffff;

    overflow-x: hidden;
}


/* =========================
   LOGO CONTAINER
========================= */

.logo {
    width: 100%;

    max-width: 1180px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 34px;
}


/* =========================
   SYMBOL
========================= */

.logo-symbol {
    width: 220px;
    height: 220px;

    position: relative;

    flex-shrink: 0;
}


/* =========================
   CIRCULAR ARC
========================= */

.symbol-ring {
    position: absolute;

    width: 165px;
    height: 165px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-25deg);

    border: 23px solid #1f5fba;

    border-radius: 50%;

    border-top-color: transparent;
    border-bottom-color: transparent;
}


/* =========================
   TOP DOT
========================= */

.symbol-dot-top {
    position: absolute;

    width: 70px;
    height: 70px;

    top: 8px;
    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2f75d0,
            #0d4ca8
        );
}


/* =========================
   LEFT DOT
========================= */

.symbol-dot-left {
    position: absolute;

    width: 66px;
    height: 66px;

    left: 7px;
    bottom: 25px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2f75d0,
            #0d4ca8
        );
}


/* =========================
   RIGHT DOT
========================= */

.symbol-dot-right {
    position: absolute;

    width: 66px;
    height: 66px;

    right: 7px;
    bottom: 25px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #2f75d0,
            #0d4ca8
        );
}


/* =========================
   TEXT AREA
========================= */

.logo-content {
    width: 100%;

    max-width: 900px;

    min-width: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================
   MAIN NAME
========================= */

.logo-name {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #1f2b39;

    font-size: 172px;

    font-weight: 800;

    letter-spacing: -5px;

    line-height: 1;

    white-space: nowrap;
}


.logo-name-dark {
    color: #1f2b39;
}


.logo-name-blue {
    color: #1e5ec0;
}


/* =========================
   TAGLINE ROW
========================= */

.logo-tagline-row {
    width: 100%;

    margin-top: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 24px;

    white-space: nowrap;
}


/* =========================
   HORIZONTAL LINES
========================= */

.logo-line {
    flex: 1;

    min-width: 50px;

    height: 3px;

    background: #1e5ec0;

    border-radius: 5px;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    color: #3c4a59;

    font-size: 30px;

    font-weight: 600;

    letter-spacing: 9px;

    white-space: nowrap;
}


/* =========================
   MEDIUM SCREENS
========================= */

@media (max-width: 1100px) {

    body {
        padding: 25px;
    }

    .logo {
        gap: 25px;
    }

    .logo-symbol {
        width: 170px;
        height: 170px;
    }

    .symbol-ring {
        width: 128px;
        height: 128px;

        border-width: 18px;
    }

    .symbol-dot-top {
        width: 54px;
        height: 54px;
    }

    .symbol-dot-left,
    .symbol-dot-right {
        width: 52px;
        height: 52px;

        bottom: 18px;
    }

    .logo-name {
        font-size: 120px;

        letter-spacing: -4px;
    }

    .logo-tagline {
        font-size: 21px;

        letter-spacing: 6px;
    }

    .logo-tagline-row {
        margin-top: 25px;

        gap: 18px;
    }

}


/* =========================
   TABLET
========================= */

@media (max-width: 800px) {

    body {
        padding: 25px 20px;
    }

    .logo {
        flex-direction: column;

        gap: 15px;
    }

    .logo-symbol {
        width: 150px;
        height: 150px;
    }

    .symbol-ring {
        width: 112px;
        height: 112px;

        border-width: 16px;
    }

    .symbol-dot-top {
        width: 46px;
        height: 46px;
    }

    .symbol-dot-left,
    .symbol-dot-right {
        width: 44px;
        height: 44px;

        bottom: 16px;
    }

    .logo-content {
        max-width: 650px;
    }

    .logo-name {
        font-size: 105px;
    }

    .logo-tagline {
        font-size: 17px;

        letter-spacing: 5px;
    }

    .logo-line {
        height: 2px;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 20px 15px;
    }

    .logo-symbol {
        width: 120px;
        height: 120px;
    }

    .symbol-ring {
        width: 90px;
        height: 90px;

        border-width: 13px;
    }

    .symbol-dot-top {
        width: 36px;
        height: 36px;
    }

    .symbol-dot-left,
    .symbol-dot-right {
        width: 34px;
        height: 34px;

        bottom: 13px;
    }

    .logo-name {
        font-size: 16vw;

        letter-spacing: -2px;
    }

    .logo-tagline-row {
        margin-top: 15px;

        gap: 10px;
    }

    .logo-line {
        min-width: 25px;

        height: 2px;
    }

    .logo-tagline {
        font-size: 2.5vw;

        letter-spacing: 1.5vw;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO
========================= -->

<div class="logo">


    <!-- =========================
         SYMBOL
    ========================= -->

    <div class="logo-symbol">


        <div
            class="symbol-ring"
        ></div>


        <div
            class="symbol-dot-top"
        ></div>


        <div
            class="symbol-dot-left"
        ></div>


        <div
            class="symbol-dot-right"
        ></div>


    </div>



    <!-- =========================
         TEXT
    ========================= -->

    <div class="logo-content">


        <!-- TOOLNEST -->

        <div class="logo-name">


            <span class="logo-name-dark">

                TOOL

            </span>


            <span class="logo-name-blue">

                NEST

            </span>


        </div>



        <!-- TAGLINE -->

        <div class="logo-tagline-row">


            <div
                class="logo-line"
            ></div>


            <div class="logo-tagline">

                SMART TOOLS. SIMPLE TASKS.

            </div>


            <div
                class="logo-line"
            ></div>


        </div>


    </div>


</div>


</body>

</html>
