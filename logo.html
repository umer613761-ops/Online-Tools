<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ToolNest Logo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f3f4f6;

    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   LOGO PREVIEW AREA
========================= */

.logo-test {
    width: 715px;
    max-width: 100%;

    padding: 32px 20px 18px;

    display: flex;
    justify-content: center;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff 0%,
            #f5f5f6 65%,
            #eceef1 100%
        );

    overflow: hidden;
}


/* =========================
   LOGO WRAPPER

   Width automatically follows
   the actual TOOLNEST text.
========================= */

.logo-content {
    display: inline-flex;
    flex-direction: column;

    align-items: stretch;
}


/* =========================
   TOOLNEST
========================= */

.logo-name {
    display: flex;
    justify-content: center;

    white-space: nowrap;

    font-size: 88px;
    line-height: 1;

    letter-spacing: -3px;

    font-weight: 900;
}


.logo-tool {
    color: #1e2d40;
}

.logo-nest {
    color: #1f5db8;
}


/* =========================
   BOTTOM ROW

   EXACT SAME WIDTH AS
   TOOLNEST
========================= */

.tagline-row {
    width: 100%;

    margin-top: 14px;

    display: flex;
    align-items: center;
}


/* =========================
   SIDE LINES
========================= */

.tagline-line {
    flex: 1;

    height: 2px;

    background: #7b8793;
}


/* =========================
   TAGLINE
========================= */

.logo-tagline {
    margin: 0 17px;

    color: #566474;

    font-size: 23px;
    font-weight: 700;

    line-height: 1;

    letter-spacing: 4px;

    white-space: nowrap;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 715px) {

    .logo-test {
        padding: 4vw 2vw 2.5vw;
    }

    .logo-name {
        font-size: 12.3vw;
        letter-spacing: -0.42vw;
    }

    .tagline-row {
        margin-top: 2vw;
    }

    .tagline-line {
        height: 0.28vw;
    }

    .logo-tagline {
        margin: 0 2.3vw;

        font-size: 3.2vw;
        letter-spacing: 0.56vw;
    }

}

</style>
</head>

<body>

<div class="logo-test">

    <!-- THIS WRAPPER TAKES THE EXACT WIDTH OF TOOLNEST -->

    <div class="logo-content">


        <!-- TOOLNEST -->

        <div class="logo-name">

            <span class="logo-tool">TOOL</span><span class="logo-nest">NEST</span>

        </div>


        <!-- EVERYTHING UNDER TOOLNEST -->

        <div class="tagline-row">

            <div class="tagline-line"></div>

            <div class="logo-tagline">
                SMART TOOLS. SIMPLE TASKS.
            </div>

            <div class="tagline-line"></div>

        </div>


    </div>

</div>

</body>
</html>
