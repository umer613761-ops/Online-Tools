<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ToolNest Logo</title>


<style>

/* =========================
   PAGE PREVIEW
========================= */

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f5f7fa;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   LOGO
========================= */

.logo {
    display: flex;

    align-items: center;

    gap: 16px;

    text-decoration: none;
}


/* =========================
   LOGO MARK
========================= */

.logo-mark {
    width: 82px;
    height: 82px;

    flex-shrink: 0;
}

.logo-mark svg {
    width: 100%;
    height: 100%;

    display: block;
}


/* =========================
   LOGO TEXT
========================= */

.logo-text {
    display: flex;

    flex-direction: column;
}


/* BRAND NAME */

.logo-name {
    font-size: 38px;

    line-height: 1;

    letter-spacing: -1.8px;

    white-space: nowrap;
}

.logo-tool {
    color: #20354d;

    font-weight: 500;
}

.logo-nest {
    color: #2f6ea8;

    font-weight: 800;
}


/* TAGLINE */

.logo-tagline {
    display: flex;

    align-items: center;

    gap: 9px;

    margin-top: 9px;

    color: #687788;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    white-space: nowrap;
}

.logo-tagline::before,
.logo-tagline::after {
    content: "";

    width: 34px;

    height: 1px;

    background: #aeb9c4;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .logo {
        gap: 11px;
    }

    .logo-mark {
        width: 62px;
        height: 62px;
    }

    .logo-name {
        font-size: 29px;
    }

    .logo-tagline {
        font-size: 7px;

        letter-spacing: 1.3px;

        gap: 6px;

        margin-top: 7px;
    }

    .logo-tagline::before,
    .logo-tagline::after {
        width: 20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TOOLNEST LOGO
========================= -->

<a
    href="#"
    class="logo"
    aria-label="ToolNest Home"
>


    <!-- =========================
         LOGO MARK
    ========================= -->

    <div class="logo-mark">


        <svg
            viewBox="0 0 100 100"

            xmlns="http://www.w3.org/2000/svg"

            aria-hidden="true"
        >


            <!-- OUTER NAVY ARC -->

            <path

                d="
                    M 74 14

                    C 59 5
                      40 7
                      26 19

                    C 13 30
                      10 48
                      17 64

                    C 25 82
                      45 91
                      63 85
                "

                fill="none"

                stroke="#20354d"

                stroke-width="7"

                stroke-linecap="round"
            />


            <!-- BLUE OUTER ARC -->

            <path

                d="
                    M 68 13

                    C 83 20
                      91 35
                      88 51

                    C 85 69
                      72 82
                      56 87
                "

                fill="none"

                stroke="#2f6ea8"

                stroke-width="5"

                stroke-linecap="round"
            />


            <!-- INNER NAVY ARC -->

            <path

                d="
                    M 32 27

                    C 43 17
                      59 17
                      70 27

                    C 82 38
                      83 56
                      72 69

                    C 62 81
                      45 83
                      33 73
                "

                fill="none"

                stroke="#20354d"

                stroke-width="4"

                stroke-linecap="round"
            />


            <!-- INNER BLUE ARC -->

            <path

                d="
                    M 28 33

                    C 20 45
                      22 61
                      34 72

                    C 42 80
                      54 82
                      65 76
                "

                fill="none"

                stroke="#2f6ea8"

                stroke-width="4"

                stroke-linecap="round"
            />


            <!-- OPEN CIRCLE ACCENT -->

            <path

                d="
                    M 50 22

                    C 66 22
                      78 34
                      78 50

                    C 78 66
                      66 78
                      50 78
                "

                fill="none"

                stroke="#ffffff"

                stroke-width="2"

                stroke-linecap="round"
            />


        </svg>


    </div>



    <!-- =========================
         LOGO TEXT
    ========================= -->

    <div class="logo-text">


        <div class="logo-name">

            <span class="logo-tool">
                TOOL
            </span>

            <span class="logo-nest">
                NEST
            </span>

        </div>


        <div class="logo-tagline">

            SMART TOOLS. SIMPLE TASKS.

        </div>


    </div>


</a>


</body>

</html>
