  <script>

    const text =
      document.getElementById("text");


    /* Update Statistics */

    text.addEventListener(
      "input",
      updateStatistics
    );


    function updateStatistics() {

      const value =
        text.value;

      const words =
        value.trim() === ""
          ? 0
          : value
              .trim()
              .split(/\s+/)
              .length;


      document.getElementById(
        "wordCount"
      ).textContent =
        words;


      document.getElementById(
        "characterCount"
      ).textContent =
        value.length;

    }


    /* Convert Text Into Clean Words */

    function getWords() {

      return text.value
        .trim()
        .replace(
          /([a-z])([A-Z])/g,
          "$1 $2"
        )
        .replace(
          /[_-]+/g,
          " "
        )
        .replace(
          /[^a-zA-Z0-9\s]/g,
          ""
        )
        .split(/\s+/)
        .filter(Boolean);

    }


    /* Uppercase */

    function toUpperCase() {

      text.value =
        text.value.toUpperCase();

      updateStatistics();

    }


    /* Lowercase */

    function toLowerCase() {

      text.value =
        text.value.toLowerCase();

      updateStatistics();

    }


    /* Title Case */

    function toTitleCase() {

      const words =
        text.value
          .toLowerCase()
          .split(/(\s+)/)
          .map(function(part) {

            if (part.trim() === "") {
              return part;
            }

            return (
              part.charAt(0)
                .toUpperCase()
              +
              part.slice(1)
            );

          });

      text.value =
        words.join("");

      updateStatistics();

    }


    /* Sentence Case */

    function toSentenceCase() {

      const value =
        text.value
          .toLowerCase();

      text.value =
        value.replace(
          /(^\s*\w|[.!?]\s*\w)/g,
          function(letter) {

            return letter.toUpperCase();

          }
        );

      updateStatistics();

    }


    /* camelCase */

    function toCamelCase() {

      const words =
        getWords();

      text.value =
        words
          .map(function(word, index) {

            const lower =
              word.toLowerCase();

            if (index === 0) {
              return lower;
            }

            return (
              lower.charAt(0)
                .toUpperCase()
              +
              lower.slice(1)
            );

          })
          .join("");

      updateStatistics();

    }


    /* PascalCase */

    function toPascalCase() {

      const words =
        getWords();

      text.value =
        words
          .map(function(word) {

            const lower =
              word.toLowerCase();

            return (
              lower.charAt(0)
                .toUpperCase()
              +
              lower.slice(1)
            );

          })
          .join("");

      updateStatistics();

    }


    /* snake_case */

    function toSnakeCase() {

      text.value =
        getWords()
          .map(
            word =>
              word.toLowerCase()
          )
          .join("_");

      updateStatistics();

    }


    /* kebab-case */

    function toKebabCase() {

      text.value =
        getWords()
          .map(
            word =>
              word.toLowerCase()
          )
          .join("-");

      updateStatistics();

    }


    /* CONSTANT_CASE */

    function toConstantCase() {

      text.value =
        getWords()
          .map(
            word =>
              word.toUpperCase()
          )
          .join("_");

      updateStatistics();

    }


    /* Alternating Case */

    function toAlternatingCase() {

      text.value =
        [...text.value]
          .map(
            function(char, index) {

              return index % 2 === 0
                ? char.toLowerCase()
                : char.toUpperCase();

            }
          )
          .join("");

      updateStatistics();

    }


    /* Inverse Case */

    function toInverseCase() {

      text.value =
        [...text.value]
          .map(function(char) {

            if (
              char ===
              char.toUpperCase()
            ) {

              return char.toLowerCase();

            }

            return char.toUpperCase();

          })
          .join("");

      updateStatistics();

    }


    /* Slug */

    function toSlug() {

      text.value =
        getWords()
          .map(
            word =>
              word.toLowerCase()
          )
          .join("-");

      updateStatistics();

    }


    /* Copy Text */

    function copyText() {

      if (text.value === "") {

        alert(
          "There is no text to copy."
        );

        return;

      }


      navigator.clipboard
        .writeText(
          text.value
        )
        .then(function() {

          alert(
            "Text copied!"
          );

        });

    }


    /* Clear Text */

    function clearText() {

      text.value =
        "";

      updateStatistics();

    }

  </script>
