<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Case Converter - Free Online Tools</title>

  <meta
    name="description"
    content="Convert text to uppercase, lowercase, title case and sentence case for free."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #222;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Main */

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    /* Conversion Buttons */

    .convert-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* Statistics */

    .statistics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      background: #f4f7fb;
      padding: 18px;
      text-align: center;
      border-radius: 10px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .stat span {
      color: #666;
    }

    /* Action Buttons */

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .action-buttons button {
      flex: 1;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* Mobile */

    @media (max-width: 600px) {

      nav {
        flex-direction: column;
        gap: 10px;
      }

      .nav-links a {
        margin: 0 8px;
      }

      .container {
        margin: 20px 10px;
        padding: 20px;
      }

      .convert-buttons {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>
</head>

<body>

  <!-- Navigation -->

  <nav>

    <a href="index.html" class="logo">
      Free Online Tools
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#tools">All Tools</a>
    </div>

  </nav>


  <!-- Main -->

  <main class="container">

    <h1>Case Converter</h1>

    <p class="subtitle">
      Convert your text into different letter cases instantly.
    </p>


    <textarea
      id="text"
      placeholder="Type or paste your text here..."
    ></textarea>


    <!-- Convert Buttons -->

    <div class="convert-buttons">

      <button onclick="toUpperCase()">
        UPPERCASE
      </button>

      <button onclick="toLowerCase()">
        lowercase
      </button>

      <button onclick="toTitleCase()">
        Title Case
      </button>

      <button onclick="toSentenceCase()">
        Sentence case
      </button>

    </div>


    <!-- Statistics -->

    <div class="statistics">

      <div class="stat">
        <strong id="wordCount">0</strong>
        <span>Words</span>
      </div>

      <div class="stat">
        <strong id="characterCount">0</strong>
        <span>Characters</span>
      </div>

    </div>


    <!-- Action Buttons -->

    <div class="action-buttons">

      <button onclick="copyText()">
        Copy Text
      </button>

      <button onclick="clearText()">
        Clear Text
      </button>

    </div>

  </main>


  <!-- Footer -->

  <footer>
    © 2026 Free Online Tools
  </footer>


  <script>

    const text =
      document.getElementById("text");


    /* Update Statistics */

    text.addEventListener(
      "input",
      updateStatistics
    );


    function updateStatistics() {

      const value =
        text.value;

      const words =
        value.trim() === ""
          ? 0
          : value.trim()
              .split(/\s+/)
              .length;

      document.getElementById(
        "wordCount"
      ).textContent = words;


      document.getElementById(
        "characterCount"
      ).textContent =
        value.length;

    }


    /* Uppercase */

    function toUpperCase() {

      text.value =
        text.value.toUpperCase();

      updateStatistics();

    }


    /* Lowercase */

    function toLowerCase() {

      text.value =
        text.value.toLowerCase();

      updateStatistics();

    }


    /* Title Case */

    function toTitleCase() {

      text.value =
        text.value
          .toLowerCase()
          .split(/\s+/)
          .map(function(word) {

            return word.charAt(0)
              .toUpperCase()
              + word.slice(1);

          })
          .join(" ");

      updateStatistics();

    }


    /* Sentence Case */

    function toSentenceCase() {

      const value =
        text.value.toLowerCase();

      text.value =
        value.charAt(0)
          .toUpperCase()
          + value.slice(1);

      updateStatistics();

    }


    /* Copy Text */

    function copyText() {

      navigator.clipboard
        .writeText(text.value)
        .then(function() {

          alert("Text copied!");

        });

    }


    /* Clear Text */

    function clearText() {

      text.value = "";

      updateStatistics();

    }

  </script>

</body>
</html>
