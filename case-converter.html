<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Case Converter - Free Online Tools</title>
  <meta name="description" content="Convert text to uppercase, lowercase, title case and sentence case for free.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Case Converter</h1>

    <p class="subtitle">
      Convert your text into different letter cases instantly.
    </p>

    <textarea
      id="text"
      placeholder="Type or paste your text here..."
    ></textarea>

    <div class="buttons">

      <button onclick="toUpperCase()">
        UPPERCASE
      </button>

      <button onclick="toLowerCase()">
        lowercase
      </button>

      <button onclick="toTitleCase()">
        Title Case
      </button>

      <button onclick="toSentenceCase()">
        Sentence case
      </button>

      <button onclick="clearText()">
        Clear
      </button>

    </div>

    <a class="back" href="index.html">
      ← Back to Homepage
    </a>

  </div>

  <script>

    const text = document.getElementById("text");

    function toUpperCase() {
      text.value = text.value.toUpperCase();
    }

    function toLowerCase() {
      text.value = text.value.toLowerCase();
    }

    function toTitleCase() {
      text.value = text.value
        .toLowerCase()
        .split(" ")
        .map(function(word) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        })
        .join(" ");
    }

    function toSentenceCase() {
      const value = text.value.toLowerCase();

      text.value =
        value.charAt(0).toUpperCase() + value.slice(1);
    }

    function clearText() {
      text.value = "";
    }

  </script>

</body>
</html>
