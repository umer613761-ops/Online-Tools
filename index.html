 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
<div class="container">
  <h1>Word Counter</h1>
  <p class="subtitle">Count words and characters instantly.</p>

  <textarea id="text" placeholder="Type or paste your text here..."></textarea>

  <div class="buttons">
    <button id="clear">Clear</button>
  </div>

  <div class="results">
    <div>
      <strong id="words">0</strong>
      <span>Words</span>
    </div>

    <div>
      <strong id="characters">0</strong>
      <span>Characters</span>
    </div>

    <div>
      <strong id="noSpaces">0</strong>
      <span>Without spaces</span>
    </div>
  </div>
</div>

<footer>
  Free Online Tools
</footer>
    <script src="./script.js"></script>
  </body>
</html>
