<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ToolNest - Free Online Tools</title>

  <meta
    name="description"
    content="Free, fast and easy-to-use online tools for PDFs, text, images and more."
  >


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fa;

      color: #344154;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;

      background: #ffffff;

      border-bottom:
        1px solid #e2e7ee;
    }


    .navbar {
      width: 100%;

      margin: 0;

      padding:
        14px 30px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;

      align-items: center;

      gap: 9px;

      text-decoration: none;

      flex-shrink: 0;
    }


    .logo-icon {
      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #547eaf,
          #35649a
        );

      border-radius: 12px;

      color: #ffffff;

      font-size: 21px;

      font-weight: 700;

      box-shadow:
        0 4px 10px
        rgba(53, 100, 154, 0.16);
    }


    .logo-text {
      display: flex;

      align-items: center;

      font-size: 28px;

      letter-spacing: -1px;
    }


    .logo-tool {
      color: #344154;

      font-weight: 400;
    }


    .logo-nest {
      color: #4d73a6;

      font-weight: 700;
    }


    /* =========================
       SEARCH BAR
    ========================= */

    .search-container {
      width: 240px;

      position: relative;

      flex-shrink: 0;
    }


    .search-container input {
      width: 100%;

      height: 38px;

      padding:
        0 42px
        0 14px;

      border:
        1px solid #d8e0e8;

      border-radius: 8px;

      background: #f8fafc;

      color: #344154;

      font-family: inherit;

      font-size: 13px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .search-container input::placeholder {
      color: #8a96a5;
    }


    .search-container input:focus {
      background: #ffffff;

      border-color: #4d73a6;

      box-shadow:
        0 0 0 3px
        rgba(77, 115, 166, 0.10);
    }


    .search-icon {
      position: absolute;

      right: 13px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #6f7d8c;

      font-size: 17px;

      pointer-events: none;
    }


    /* =========================
       PAGE LAYOUT
    ========================= */

    .page-layout {
      width: 100%;

      max-width: 1400px;

      margin: 0 auto;

      padding:
        45px 30px 70px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        220px;

      gap: 35px;

      align-items: start;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .main-content {
      min-width: 0;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;

      max-width: 850px;

      margin:
        0 auto
        50px;
    }


    .hero h1 {
      margin:
        0
        0
        16px;

      font-size: 50px;

      line-height: 1.15;

      letter-spacing: -2px;

      font-weight: 700;

      color: #344154;
    }


    .hero h1 span {
      color: #4d73a6;
    }


    .hero p {
      margin: 0;

      font-size: 19px;

      line-height: 1.7;

      color: #6f7d8c;
    }


    /* =========================
       TOOLS PLACEHOLDER
    ========================= */

    .tools-placeholder {
      background: #ffffff;

      border:
        1px solid #e2e7ee;

      border-radius: 18px;

      min-height: 400px;

      padding: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;
    }


    .tools-placeholder p {
      margin: 0;

      color: #8a96a5;

      font-size: 18px;
    }


    /* =========================
       RIGHT AD COLUMN
    ========================= */

    .ad-column {
      width: 100%;

      min-height: 600px;

      background: #ffffff;

      border:
        1px solid #e2e7ee;

      border-radius: 12px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 20px;

      position: sticky;

      top: 20px;
    }


    .ad-label {
      color: #9aa5b1;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 1px;

      text-transform: uppercase;

      margin-bottom: 15px;
    }


    .ad-placeholder {
      color: #a0a9b5;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #ffffff;

      border-top:
        1px solid #e2e7ee;

      text-align: center;

      padding:
        30px 20px;

      color: #7b8794;

      font-size: 14px;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1000px) {

      .page-layout {
        grid-template-columns:
          minmax(0, 1fr)
          180px;

        gap: 25px;
      }


      .ad-column {
        min-height: 500px;
      }

    }


    /* =========================
       SMALL TABLET
    ========================= */

    @media (max-width: 800px) {

      .page-layout {
        grid-template-columns: 1fr;
      }


      .ad-column {
        position: static;

        min-height: 180px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .navbar {
        padding:
          12px 16px;

        flex-direction: column;

        align-items: stretch;

        gap: 12px;
      }


      .logo {
        justify-content: center;
      }


      .search-container {
        width: 100%;
      }


      .page-layout {
        padding:
          40px 16px 55px;
      }


      .hero {
        margin-bottom: 40px;
      }


      .hero h1 {
        font-size: 38px;

        letter-spacing: -1px;
      }


      .hero p {
        font-size: 16px;
      }


      .tools-placeholder {
        min-height: 250px;

        padding: 25px;
      }


      .ad-column {
        min-height: 150px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="navbar">


      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <div class="logo-icon">
          T
        </div>


        <div class="logo-text">

          <span class="logo-tool">
            Tool
          </span>

          <span class="logo-nest">
            Nest
          </span>

        </div>

      </a>


      <!-- SEARCH BAR -->

      <div class="search-container">

        <input
          type="text"
          id="toolSearch"
          placeholder="Search tools..."
        >

        <div class="search-icon">
          ⌕
        </div>

      </div>


    </div>

  </header>



  <!-- =========================
       PAGE LAYOUT
  ========================== -->

  <main class="page-layout">


    <!-- LEFT MAIN CONTENT -->

    <div class="main-content">


      <!-- HERO -->

      <section class="hero">

        <h1>

          Your All-in-One<br>

          Online <span>Tools.</span>

        </h1>


        <p>

          Fast, free and easy-to-use online tools
          for all your daily needs.

        </p>

      </section>



      <!-- TOOLS AREA -->

      <section class="tools-placeholder">

        <p>
          Tools will go here.
        </p>

      </section>


    </div>



    <!-- RIGHT ADVERTISEMENT COLUMN -->

    <aside class="ad-column">

      <div class="ad-label">
        Advertisement
      </div>


      <div class="ad-placeholder">

        Ad Space<br>

        160 × 600

      </div>

    </aside>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    © 2026 ToolNest · Simple, Fast &amp; Free

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const toolSearch =
      document.getElementById(
        "toolSearch"
      );


    toolSearch.addEventListener(
      "input",
      function() {

        console.log(
          "Searching for:",
          toolSearch.value
        );

      }
    );

  </script>


</body>

</html>
