<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Online Tools</title>
  <meta name="description" content="Free online tools including Word Counter and Percentage Calculator.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .tool-card h3 {
      margin-top: 0;
    }

    .tool-card p {
      color: #666;
      line-height: 1.5;
    }

    .tool-card a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Free Online Tools</h1>
    <p>Simple, free and useful online tools.</p>
  </header>

  <main>

    <h2>Our Tools</h2>

    <div class="tools">

      <div class="tool-card">
        <h3>Word Counter</h3>
        <p>Count words, characters and characters without spaces instantly.</p>

        <a href="word-counter.html">
          Use Word Counter
        </a>
      </div>

      <div class="tool-card">
        <h3>Percentage Calculator</h3>
        <p>Quickly calculate the percentage of any number.</p>

        <a href="percentage-calculator.html">
          Use Calculator
        </a>
      </div>

    </div>

  </main>

  <footer>
    © 2026 Free Online Tools
  </footer>

</body>
</html>
