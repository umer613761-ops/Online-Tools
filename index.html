<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ToolNest - Free Online Tools</title>

  <meta
    name="description"
    content="Free, fast and easy-to-use online tools for PDFs, text, images and more."
  >


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fa;

      color: #344154;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;

      background: #ffffff;

      border-bottom:
        1px solid #e2e7ee;
    }


    .navbar {
      width: 100%;

      max-width: 1400px;

      margin: 0 auto;

      padding:
        14px 55px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;

      align-items: center;

      gap: 11px;

      text-decoration: none;

      flex-shrink: 0;
    }


    .logo-icon {
      width: 50px;

      height: 50px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #547eaf,
          #35649a
        );

      border-radius: 14px;

      color: #ffffff;

      font-size: 24px;

      font-weight: 700;

      box-shadow:
        0 5px 14px
        rgba(53, 100, 154, 0.18);
    }


    .logo-text {
      font-size: 32px;

      letter-spacing: -1px;

      display: flex;

      align-items: center;
    }


    /* Tool is thinner */

    .logo-tool {
      color: #344154;

      font-weight: 400;
    }


    /* Nest is bold and blue */

    .logo-nest {
      color: #4d73a6;

      font-weight: 700;
    }


    /* =========================
       SEARCH BAR
    ========================= */

    .search-container {
      width: 280px;

      position: relative;

      flex-shrink: 0;
    }


    .search-container input {
      width: 100%;

      height: 44px;

      padding:
        0 45px
        0 16px;

      border:
        1px solid #d8e0e8;

      border-radius: 9px;

      background: #f8fafc;

      color: #344154;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .search-container input::placeholder {
      color: #8a96a5;
    }


    .search-container input:focus {
      background: #ffffff;

      border-color: #4d73a6;

      box-shadow:
        0 0 0 3px
        rgba(77, 115, 166, 0.10);
    }


    .search-icon {
      position: absolute;

      right: 15px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #6f7d8c;

      font-size: 19px;

      pointer-events: none;
    }


    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1400px;

      margin: 0 auto;

      padding:
        70px 55px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;

      max-width: 850px;

      margin:
        0 auto
        70px;
    }


    .hero h1 {
      margin:
        0
        0
        18px;

      font-size: 52px;

      line-height: 1.15;

      letter-spacing: -2px;

      font-weight: 700;

      color: #344154;
    }


    .hero h1 span {
      color: #4d73a6;
    }


    .hero p {
      margin: 0;

      font-size: 20px;

      line-height: 1.7;

      color: #6f7d8c;
    }


    /* =========================
       PLACEHOLDER
    ========================= */

    .tools-placeholder {
      background: #ffffff;

      border:
        1px solid #e2e7ee;

      border-radius: 18px;

      min-height: 300px;

      padding: 40px;

      text-align: center;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .tools-placeholder p {
      margin: 0;

      color: #8a96a5;

      font-size: 18px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #ffffff;

      border-top:
        1px solid #e2e7ee;

      text-align: center;

      padding:
        30px 20px;

      color: #7b8794;

      font-size: 14px;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .navbar {
        padding:
          14px 25px;
      }


      .logo-icon {
        width: 45px;

        height: 45px;

        font-size: 22px;
      }


      .logo-text {
        font-size: 29px;
      }


      main {
        padding:
          55px 25px;
      }


      .hero h1 {
        font-size: 44px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .navbar {
        padding:
          14px 16px;

        flex-direction: column;

        align-items: stretch;

        gap: 14px;
      }


      .logo {
        justify-content: center;
      }


      .search-container {
        width: 100%;
      }


      main {
        padding:
          45px 16px;
      }


      .hero {
        margin-bottom: 45px;
      }


      .hero h1 {
        font-size: 38px;
      }


      .hero p {
        font-size: 17px;
      }


      .tools-placeholder {
        min-height: 220px;

        padding: 25px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="navbar">


      <!-- LOGO -->

      <a
        href="index.html"
        class="logo"
      >

        <div class="logo-icon">
          T
        </div>


        <div class="logo-text">

          <span class="logo-tool">
            Tool
          </span>

          <span class="logo-nest">
            Nest
          </span>

        </div>

      </a>


      <!-- SEARCH BAR -->

      <div class="search-container">

        <input
          type="text"
          id="toolSearch"
          placeholder="Search tools..."
        >

        <div class="search-icon">
          ⌕
        </div>

      </div>


    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- HERO -->

    <section class="hero">

      <h1>

        Your All-in-One<br>

        Online <span>Tools.</span>

      </h1>


      <p>

        Fast, free and easy-to-use online tools
        for all your daily needs.

      </p>

    </section>



    <!-- TOOLS AREA -->

    <section class="tools-placeholder">

      <p>
        Tools will go here.
      </p>

    </section>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    © 2026 ToolNest · Simple, Fast &amp; Free

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const toolSearch =
      document.getElementById(
        "toolSearch"
      );


    toolSearch.addEventListener(
      "input",
      function() {

        console.log(
          "Searching for:",
          toolSearch.value
        );

      }
    );

  </script>


</body>

</html>
