<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ToolNest - Free Online Tools</title>

  <meta
    name="description"
    content="Free online PDF, text and image tools. Merge PDFs, split PDFs, convert images, count words, clean text and more."
  >

  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #222;
      min-height: 100vh;
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;

      padding: 18px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;

      text-decoration: none;
      color: #222;

      white-space: nowrap;
    }


    .logo span {
      color: #6c5ce7;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-container {
      width: 260px;
      flex: none;
    }


    .search-container input {
      width: 100%;

      padding: 10px 14px;

      border: 1px solid #dfe2e8;
      border-radius: 8px;

      background: #fafafa;
      color: #222;

      font-size: 13px;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }


    .search-container input::placeholder {
      color: #9699a2;
    }


    .search-container input:focus {
      border-color: #8b7cf6;

      background: #ffffff;

      box-shadow:
        0 0 0 3px
        rgba(139, 124, 246, 0.12);
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 1150px;

      margin: 0 auto;

      padding: 50px 20px 70px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;

      margin-bottom: 45px;
    }


    .hero h1 {
      margin: 0 0 12px;

      font-size: 40px;

      line-height: 1.2;

      color: #222;
    }


    .hero p {
      max-width: 680px;

      margin: 0 auto;

      color: #6f7280;

      font-size: 16px;

      line-height: 1.6;
    }


    /* =========================
       PDF + TEXT SECTIONS
    ========================= */

    .categories-row {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 0;

      align-items: stretch;

      margin-bottom: 55px;
    }


    .category {
      min-width: 0;
    }


    /* PDF SIDE */

    #pdf-tools {
      padding-right: 35px;

      border-right:
        1px solid #dfe2e8;
    }


    /* TEXT SIDE */

    #text-tools {
      padding-left: 35px;
    }


    /* =========================
       CATEGORY HEADERS
    ========================= */

    .category-header {
      text-align: center;

      margin-bottom: 22px;
    }


    .category-title {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      margin-bottom: 10px;
    }


    .category-badge {
      width: 11px;

      height: 11px;

      border-radius: 50%;

      flex: none;
    }


    /* PDF BADGE */

    #pdf-tools .category-badge {
      background: #7c6ce8;

      box-shadow:
        0 0 10px
        rgba(124, 108, 232, 0.25);
    }


    /* TEXT BADGE */

    #text-tools .category-badge {
      background: #4b93e8;

      box-shadow:
        0 0 10px
        rgba(75, 147, 232, 0.2);
    }


    /* IMAGE BADGE */

    #image-tools .category-badge {
      background: #3eb57c;

      box-shadow:
        0 0 10px
        rgba(62, 181, 124, 0.2);
    }


    .category-header h2 {
      margin: 0;

      font-size: 27px;

      color: #222;
    }


    .category-header p {
      margin: 0;

      color: #777b86;

      font-size: 14px;

      line-height: 1.5;
    }


    /* =========================
       TOOL GRID
    ========================= */

    .tools-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }


    /* =========================
       TOOL CARD
    ========================= */

    .tool-card {
      display: block;

      min-height: 180px;

      background: #ffffff;

      border:
        1px solid #e1e4ea;

      border-radius: 14px;

      padding: 25px;

      text-decoration: none;

      color: #222;

      transition:
        transform 0.2s,
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }


    .tool-card:hover {
      transform:
        translateY(-4px);

      background:
        #ffffff;
    }


    /* PDF HOVER */

    #pdf-tools .tool-card:hover {
      border-color: #a89df2;

      box-shadow:
        0 12px 30px
        rgba(124, 108, 232, 0.12);
    }


    /* TEXT HOVER */

    #text-tools .tool-card:hover {
      border-color: #87b9f2;

      box-shadow:
        0 12px 30px
        rgba(75, 147, 232, 0.12);
    }


    /* IMAGE HOVER */

    #image-tools .tool-card:hover {
      border-color: #79d2a7;

      box-shadow:
        0 12px 30px
        rgba(62, 181, 124, 0.12);
    }


    /* =========================
       TOOL ICONS
    ========================= */

    .tool-icon {
      width: 48px;

      height: 48px;

      display: flex
