<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Merge PDF - ToolNest</title>

  <meta
    name="description"
    content="Merge multiple PDF files into one PDF online for free with ToolNest."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f3f5f7;
      color: #344154;
      line-height: 1.5;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      background: #ffffff;
      border-bottom: 1px solid #e4e8ec;
    }

    .top-header {
      max-width: 1240px;
      height: 100px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
    }

    .logo img {
      display: block;
      max-width: 190px;
      max-height: 65px;
      object-fit: contain;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
      flex: 1;
      max-width: 700px;
      position: relative;
    }

    #toolSearch {
      width: 100%;
      height: 56px;
      border: 1px solid #d9dfe5;
      border-radius: 10px;
      padding: 0 52px 0 20px;
      font-size: 15px;
      color: #344154;
      background: #ffffff;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #toolSearch::placeholder {
      color: #929ba6;
    }

    #toolSearch:focus {
      border-color: #326ba8;
      box-shadow:
        0 0 0 3px
        rgba(50, 107, 168, 0.10);
    }

    .search-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 25px;
      color: #7d8792;
      pointer-events: none;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation-wrapper {
      background: #ffffff;
      border-top: 1px solid #f0f2f4;
    }

    .main-navigation {
      max-width: 1240px;
      height: 72px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      gap: 42px;
    }

    .nav-button {
      height: 72px;
      border: none;
      background: transparent;
      color: #66717d;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }

    .nav-button:hover {
      color: #344154;
    }

    .nav-button.active {
      color: #344154;
    }

    .nav-button.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: #326ba8;
      border-radius:
        3px 3px 0 0;
    }

    /* =========================
       PAGE
    ========================= */

    .page-content {
      max-width: 1240px;
      margin: 0 auto;
      padding: 38px 28px 60px;
    }

    .content-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        200px;
      gap: 30px;
      align-items: start;
    }

    .main-content {
      min-width: 0;
    }

    /* =========================
       BREADCRUMB
    ========================= */

    .breadcrumb {
      margin-bottom: 18px;
      font-size: 13px;
      color: #7d8792;
    }

    .breadcrumb a {
      color: #326ba8;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-separator {
      margin: 0 8px;
      color: #a8b0b8;
    }

    /* =========================
       TITLE
    ========================= */

    .page-title {
      font-size: 32px;
      line-height: 1.2;
      color: #263648;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .page-description {
      font-size: 15px;
      color: #697582;
      margin-bottom: 28px;
    }

    /* =========================
       TOOL BOX
    ========================= */

    .tool-box {
      background: #ffffff;
      border: 1px solid #e2e6ea;
      border-radius: 12px;
      padding: 24px;
      box-shadow:
        0 3px 12px
        rgba(30, 45, 60, 0.04);
    }

    /* =========================
       UPLOAD / PREVIEW AREA
    ========================= */

    .upload-area {
      min-height: 250px;
      border: 2px dashed #cbd3db;
      border-radius: 10px;
      background: #fafbfc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        background 0.2s ease;
      padding: 25px;
    }

    .upload-area:hover {
      border-color: #326ba8;
      background: #f8fafc;
    }

    .upload-area.drag-over {
      border-color: #326ba8;
      background: #f1f6fb;
    }

    .upload-content {
      text-align: center;
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #eaf2fa;
      color: #326ba8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .upload-title {
      font-size: 17px;
      font-weight: 700;
      color: #344154;
      margin-bottom: 5px;
    }

    .upload-subtitle {
      font-size: 13px;
      color: #87919c;
    }

    #fileInput {
      display: none;
    }

    /* =========================
       PREVIEW CONTENT
    ========================= */

    .preview-container {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .drag-message {
      font-size: 14px;
      font-weight: 700;
      color: #526170;
      text-align: center;
      margin-bottom: 20px;
    }

    .pdf-previews {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }

    .pdf-preview {
      width: 150px;
      position: relative;
      cursor: grab;
      user-select: none;
    }

    .pdf-preview:active {
      cursor: grabbing;
    }

    .pdf-preview.dragging {
      opacity: 0.45;
    }

    .pdf-thumbnail {
      width: 150px;
      height: 190px;
      border: 1px solid #dfe4e8;
      border-radius: 8px;
      background: #ffffff;
      overflow: hidden;
      box-shadow:
        0 2px 7px
        rgba(30, 45, 60, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pdf-thumbnail canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .pdf-file-name {
      margin-top: 8px;
      font-size: 12px;
      color: #596675;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-file {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: #e65353;
      color: #ffffff;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
      z-index: 5;
      box-shadow:
        0 2px 5px
        rgba(0, 0, 0, 0.15);
    }

    .remove-file:hover {
      background: #d83e3e;
    }

    /* =========================
       BUTTONS
    ========================= */

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      height: 46px;
      padding: 0 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .primary-button {
      flex: 1;
      border: none;
      background: #326ba8;
      color: #ffffff;
      box-shadow:
        0 4px 10px
        rgba(50, 107, 168, 0.18);
    }

    .primary-button:hover:not(:disabled) {
      background: #285b91;
      transform: translateY(-1px);
      box-shadow:
        0 5px 12px
        rgba(50, 107, 168, 0.22);
    }

    .primary-button:disabled {
      background: #b8c2cc;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-button {
      flex: 1;
      border: 1px solid #d2d9df;
      background: #ffffff;
      color: #526170;
    }

    .secondary-button:hover {
      background: #f7f8f9;
      border-color: #bcc5cd;
    }

    /* ONLY "Merge PDFs" is larger */
    .large-text {
      font-size: 18px;
      font-weight: 800;
    }

    /* =========================
       STATUS
    ========================= */

    .status-message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }

    .status-message.success {
      display: block;
      background: #edf8f1;
      color: #277344;
      border: 1px solid #ccebd7;
    }

    .status-message.error {
      display: block;
      background: #fff1f1;
      color: #b33a3a;
      border: 1px solid #f0cccc;
    }

    .status-message.loading {
      display: block;
      background: #f1f5f9;
      color: #526170;
      border: 1px solid #dce3e9;
    }

    /* =========================
       AD
    ========================= */

    .ad-column {
      width: 200px;
      position: sticky;
      top: 20px;
    }

    .ad-box {
      width: 200px;
      height: 400px;
      background: #ffffff;
      border: 1px solid #e2e6ea;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #a0a9b2;
      text-align: center;
    }

    .ad-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #eef1f4;
      color: #9aa4ae;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .ad-box span {
      font-size: 12px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      background: #ffffff;
      border-top: 1px solid #e2e6ea;
    }

    .footer-content {
      max-width: 1240px;
      min-height: 90px;
      margin: 0 auto;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-copy {
      font-size: 13px;
      color: #7d8792;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      font-size: 13px;
      color: #687481;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #326ba8;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {
      .top-header {
        gap: 30px;
      }

      .main-navigation {
        gap: 25px;
        overflow-x: auto;
      }

      .content-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .ad-column {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .top-header {
        height: auto;
        padding: 18px 20px;
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
      }

      .logo {
        justify-content: center;
      }

      .logo img {
        max-width: 170px;
      }

      .search-area {
        max-width: none;
      }

      .main-navigation {
        height: 58px;
        padding: 0 20px;
        gap: 25px;
      }

      .nav-button {
        height: 58px;
        font-size: 13px;
      }

      .page-content {
        padding:
          28px
          20px
          45px;
      }

      .page-title {
        font-size: 27px;
      }

      .page-description {
        font-size: 14px;
      }

      .tool-box {
        padding: 16px;
      }

      .upload-area {
        min-height: 230px;
        padding: 18px;
      }

      .pdf-previews {
        gap: 14px;
      }

      .pdf-preview,
      .pdf-thumbnail {
        width: 135px;
      }

      .pdf-thumbnail {
        height: 175px;
      }

      .button-row {
        flex-direction: column;
      }

      .primary-button,
      .secondary-button {
        width: 100%;
      }

      .footer-content {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        padding:
          24px
          20px;
      }

      .footer-links {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>

  <!-- PDF.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>

  <!-- PDF-LIB -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"
  ></script>


  <script>

    /* =========================
       PDF.JS SETUP
    ========================= */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* =========================
       ELEMENTS
    ========================= */

    const fileInput =
      document.getElementById("fileInput");

    const uploadArea =
      document.getElementById("uploadArea");

    const uploadContent =
      document.getElementById("uploadContent");

    const previewContainer =
      document.getElementById("previewContainer");

    const pdfPreviews =
      document.getElementById("pdfPreviews");

    const mergeButton =
      document.getElementById("mergeButton");

    const clearButton =
      document.getElementById("clearButton");

    const statusMessage =
      document.getElementById("statusMessage");

    const toolSearch =
      document.getElementById("toolSearch");


    /* =========================
       FILE STORAGE
    ========================= */

    let pdfFiles = [];
    let draggedIndex = null;


    /* =========================
       SEARCH
    ========================= */

    toolSearch.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          const query =
            toolSearch.value
              .trim()
              .toLowerCase();

          if (
            query.includes("merge") &&
            query.includes("pdf")
          ) {
            return;
          }

          if (query.includes("split")) {
            window.location.href =
              "split-pdf.html";
          }

        }

      }
    );


    /* =========================
       OPEN FILE PICKER
    ========================= */

    uploadArea.addEventListener(
      "click",
      function (event) {

        if (
          event.target.closest(".remove-file")
        ) {
          return;
        }

        fileInput.click();

      }
    );


    /* =========================
       FILE INPUT
    ========================= */

    fileInput.addEventListener(
      "change",
      function () {

        addFiles(
          Array.from(fileInput.files)
        );

        fileInput.value = "";

      }
    );


    /* =========================
       DRAG & DROP FILE UPLOAD
    ========================= */

    uploadArea.addEventListener(
      "dragover",
      function (event) {

        event.preventDefault();

        uploadArea.classList.add(
          "drag-over"
        );

      }
    );


    uploadArea.addEventListener(
      "dragleave",
      function () {

        uploadArea.classList.remove(
          "drag-over"
        );

      }
    );


    uploadArea.addEventListener(
      "drop",
      function (event) {

        event.preventDefault();

        uploadArea.classList.remove(
          "drag-over"
        );

        const files =
          Array.from(event.dataTransfer.files)
            .filter(isPdf);

        addFiles(files);

      }
    );


    /* =========================
       CHECK PDF
    ========================= */

    function isPdf(file) {

      return (
        file.type === "application/pdf" ||
        file.name
          .toLowerCase()
          .endsWith(".pdf")
      );

    }


    /* =========================
       ADD FILES
    ========================= */

    function addFiles(files) {

      const validFiles =
        files.filter(isPdf);

      if (!validFiles.length) {

        showStatus(
          "Please select PDF files only.",
          "error"
        );

        return;

      }

      pdfFiles =
        pdfFiles.concat(validFiles);

      renderPreviews();

      hideStatus();

    }


    /* =========================
       RENDER PREVIEWS
    ========================= */

    async function renderPreviews() {

      pdfPreviews.innerHTML = "";

      if (!pdfFiles.length) {

        uploadContent.style.display =
          "block";

        previewContainer.style.display =
          "none";

        mergeButton.disabled = true;

        return;

      }

      uploadContent.style.display =
        "none";

      previewContainer.style.display =
        "flex";

      mergeButton.disabled = false;


      pdfFiles.forEach(
        function (file, index) {

          const preview =
            createPreviewElement(
              file,
              index
            );

          pdfPreviews.appendChild(preview);

          renderPdfThumbnail(
            file,
            preview.querySelector("canvas")
          );

        }
      );

    }


    /* =========================
       CREATE PREVIEW
    ========================= */

    function createPreviewElement(
      file,
      index
    ) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "pdf-preview";

      wrapper.draggable = true;

      wrapper.dataset.index = index;


      const thumbnail =
        document.createElement("div");

      thumbnail.className =
        "pdf-thumbnail";


      const canvas =
        document.createElement("canvas");


      thumbnail.appendChild(canvas);


      const fileName =
        document.createElement("div");

      fileName.className =
        "pdf-file-name";

      fileName.textContent =
        file.name;


      const removeButton =
        document.createElement("button");

      removeButton.className =
        "remove-file";

      removeButton.type =
        "button";

      removeButton.innerHTML =
        "×";

      removeButton.title =
        "Remove PDF";


      removeButton.addEventListener(
        "click",
        function (event) {

          event.stopPropagation();

          removeFile(index);

        }
      );


      wrapper.appendChild(
        thumbnail
      );

      wrapper.appendChild(
        fileName
      );

      wrapper.appendChild(
        removeButton
      );


      /* Drag ordering */

      wrapper.addEventListener(
        "dragstart",
        function (event) {

          draggedIndex = index;

          wrapper.classList.add(
            "dragging"
          );

          event.dataTransfer.effectAllowed =
            "move";

        }
      );


      wrapper.addEventListener(
        "dragend",
        function () {

          wrapper.classList.remove(
            "dragging"
          );

          draggedIndex = null;

        }
      );


      wrapper.addEventListener(
        "dragover",
        function (event) {

          event.preventDefault();

          event.dataTransfer.dropEffect =
            "move";

        }
      );


      wrapper.addEventListener(
        "drop",
        function (event) {

          event.preventDefault();

          const targetIndex =
            Number(
              wrapper.dataset.index
            );

          if (
            draggedIndex === null ||
            draggedIndex === targetIndex
          ) {
            return;
          }

          const movedFile =
            pdfFiles.splice(
              draggedIndex,
              1
            )[0];

          pdfFiles.splice(
            targetIndex,
            0,
            movedFile
          );

          renderPreviews();

        }
      );


      return wrapper;

    }


    /* =========================
       PDF THUMBNAIL
    ========================= */

    async function renderPdfThumbnail(
      file,
      canvas
    ) {

      try {

        const arrayBuffer =
          await file.arrayBuffer();

        const pdf =
          await pdfjsLib.getDocument({
            data: arrayBuffer
          }).promise;

        const page =
          await pdf.getPage(1);

        const baseViewport =
          page.getViewport({
            scale: 1
          });

        const maxWidth = 138;
        const maxHeight = 178;

        const scale =
          Math.min(
            maxWidth /
              baseViewport.width,
            maxHeight /
              baseViewport.height
          );

        const viewport =
          page.getViewport({
            scale: scale
          });

        canvas.width =
          viewport.width;

        canvas.height =
          viewport.height;

        const context =
          canvas.getContext("2d");

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

      } catch (error) {

        console.error(
          "Preview error:",
          error
        );

        canvas.style.display =
          "none";

        const parent =
          canvas.parentElement;

        parent.innerHTML =
          '<span style="font-size:13px;color:#89939d;">PDF Preview</span>';

      }

    }


    /* =========================
       REMOVE FILE
    ========================= */

    function removeFile(index) {

      pdfFiles.splice(
        index,
        1
      );

      renderPreviews();

    }


    /* =========================
       CLEAR ALL
    ========================= */

    clearButton.addEventListener(
      "click",
      function () {

        pdfFiles = [];

        fileInput.value = "";

        renderPreviews();

        hideStatus();

      }
    );


    /* =========================
       MERGE PDFS
    ========================= */

    mergeButton.addEventListener(
      "click",
      async function () {

        if (!pdfFiles.length) {
          return;
        }

        mergeButton.disabled =
          true;

        clearButton.disabled =
          true;

        showStatus(
          "Merging your PDF files...",
          "loading"
        );


        try {

          const mergedPdf =
            await PDFLib.PDFDocument.create();


          for (
            let i = 0;
            i < pdfFiles.length;
            i++
          ) {

            const file =
              pdfFiles[i];

            showStatus(
              "Processing PDF " +
              (i + 1) +
              " of " +
              pdfFiles.length +
              "...",
              "loading"
            );


            const bytes =
              await file.arrayBuffer();

            const sourcePdf =
              await PDFLib.PDFDocument.load(
                bytes
              );


            const pageIndices =
              sourcePdf
                .getPageIndices();


            const copiedPages =
              await mergedPdf.copyPages(
                sourcePdf,
                pageIndices
              );


            copiedPages.forEach(
              function (page) {

                mergedPdf.addPage(
                  page
                );

              }
            );

          }


          showStatus(
            "Creating your merged PDF...",
            "loading"
          );


          const mergedBytes =
            await mergedPdf.save();


          const blob =
            new Blob(
              [mergedBytes],
              {
                type:
                  "application/pdf"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );

          link.href =
            url;

          link.download =
            "merged-pdf.pdf";

          document.body.appendChild(
            link
          );

          link.click();

          link.remove();

          URL.revokeObjectURL(
            url
          );


          showStatus(
            "Your merged PDF has been downloaded successfully.",
            "success"
          );


        } catch (error) {

          console.error(
            "Merge error:",
            error
          );

          showStatus(
            "Something went wrong while merging the PDF files. Please try again.",
            "error"
          );

        } finally {

          mergeButton.disabled =
            pdfFiles.length === 0;

          clearButton.disabled =
            false;

        }

      }
    );


    /* =========================
       STATUS HELPERS
    ========================= */

    function showStatus(
      message,
      type
    ) {

      statusMessage.textContent =
        message;

      statusMessage.className =
        "status-message " +
        type;

    }


    function hideStatus() {

      statusMessage.textContent =
        "";

      statusMessage.className =
        "status-message";

    }

  </script>
