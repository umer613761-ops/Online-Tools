<!-- =========================
     MERGE PDF UPLOAD BOX
========================= -->

<div class="merge-upload-box">

    <input
        type="file"
        id="pdfInput"
        accept=".pdf,application/pdf"
        multiple
        hidden
    >


    <!-- CLICKABLE UPLOAD AREA -->

    <div
        class="upload-area"
        id="uploadArea"
    >


        <!-- SHOWN BEFORE FILES ARE UPLOADED -->

        <div
            class="upload-placeholder"
            id="uploadPlaceholder"
        >

            <div class="upload-icon">
                📄
            </div>

            <h2>
                Select PDF Files
            </h2>

            <p>
                Choose two or more PDF files to merge.
            </p>

        </div>



        <!-- SHOWN AFTER FILES ARE UPLOADED -->

        <div
            class="uploaded-files"
            id="uploadedFiles"
        >

            <div class="uploaded-title">

                <span>
                    Selected PDF Files
                </span>

                <span class="add-more-text">
                    Click inside this box to add more files
                </span>

            </div>


            <div
                class="pdf-grid"
                id="pdfGrid"
            >
            </div>

        </div>


    </div>

</div>
