<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Merge PDF - Free Online Tool | ToolNest</title>

  <meta
    name="description"
    content="Merge multiple PDF files into one PDF online for free."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
    }

    .logo span {
      color: #666;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      color: #000;
    }

    /* Main */

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 60px 20px 80px;
    }

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .heading h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .heading p {
      max-width: 650px;
      margin: 0 auto;
      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }

    /* Tool Box */

    .tool-box {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 30px;
    }

    /* Upload */

    .upload-area {
      display: block;
      padding: 45px 20px;
      text-align: center;
      border: 2px dashed #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #888;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .upload-area h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .upload-area p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    /* Editor */

    .editor {
      display: none;
      margin-top: 30px;
    }

    .editor-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .editor-header h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .editor-header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    /* PDF Grid */

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    /* PDF Card */

    .pdf-card {
      background: #f6f7fb;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: grab;
      transition: 0.2s;
    }

    .pdf-card:hover {
      border-color: #bbb;
      transform: translateY(-2px);
    }

    .pdf-card.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .pdf-card.drag-over {
      border: 2px solid #222;
    }

    /* Preview */

    .pdf-preview {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
    }

    .pdf-preview canvas {
      max-width: 100%;
      max-height: 100%;
    }

    /* File Information */

    .file-name {
      margin-top: 12px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-pages {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    /* Remove */

    .remove-file {
      margin-top: 10px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 13px;
      cursor: pointer;
    }

    .remove-file:hover {
      color: #222;
    }

    /* Controls Outside Previews */

    .order-controls {
      text-align: center;
      margin-top: 25px;
    }

    .change-order-button {
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      background: #e9e9e9;
      color: #222;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .change-order-button:hover {
      background: #ddd;
    }

    .order-hint {
      margin-top: 12px;
      color: #777;
      font-size: 13px;
    }

    /* Add More */

    .add-more {
      display: block;
      width: fit-content;
      margin: 25px auto 0;
      color: #555;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-more:hover {
      color: #000;
    }

    /* Buttons */

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      font-family: Arial, sans-serif;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary-button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-button {
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      background: #e9e9e9;
      color: #222;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Status */

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      background: #f6f7fb;
      border-radius: 8px;
      color: #666;
      font-size: 14px;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 35px 20px;
      background: #ffffff;
      border-top: 1px solid #e5e5e5;
      color: #777;
      font-size: 14px;
    }

    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding: 15px 20px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        padding: 45px 15px 60px;
      }

      .heading h1 {
        font-size: 30px;
      }

      .tool-box {
        padding: 20px;
      }

      .pdf-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .pdf-preview {
        height: 170px;
      }

      .buttons {
        flex-direction: column;
      }

      .buttons button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <!-- Navigation -->

  <nav>

    <a href="index.html" class="logo">
      Tool<span>Nest</span>
    </a>

    <a href="index.html" class="back-link">
      ← All Tools
    </a>

  </nav>


  <!-- Main -->

  <main class="container">

    <div class="heading">

      <h1>Merge PDF</h1>

      <p>
        Combine multiple PDF files into one document.
        Drag the files to change their order.
      </p>

    </div>


    <div class="tool-box">

      <!-- Upload -->

      <label
        for="pdfInput"
        class="upload-area"
      >

        <div class="upload-icon">
          📄
        </div>

        <h2>
          Choose PDF Files
        </h2>

        <p>
          Select two or more PDF files to merge.
        </p>

      </label>


      <input
        type="file"
        id="pdfInput"
        accept="application/pdf"
        multiple
      >


      <!-- Editor -->

      <div
        class="editor"
        id="editor"
      >

        <div class="editor-header">

          <h2>
            Your PDF Files
          </h2>

          <p>
            Drag and drop the previews to change the merge order.
          </p>

        </div>


        <!-- PDF Previews -->

        <div
          class="pdf-grid"
          id="pdfGrid"
        >
        </div>


        <!-- Separate Order Controls -->

        <div class="order-controls">

          <button
            class="change-order-button"
            id="changeOrderButton"
          >
            ↔ Change Order
          </button>

          <div class="order-hint">
            You can also drag any preview left or right.
          </div>

        </div>


        <!-- Add More -->

        <label
          for="pdfInput"
          class="add-more"
        >
          + Add More PDF Files
        </label>


        <!-- Main Buttons -->

        <div class="buttons">

          <button
            class="primary-button"
            id="mergeButton"
          >
            Merge PDFs
          </button>

          <button
            class="secondary-button"
            id="startOverButton"
          >
            Start Over
          </button>

        </div>


        <div
          class="status"
          id="status"
        >
        </div>

      </div>

    </div>

  </main>


  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>


  <!-- PDF.js -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  ></script>


  <!-- PDF-Lib -->

  <script
    src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"
  ></script>


  <script>


    /* PDF.js Worker */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* Elements */

    const pdfInput =
      document.getElementById("pdfInput");

    const editor =
      document.getElementById("editor");

    const pdfGrid =
      document.getElementById("pdfGrid");

    const mergeButton =
      document.getElementById("mergeButton");

    const startOverButton =
      document.getElementById("startOverButton");

    const changeOrderButton =
      document.getElementById("changeOrderButton");

    const status =
      document.getElementById("status");


    /* Data */

    let pdfFiles = [];

    let draggedIndex = null;


    /* Upload PDFs */

    pdfInput.addEventListener(
      "change",
      async function(event) {

        const files =
          Array.from(event.target.files);

        if (files.length === 0) {
          return;
        }


        for (const file of files) {

          if (
            file.type !== "application/pdf"
          ) {
            continue;
          }


          try {

            const data =
              await file.arrayBuffer();

            const pdf =
              await PDFLib.PDFDocument.load(
                data.slice(0)
              );


            pdfFiles.push({
              name: file.name,
              data: data,
              pages: pdf.getPageCount()
            });

          }

          catch (error) {

            console.error(error);

            alert(
              "Could not open " + file.name
            );

          }

        }


        pdfInput.value = "";

        renderFiles();

      }
    );


    /* Render Files */

    async function renderFiles() {

      pdfGrid.innerHTML = "";


      if (
        pdfFiles.length === 0
      ) {

        editor.style.display =
          "none";

        return;

      }


      editor.style.display =
        "block";


      for (
        let i = 0;
        i < pdfFiles.length;
        i++
      ) {

        const file =
          pdfFiles[i];


        const card =
          document.createElement("div");


        card.className =
          "pdf-card";


        card.draggable =
          true;


        card.dataset.index =
          i;


        card.innerHTML = `

          <div
            class="pdf-preview"
            id="preview-${i}"
          >
            📄
          </div>

          <div
            class="file-name"
            title="${escapeHtml(file.name)}"
          >
            ${escapeHtml(file.name)}
          </div>

          <div class="file-pages">

            ${file.pages}
            ${file.pages === 1 ? "page" : "pages"}

          </div>

          <button class="remove-file">
            Remove
          </button>

        `;


        /* Create Preview */

        createPreview(
          file.data,
          "preview-" + i
        );


        /* Drag Start */

        card.addEventListener(
          "dragstart",
          function() {

            draggedIndex =
              i;


            card.classList.add(
              "dragging"
            );

          }
        );


        /* Drag End */

        card.addEventListener(
          "dragend",
          function() {

            draggedIndex =
              null;


            card.classList.remove(
              "dragging"
            );


            document
              .querySelectorAll(
                ".pdf-card"
              )
              .forEach(
                function(item) {

                  item.classList.remove(
                    "drag-over"
                  );

                }
              );

          }
        );


        /* Drag Over */

        card.addEventListener(
          "dragover",
          function(event) {

            event.preventDefault();


            card.classList.add(
              "drag-over"
            );

          }
        );


        /* Drag Leave */

        card.addEventListener(
          "dragleave",
          function() {

            card.classList.remove(
              "drag-over"
            );

          }
        );


        /* Drop */

        card.addEventListener(
          "drop",
          function(event) {

            event.preventDefault();


            card.classList.remove(
              "drag-over"
            );


            if (
              draggedIndex === null
              ||
              draggedIndex === i
            ) {

              return;

            }


            const movedFile =
              pdfFiles.splice(
                draggedIndex,
                1
              )[0];


            pdfFiles.splice(
              i,
              0,
              movedFile
            );


            renderFiles();

          }
        );


        /* Remove File */

        const removeButton =
          card.querySelector(
            ".remove-file"
          );


        removeButton.addEventListener(
          "click",
          function(event) {

            event.stopPropagation();


            pdfFiles.splice(
              i,
              1
            );


            renderFiles();

          }
        );


        pdfGrid.appendChild(
          card
        );

      }

    }


    /* Change Order Button */

    changeOrderButton.addEventListener(
      "click",
      function() {

        pdfFiles.reverse();

        renderFiles();

      }
    );


    /* Create PDF Preview */

    async function createPreview(
      pdfData,
      previewId
    ) {

      try {

        const loadingTask =
          pdfjsLib.getDocument({
            data: pdfData.slice(0)
          });


        const pdf =
          await loadingTask.promise;


        const page =
          await pdf.getPage(1);


        const viewport =
          page.getViewport({
            scale: 0.4
          });


        const canvas =
          document.createElement(
            "canvas"
          );


        const context =
          canvas.getContext("2d");


        canvas.width =
          viewport.width;


        canvas.height =
          viewport.height;


        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;


        const preview =
          document.getElementById(
            previewId
          );


        if (preview) {

          preview.innerHTML = "";

          preview.appendChild(
            canvas
          );

        }

      }

      catch (error) {

        console.error(error);

      }

    }


    /* Merge PDFs */

    mergeButton.addEventListener(
      "click",
      async function() {

        if (
          pdfFiles.length < 2
        ) {

          alert(
            "Please choose at least two PDF files."
          );

          return;

        }


        try {

          mergeButton.disabled =
            true;


          mergeButton.textContent =
            "Merging PDFs...";


          status.style.display =
            "block";


          const mergedPdf =
            await PDFLib.PDFDocument.create();


          for (
            let i = 0;
            i < pdfFiles.length;
            i++
          ) {

            status.textContent =
              "Adding PDF "
              +
              (i + 1)
              +
              " of "
              +
              pdfFiles.length
              +
              "...";


            const sourcePdf =
              await PDFLib.PDFDocument.load(
                pdfFiles[i].data.slice(0)
              );


            const pages =
              await mergedPdf.copyPages(
                sourcePdf,
                sourcePdf.getPageIndices()
              );


            for (
              const page of pages
            ) {

              mergedPdf.addPage(
                page
              );

            }

          }


          status.textContent =
            "Creating your merged PDF...";


          const mergedPdfBytes =
            await mergedPdf.save();


          const blob =
            new Blob(
              [mergedPdfBytes],
              {
                type:
                  "application/pdf"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            "merged.pdf";


          document.body.appendChild(
            link
          );


          link.click();


          document.body.removeChild(
            link
          );


          setTimeout(
            function() {

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );


          status.textContent =
            "Done! Your merged PDF has been downloaded.";

        }

        catch (error) {

          console.error(error);


          alert(
            "Something went wrong while merging your PDFs."
          );


          status.style.display =
            "none";

        }


        mergeButton.disabled =
          false;


        mergeButton.textContent =
          "Merge PDFs";

      }
    );


    /* Start Over */

    startOverButton.addEventListener(
      "click",
      function() {

        pdfFiles = [];

        draggedIndex =
          null;


        pdfInput.value =
          "";


        pdfGrid.innerHTML =
          "";


        editor.style.display =
          "none";


        status.style.display =
          "none";

      }
    );


    /* Escape HTML */

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


  </script>

</body>

</html>
