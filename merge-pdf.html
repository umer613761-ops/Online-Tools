}


.tool-heading p {

.upload-placeholder {

/* Orange PDF icon */

<script>


/* PDF.JS WORKER */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* ELEMENTS */

const pdfInput =
    document.getElementById("pdfInput");

const pdfGrid =
    document.getElementById("pdfGrid");

const uploadPlaceholder =
    document.getElementById("uploadPlaceholder");

const uploadedFiles =
    document.getElementById("uploadedFiles");

const editorControls =
    document.getElementById("editorControls");

const mergeButton =
    document.getElementById("mergeButton");


/* FILE STORAGE */

let pdfFiles = [];

let draggedId = null;


/* =========================
   FILE UPLOAD
========================= */

pdfInput.addEventListener(
    "change",
    function(event) {

        const files =
            Array.from(event.target.files);


        files.forEach(
            function(file) {

                if (
                    file.type ===
                    "application/pdf"
                ) {

                    pdfFiles.push({

                        file: file,

                        id:
                            Date.now()
                            +
                            Math.random()

                    });

                }

            }
        );


        updateInterface();

        renderPDFs();


        /* Reset input so the same file
           can be selected again */

        pdfInput.value = "";

    }
);


/* =========================
   UPDATE INTERFACE
========================= */

function updateInterface() {

    if (
        pdfFiles.length > 0
    ) {

        uploadPlaceholder.style.display =
            "none";

        uploadedFiles.classList.add(
            "active"
        );

        editorControls.classList.add(
            "active"
        );

    }

    else {

        uploadPlaceholder.style.display =
            "flex";

        uploadedFiles.classList.remove(
            "active"
        );

        editorControls.classList.remove(
            "active"
        );

    }

}


/* =========================
   RENDER PDF FILES
========================= */

function renderPDFs() {

    pdfGrid.innerHTML = "";


    pdfFiles.forEach(
        function(item) {


            const card =
                document.createElement("div");


            card.className =
                "pdf-card";


            card.dataset.id =
                item.id;


            card.draggable =
                true;


            /* DRAG START */

            card.addEventListener(
                "dragstart",
                function() {

                    draggedId =
                        item.id;


                    card.classList.add(
                        "dragging"
                    );

                }
            );


            /* DRAG END */

            card.addEventListener(
                "dragend",
                function() {

                    draggedId =
                        null;


                    card.classList.remove(
                        "dragging"
                    );

                }
            );


            /* ALLOW DROP */

            card.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();

                }
            );


            /* DROP */

            card.addEventListener(
                "drop",
                function(event) {

                    event.preventDefault();


                    if (
                        draggedId ===
                        item.id
                    ) {
                        return;
                    }


                    const draggedIndex =
                        pdfFiles.findIndex(
                            pdf =>
                                pdf.id ===
                                draggedId
                        );


                    const targetIndex =
                        pdfFiles.findIndex(
                            pdf =>
                                pdf.id ===
                                item.id
                        );


                    if (
                        draggedIndex === -1 ||
                        targetIndex === -1
                    ) {
                        return;
                    }


                    const movedFile =
                        pdfFiles.splice(
                            draggedIndex,
                            1
                        )[0];


                    pdfFiles.splice(
                        targetIndex,
                        0,
                        movedFile
                    );


                    renderPDFs();

                }
            );


            /* PREVIEW */

            const preview =
                document.createElement("div");


            preview.className =
                "pdf-preview";


            const canvas =
                document.createElement("canvas");


            preview.appendChild(
                canvas
            );


            /* FILE NAME */

            const name =
                document.createElement("div");


            name.className =
                "pdf-name";


            name.textContent =
                item.file.name;


            /* REMOVE BUTTON */

            const removeButton =
                document.createElement("button");


            removeButton.className =
                "remove-button";


            removeButton.type =
                "button";


            removeButton.textContent =
                "×";


            removeButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    pdfFiles =
                        pdfFiles.filter(
                            pdf =>
                                pdf.id !==
                                item.id
                        );


                    updateInterface();

                    renderPDFs();

                }
            );


            /* BUILD CARD */

            card.appendChild(
                preview
            );


            card.appendChild(
                name
            );


            card.appendChild(
                removeButton
            );


            pdfGrid.appendChild(
                card
            );


            /* CREATE PREVIEW */

            renderPDFPreview(
                item.file,
                canvas
            );

        }
    );

}


/* =========================
   PDF PREVIEW
========================= */

async function renderPDFPreview(
    file,
    canvas
) {

    try {

        const arrayBuffer =
            await file.arrayBuffer();


        const pdf =
            await pdfjsLib.getDocument({

                data:
                    arrayBuffer

            }).promise;


        const page =
            await pdf.getPage(1);


        const viewport =
            page.getViewport({

                scale: 0.45

            });


        const context =
            canvas.getContext("2d");


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;

    }

    catch (error) {

        console.error(
            "PDF preview error:",
            error
        );

    }

}


/* =========================
   MERGE PDFs
========================= */

mergeButton.addEventListener(
    "click",
    async function() {


        if (
            pdfFiles.length < 2
        ) {

            alert(
                "Please select at least two PDF files."
            );

            return;

        }


        try {

            mergeButton.disabled =
                true;


            mergeButton.textContent =
                "Merging PDFs...";


            const mergedPdf =
                await PDFLib.PDFDocument.create();


            for (
                const item
                of pdfFiles
            ) {

                const arrayBuffer =
                    await item.file.arrayBuffer();


                const sourcePdf =
                    await PDFLib.PDFDocument.load(
                        arrayBuffer
                    );


                const copiedPages =
                    await mergedPdf.copyPages(

                        sourcePdf,

                        sourcePdf.getPageIndices()

                    );


                copiedPages.forEach(
                    function(page) {

                        mergedPdf.addPage(
                            page
                        );

                    }
                );

            }


            const mergedPdfBytes =
                await mergedPdf.save();


            const blob =
                new Blob(

                    [mergedPdfBytes],

                    {

                        type:
                            "application/pdf"

                    }

                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "merged-toolnest.pdf";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            mergeButton.disabled =
                false;


            mergeButton.textContent =
                "Merge PDFs";

        }

        catch (error) {

            console.error(
                "Merge error:",
                error
            );


            alert(
                "Something went wrong while merging the PDFs."
            );


            mergeButton.disabled =
                false;


            mergeButton.textContent =
                "Merge PDFs";

        }

    }
);


</script>

</body>

</html>
