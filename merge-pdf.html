<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merge PDF - ToolNest</title>

<meta
    name="description"
    content="Merge multiple PDF files into one PDF for free with ToolNest."
>


<!-- PDF.JS FOR PDF PREVIEWS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PDF-LIB FOR ACTUAL PDF MERGING -->

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 12px 18px;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: #cfd9e4;
    color: #344154;
}


/* =========================
   PAGE WRAPPER
========================= */

.site-wrapper {
    max-width: 1040px;
    margin: 0 auto;
}


/* =========================
   HEADER
========================= */

header {
    height: 64px;

    background: #ffffff;

    border: 1px solid #c4d0dc;
    border-radius: 12px;

    box-shadow:
        0 5px 14px
        rgba(50, 70, 90, 0.10);
}

.navbar {
    height: 100%;

    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 30px;
}


/* =========================
   LOGO
========================= */

.logo {
    display: flex;
    align-items: center;

    gap: 10px;

    text-decoration: none;
}

.logo-icon {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #3d75b3,
            #1e5593
        );

    color: #ffffff;

    font-size: 20px;
    font-weight: 700;
}

.logo-text {
    font-size: 23px;
    letter-spacing: -0.8px;
}

.logo-tool {
    font-weight: 400;
    color: #354254;
}

.logo-nest {
    font-weight: 700;
    color: #315f98;
}


/* =========================
   SEARCH
========================= */

.search-container {
    width: 310px;
    position: relative;
}

.search-container input {
    width: 100%;
    height: 38px;

    padding: 0 42px 0 15px;

    border: 1px solid #c5d0dc;
    border-radius: 8px;

    background: #fbfcfd;

    color: #415164;
    font-size: 14px;

    outline: none;
}

.search-container input:focus {
    border-color: #4c7fb7;
}

.search-icon {
    position: absolute;

    right: 13px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 20px;

    color: #53677b;
}


/* =========================
   MAIN LAYOUT
========================= */

.page-layout {
    margin-top: 14px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        200px;

    gap: 10px;

    align-items: start;
}


/* =========================
   TOOL HEADING
========================= */

.tool-heading {
    background: #ffffff;

    border: 1px solid #c4d0dc;
    border-radius: 12px;

    box-shadow:
        0 5px 14px
        rgba(50, 70, 90, 0.10);

    padding: 24px 25px;

    text-align: center;

    margin-bottom: 10px;
}

.tool-heading h1 {
    margin: 0 0 8px;

    font-size: 30px;

    color: #354254;
}

.tool-heading h1 span {
    color: #356aa5;
}

.tool-heading p {
    margin: 0;

    color: #607184;

    font-size: 14px;
}


/* =========================
   TOOL BOX
========================= */

.tool-box {
    background: #ffffff;

    border: 1px solid #c4d0dc;
    border-radius: 12px;

    box-shadow:
        0 5px 14px
        rgba(50, 70, 90, 0.10);

    padding: 20px;
}


/* =========================
   IMPORTANT:
   HIDE CHOOSE FILES BUTTON
========================= */

#pdfInput {
    display: none;
}


/* =========================
   UPLOAD AREA
========================= */

.upload-area {
    display: block;

    min-height: 260px;

    padding: 25px 20px;

    text-align: center;

    background: #f8fafc;

    border:
        2px dashed
        #aebdcb;

    border-radius: 12px;

    cursor: pointer;

    transition:
        background 0.2s,
        border-color 0.2s;
}

.upload-area:hover {
    background: #f1f6fb;

    border-color: #4c7fb7;
}


/* =========================
   UPLOAD PLACEHOLDER
========================= */

.upload-placeholder {
    min-height: 200px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.upload-icon {
    width: 62px;
    height: 62px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    border-radius: 14px;

    background: #e8f0fb;

    font-size: 30px;
}

.upload-placeholder h2 {
    margin: 0 0 8px;

    font-size: 21px;

    color: #354254;
}

.upload-placeholder p {
    margin: 0;

    color: #607184;

    font-size: 14px;
}


/* =========================
   UPLOADED FILES
========================= */

.uploaded-files {
    display: none;
}

.uploaded-files.active {
    display: block;
}

.uploaded-title {
    margin-bottom: 16px;

    color: #607184;

    font-size: 13px;
    font-weight: 600;
}


/* =========================
   PDF GRID
========================= */

.pdf-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(140px, 1fr)
        );

    gap: 12px;

    text-align: left;
}


/* =========================
   PDF CARD
========================= */

.pdf-card {
    position: relative;

    background: #ffffff;

    border:
        1px solid
        #cbd6e0;

    border-radius: 10px;

    padding: 8px;

    cursor: grab;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.pdf-card:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 7px 15px
        rgba(50, 70, 90, 0.12);
}

.pdf-card.dragging {
    opacity: 0.4;
}


/* =========================
   PDF PREVIEW
========================= */

.pdf-preview {
    height: 130px;

    background: #f7f8fa;

    border:
        1px solid
        #d7e0e8;

    border-radius: 7px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    margin-bottom: 8px;
}

.pdf-preview canvas {
    max-width: 100%;
    max-height: 100%;
}


/* =========================
   PDF NAME
========================= */

.pdf-name {
    text-align: center;

    font-size: 11px;
    font-weight: 600;

    color: #354254;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    padding: 3px 20px;
}


/* =========================
   REMOVE BUTTON
========================= */

.remove-button {
    position: absolute;

    top: 5px;
    right: 5px;

    width: 25px;
    height: 25px;

    border: none;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 2px 7px
        rgba(0, 0, 0, 0.15);

    color: #607184;

    font-size: 17px;

    cursor: pointer;

    z-index: 5;
}

.remove-button:hover {
    color: #c0392b;
}


/* =========================
   ADD MORE TEXT
========================= */

.add-more-text {
    margin-top: 16px;

    color: #356aa5;

    font-size: 13px;
    font-weight: 600;
}


/* =========================
   CONTROLS
========================= */

.editor-controls {
    display: none;

    margin-top: 18px;
}

.editor-controls.active {
    display: block;
}

.drag-hint {
    margin: 0 0 14px;

    text-align: center;

    color: #607184;

    font-size: 13px;
}


/* =========================
   BUTTONS
========================= */

.button-row {
    display: flex;

    justify-content: center;

    gap: 10px;
}

button {
    border: none;

    border-radius: 8px;

    padding: 12px 20px;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s,
        background 0.2s;
}

button:hover {
    transform:
        translateY(-1px);
}

.primary-button {
    background: #356aa5;

    color: #ffffff;
}

.primary-button:hover {
    background: #2b598d;
}

.primary-button:disabled {
    opacity: 0.7;

    cursor: wait;
}


/* =========================
   AD COLUMN
========================= */

.ad-column {
    width: 200px;
    height: 400px;

    background: #ffffff;

    border: 1px solid #c4d0dc;
    border-radius: 12px;

    box-shadow:
        0 5px 14px
        rgba(50, 70, 90, 0.10);

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: sticky;

    top: 12px;
}

.ad-label {
    color: #607184;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1px;
}

.ad-size {
    display: block;

    margin-top: 10px;

    font-size: 16px;
    font-weight: 500;
}


/* =========================
   FOOTER
========================= */

footer {
    margin-top: 12px;

    height: 78px;

    padding: 0 28px;

    background: #ffffff;

    border: 1px solid #c4d0dc;
    border-radius: 12px;

    box-shadow:
        0 5px 14px
        rgba(50, 70, 90, 0.10);

    display: flex;

    align-items: center;
    justify-content: space-between;

    color: #526275;

    font-size: 12px;
}

.footer-brand strong {
    color: #315f98;
}

.footer-links {
    display: flex;
}

.footer-links a {
    padding: 0 16px;

    text-decoration: none;

    color: #445466;
}

.footer-links a + a {
    border-left:
        1px solid
        #8090a0;
}


/* =========================
   DARK MODE
========================= */

@media (prefers-color-scheme: dark) {

    body {
        background: #18212b;
        color: #dce5ed;
    }

    header,
    .tool-heading,
    .tool-box,
    .ad-column,
    footer {
        background: #222d38;

        border-color: #3b4a58;
    }

    .logo-tool,
    .tool-heading h1,
    .upload-placeholder h2,
    .pdf-name {
        color: #e4ebf1;
    }

    .search-container input {
        background: #1b2530;

        color: #ffffff;

        border-color: #3b4a58;
    }

    .tool-heading p,
    .upload-placeholder p,
    .drag-hint,
    .uploaded-title {
        color: #aebdca;
    }

    .upload-area {
        background: #1b2631;
    }

    .pdf-card {
        background: #26323d;

        border-color: #455563;
    }

    .pdf-preview {
        background: #1b2530;

        border-color: #3b4a58;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .page-layout {
        grid-template-columns: 1fr;
    }

    .ad-column {
        width: 100%;
        height: 180px;

        position: static;
    }

    footer {
        height: auto;

        padding: 18px;

        flex-direction: column;

        gap: 12px;
    }

}


@media (max-width: 500px) {

    header {
        height: auto;
    }

    .navbar {
        padding: 12px;

        flex-direction: column;

        gap: 10px;
    }

    .search-container {
        width: 100%;
    }

    .pdf-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .pdf-preview {
        height: 110px;
    }

}

</style>

</head>


<body>


<div class="site-wrapper">


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="navbar">

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-icon">
                T
            </div>

            <div class="logo-text">

                <span class="logo-tool">
                    Tool
                </span>

                <span class="logo-nest">
                    Nest
                </span>

            </div>

        </a>


        <div class="search-container">

            <input
                type="text"
                placeholder="Search tools..."
            >

            <div class="search-icon">
                ⌕
            </div>

        </div>

    </div>

</header>



<!-- =========================
     MAIN CONTENT
========================= -->

<main class="page-layout">


    <div class="main-content">


        <!-- HEADING -->

        <section class="tool-heading">

            <h1>
                Merge <span>PDF</span>
            </h1>

            <p>
                Combine multiple PDF files into one PDF.
                Drag the files to change their order.
            </p>

        </section>



        <!-- TOOL -->

        <section class="tool-box">


            <!-- CLICKABLE UPLOAD BOX -->

            <label
                for="pdfInput"
                class="upload-area"
            >


                <!-- BEFORE UPLOAD -->

                <div
                    class="upload-placeholder"
                    id="uploadPlaceholder"
                >

                    <div class="upload-icon">
                        📄
                    </div>

                    <h2>
                        Select PDF Files
                    </h2>

                    <p>
                        Choose two or more PDF files to merge.
                    </p>

                </div>



                <!-- AFTER UPLOAD -->

                <div
                    class="uploaded-files"
                    id="uploadedFiles"
                >

                    <div class="uploaded-title">

                        Selected PDF Files

                    </div>


                    <div
                        class="pdf-grid"
                        id="pdfGrid"
                    >
                    </div>


                    <div class="add-more-text">

                        Click inside this box to add more PDF files

                    </div>

                </div>


            </label>



            <!-- HIDDEN FILE INPUT -->

            <input
                type="file"
                id="pdfInput"
                accept=".pdf,application/pdf"
                multiple
            >



            <!-- BUTTONS -->

            <div
                class="editor-controls"
                id="editorControls"
            >

                <p class="drag-hint">

                    Drag PDF files to change their order.

                </p>


                <div class="button-row">

                    <button
                        class="primary-button"
                        id="mergeButton"

                        Merge PDFs

                    </button>

                </div>

            </div>


        </section>


    </div>



    <!-- =========================
         AD
    ========================= -->

    <aside class="ad-column">

        <div class="ad-label">

            ADVERTISEMENT

            <span class="ad-size">

                200 × 400

            </span>

        </div>

    </aside>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>


    <div class="footer-brand">

        © 2026

        <strong>ToolNest</strong>

        · Simple, Fast & Free

    </div>


    <div class="footer-links">

        <a href="#">
            About
        </a>

        <a href="#">
            Privacy Policy
        </a>

        <a href="#">
            Terms of Use
        </a>

        <a href="#">
            Contact
        </a>

    </div>


</footer>


</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   PDF.JS SETUP
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================
   ELEMENTS
========================= */

const pdfInput =
    document.getElementById("pdfInput");

const pdfGrid =
    document.getElementById("pdfGrid");

const uploadPlaceholder =
    document.getElementById("uploadPlaceholder");

const uploadedFiles =
    document.getElementById("uploadedFiles");

const editorControls =
    document.getElementById("editorControls");

const mergeButton =
    document.getElementById("mergeButton");


/* =========================
   FILE STORAGE
========================= */

let pdfFiles = [];

let draggedId = null;


/* =========================
   UPLOAD FILES
========================= */

pdfInput.addEventListener(
    "change",
    function(event) {

        const files =
            Array.from(event.target.files);


        files.forEach(
            function(file) {

                if (
                    file.type ===
                    "application/pdf"
                ) {

                    pdfFiles.push({

                        file: file,

                        id:
                            Date.now() +
                            Math.random()

                    });

                }

            }
        );


        updateInterface();

        renderPDFs();


        /* Reset input so user can
           select the same file again */

        pdfInput.value = "";

    }
);


/* =========================
   UPDATE INTERFACE
========================= */

function updateInterface() {

    if (
        pdfFiles.length > 0
    ) {

        uploadPlaceholder.style.display =
            "none";


        uploadedFiles.classList.add(
            "active"
        );


        editorControls.classList.add(
            "active"
        );

    }

    else {

        uploadPlaceholder.style.display =
            "flex";


        uploadedFiles.classList.remove(
            "active"
        );


        editorControls.classList.remove(
            "active"
        );

    }

}


/* =========================
   RENDER FILES
========================= */

function renderPDFs() {

    pdfGrid.innerHTML = "";


    pdfFiles.forEach(
        function(item) {


            const card =
                document.createElement("div");


            card.className =
                "pdf-card";


            card.dataset.id =
                item.id;


            card.draggable =
                true;


            /* =========================
               DRAG START
            ========================= */

            card.addEventListener(
                "dragstart",
                function() {

                    draggedId =
                        item.id;


                    card.classList.add(
                        "dragging"
                    );

                }
            );


            /* =========================
               DRAG END
            ========================= */

            card.addEventListener(
                "dragend",
                function() {

                    draggedId =
                        null;


                    card.classList.remove(
                        "dragging"
                    );

                }
            );


            /* =========================
               DRAG OVER
            ========================= */

            card.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();

                }
            );


            /* =========================
               DROP
            ========================= */

            card.addEventListener(
                "drop",
                function(event) {

                    event.preventDefault();


                    if (
                        draggedId ===
                        item.id
                    ) {

                        return;

                    }


                    const draggedIndex =
                        pdfFiles.findIndex(
                            function(pdf) {

                                return (
                                    pdf.id ===
                                    draggedId
                                );

                            }
                        );


                    const targetIndex =
                        pdfFiles.findIndex(
                            function(pdf) {

                                return (
                                    pdf.id ===
                                    item.id
                                );

                            }
                        );


                    const movedFile =
                        pdfFiles.splice(
                            draggedIndex,
                            1
                        )[0];


                    pdfFiles.splice(
                        targetIndex,
                        0,
                        movedFile
                    );


                    renderPDFs();

                }
            );


            /* =========================
               PREVIEW
            ========================= */

            const preview =
                document.createElement(
                    "div"
                );


            preview.className =
                "pdf-preview";


            const canvas =
                document.createElement(
                    "canvas"
                );


            preview.appendChild(
                canvas
            );


            /* =========================
               NAME
            ========================= */

            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "pdf-name";


            name.textContent =
                item.file.name;


            /* =========================
               REMOVE BUTTON
            ========================= */

            const removeButton =
                document.createElement(
                    "button"
                );


            removeButton.className =
                "remove-button";


            removeButton.textContent =
                "×";


            removeButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    pdfFiles =
                        pdfFiles.filter(
                            function(pdf) {

                                return (
                                    pdf.id !==
                                    item.id
                                );

                            }
                        );


                    updateInterface();

                    renderPDFs();

                }
            );


            /* =========================
               BUILD CARD
            ========================= */

            card.appendChild(
                preview
            );


            card.appendChild(
                name
            );


            card.appendChild(
                removeButton
            );


            pdfGrid.appendChild(
                card
            );


            renderPDFPreview(
                item.file,
                canvas
            );

        }
    );

}


/* =========================
   PDF PREVIEW
========================= */

async function renderPDFPreview(
    file,
    canvas
) {

    try {

        const arrayBuffer =
            await file.arrayBuffer();


        const pdf =
            await pdfjsLib.getDocument({
                data:
                    arrayBuffer
            }).promise;


        const page =
            await pdf.getPage(1);


        const viewport =
            page.getViewport({
                scale: 0.45
            });


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;

    }

    catch (error) {

        console.error(
            "Preview error:",
            error
        );

    }

}


/* =========================
   ACTUALLY MERGE PDFs
========================= */

mergeButton.addEventListener(
    "click",
    async function() {


        /* Check number of files */

        if (
            pdfFiles.length < 2
        ) {

            alert(
                "Please select at least two PDF files."
            );

            return;

        }


        try {


            /* Change button text */

            mergeButton.disabled =
                true;


            mergeButton.textContent =
                "Merging PDFs...";


            /* Create new PDF */

            const mergedPdf =
                await PDFLib.PDFDocument.create();


            /* Process every PDF */

            for (
                const item
                of
                pdfFiles
            ) {


                const arrayBuffer =
                    await item.file.arrayBuffer();


                const sourcePdf =
                    await PDFLib.PDFDocument.load(
                        arrayBuffer
                    );


                const copiedPages =
                    await mergedPdf.copyPages(

                        sourcePdf,

                        sourcePdf.getPageIndices()

                    );


                copiedPages.forEach(
                    function(page) {

                        mergedPdf.addPage(
                            page
                        );

                    }
                );

            }


            /* Create merged file */

            const mergedPdfBytes =
                await mergedPdf.save();


            const blob =
                new Blob(

                    [mergedPdfBytes],

                    {
                        type:
                            "application/pdf"
                    }

                );


            /* Create download */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "merged-toolnest.pdf";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );


            /* Restore button */

            mergeButton.disabled =
                false;


            mergeButton.textContent =
                "Merge PDFs";


        }

        catch (error) {


            console.error(
                error
            );


            alert(
                "Something went wrong while merging the PDFs. Please try different PDF files."
            );


            mergeButton.disabled =
                false;


            mergeButton.textContent =
                "Merge PDFs";

        }

    }
);


</script>
