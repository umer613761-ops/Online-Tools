<!-- GIF Encoder -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<script>

const fileInput =
document.getElementById("fileInput");

const uploadArea =
document.getElementById("uploadArea");

const preview =
document.getElementById("preview");

const previewContainer =
document.getElementById("previewContainer");

const fileInfo =
document.getElementById("fileInfo");

const fileName =
document.getElementById("fileName");

const fileDetails =
document.getElementById("fileDetails");

const formatSection =
document.getElementById("formatSection");

const qualitySection =
document.getElementById("qualitySection");

const convertSection =
document.getElementById("convertSection");

const quality =
document.getElementById("quality");

const qualityValue =
document.getElementById("qualityValue");

const convertButton =
document.getElementById("convertButton");

const result =
document.getElementById("result");

const resultText =
document.getElementById("resultText");

const downloadButton =
document.getElementById("downloadButton");


let imageObject = null;

let selectedFile = null;

let downloadUrl = null;


/* Upload Click */

uploadArea.addEventListener(
"click",
function() {

fileInput.click();

}
);


/* File Selection */

fileInput.addEventListener(
"change",
function() {

if (
fileInput.files.length > 0
) {

loadFile(
fileInput.files[0]
);

}

}
);


/* Drag */

uploadArea.addEventListener(
"dragover",
function(event) {

event.preventDefault();

uploadArea.classList.add(
"dragging"
);

}
);


uploadArea.addEventListener(
"dragleave",
function() {

uploadArea.classList.remove(
"dragging"
);

}
);


uploadArea.addEventListener(
"drop",
function(event) {

event.preventDefault();

uploadArea.classList.remove(
"dragging"
);

if (
event.dataTransfer.files.length > 0
) {

loadFile(
event.dataTransfer.files[0]
);

}

}
);


/* Load Image */

function loadFile(file) {

if (
!file.type.startsWith(
"image/"
)
) {

alert(
"Please choose a valid image."
);

return;

}

selectedFile =
file;


const reader =
new FileReader();


reader.onload =
function(event) {

imageObject =
new Image();


imageObject.onload =
function() {

preview.src =
event.target.result;


previewContainer.style.display =
"block";


fileInfo.style.display =
"block";


formatSection.style.display =
"block";


qualitySection.style.display =
"block";


convertSection.style.display =
"block";


fileName.textContent =
file.name;


fileDetails.textContent =
imageObject.naturalWidth
+
" × "
+
imageObject.naturalHeight
+
" pixels · "
+
formatFileSize(
file.size
);

};


imageObject.onerror =
function() {

alert(
"This image format cannot be read by your browser."
);

};


imageObject.src =
event.target.result;

};


reader.readAsDataURL(
file
);

}


/* Quality */

quality.addEventListener(
"input",
function() {

qualityValue.textContent =
quality.value
+
"%";

}
);


/* Create Canvas */

function createCanvas() {

const canvas =
document.createElement(
"canvas"
);


canvas.width =
imageObject.naturalWidth;


canvas.height =
imageObject.naturalHeight;


const context =
canvas.getContext(
"2d"
);


/*
White background prevents
black transparency in JPG.
*/

context.fillStyle =
"#ffffff";


context.fillRect(
0,
0,
canvas.width,
canvas.height
);


context.drawImage(
imageObject,
0,
0
);


return canvas;

}


/* Convert */

convertButton.addEventListener(
"click",
async function() {

if (
!imageObject
) {

return;

}


const format =
document.querySelector(
'input[name="format"]:checked'
).value;


convertButton.disabled =
true;


convertButton.textContent =
format === "gif"
? "Creating GIF..."
: "Converting...";


try {

let blob;


if (
format === "gif"
) {

blob =
await convertToGif();

}


else if (
format === "bmp"
) {

blob =
convertToBmp();

}


else if (
format === "ico"
) {

blob =
await convertToIco();

}


else {

blob =
await convertStandard(
format
);

}


if (
!blob
) {

throw new Error(
"Conversion failed."
);

}


showDownload(
blob,
format
);

}

catch(error) {

console.error(
error
);

alert(
"Conversion failed. Please try another image."
);

}


convertButton.disabled =
false;


convertButton.textContent =
"Convert Image";

}
);


/* JPG PNG WEBP */

function convertStandard(
format
) {

return new Promise(
function(resolve) {

const canvas =
createCanvas();


let mime;


if (
format === "jpg"
) {

mime =
"image/jpeg";

}


else if (
format === "png"
) {

mime =
"image/png";

}


else {

mime =
"image/webp";

}


canvas.toBlob(
function(blob) {

resolve(
blob
);

},
mime,
Number(
quality.value
)
/
100
);

}
);

}


/* GIF */

function convertToGif() {

return new Promise(
function(resolve, reject) {

if (
typeof GIF ===
"undefined"
) {

reject(
new Error(
"GIF encoder failed to load."
)
);

return;

}


const canvas =
createCanvas();


const gif =
new GIF({

workers: 2,

quality: 10,

workerScript:
"https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js"

});


gif.addFrame(
canvas,
{

copy: true,

delay: 100

}
);


gif.on(
"finished",
function(blob) {

resolve(
blob
);

}
);


gif.on(
"abort",
function() {

reject(
new Error(
"GIF conversion stopped."
)
);

}
);


gif.render();

}
);

}


/* BMP */

function convertToBmp() {

const canvas =
createCanvas();


const context =
canvas.getContext(
"2d"
);


const imageData =
context.getImageData(
0,
0,
canvas.width,
canvas.height
);


const width =
canvas.width;


const height =
canvas.height;


const rowSize =
Math.floor(
(
width * 3
+
3
)
/
4
)
*
4;


const imageSize =
rowSize
*
height;


const fileSize =
54
+
imageSize;


const buffer =
new ArrayBuffer(
fileSize
);


const view =
new DataView(
buffer
);


let offset =
0;


/* BMP Header */

view.setUint8(
offset++,
0x42
);

view.setUint8(
offset++,
0x4D
);

view.setUint32(
offset,
fileSize,
true
);

offset += 4;


view.setUint32(
offset,
0,
true
);

offset += 4;


view.setUint32(
offset,
54,
true
);

offset += 4;


/* DIB Header */

view.setUint32(
offset,
40,
true
);

offset += 4;


view.setInt32(
offset,
width,
true
);

offset += 4;


view.setInt32(
offset,
height,
true
);

offset += 4;


view.setUint16(
offset,
1,
true
);

offset += 2;


view.setUint16(
offset,
24,
true
);

offset += 2;


view.setUint32(
offset,
0,
true
);

offset += 4;


view.setUint32(
offset,
imageSize,
true
);

offset += 4;


view.setInt32(
offset,
2835,
true
);

offset += 4;


view.setInt32(
offset,
2835,
true
);

offset += 4;


view.setUint32(
offset,
0,
true
);

offset += 4;


view.setUint32(
offset,
0,
true
);

offset += 4;


const pixels =
imageData.data;


for (
let y = height - 1;
y >= 0;
y--
) {

let rowStart =
offset;


for (
let x = 0;
x < width;
x++
) {

const pixel =
(
y
*
width
+
x
)
*
4;


/* BGR */

view.setUint8(
offset++,
pixels[
pixel + 2
]
);


view.setUint8(
offset++,
pixels[
pixel + 1
]
);


view.setUint8(
offset++,
pixels[
pixel
]
);

}


/* Row Padding */

while (
offset
<
rowStart
+
rowSize
) {

view.setUint8(
offset++,
0
);

}

}


return new Blob(
[
buffer
],
{

type:
"image/bmp"

}
);

}


/* ICO */

function convertToIco() {

return new Promise(
function(resolve, reject) {


const size =
Math.min(
256,
Math.max(
16,
Math.max(
imageObject.naturalWidth,
imageObject.naturalHeight
)
)
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
size;


canvas.height =
size;


const context =
canvas.getContext(
"2d"
);


/* Transparent Icon */

context.clearRect(
0,
0,
size,
size
);


const scale =
Math.min(
size
/
imageObject.naturalWidth,

size
/
imageObject.naturalHeight
);


const width =
imageObject.naturalWidth
*
scale;


const height =
imageObject.naturalHeight
*
scale;


const x =
(
size
-
width
)
/
2;


const y =
(
size
-
height
)
/
2;


context.drawImage(
imageObject,
x,
y,
width,
height
);


/*
Create PNG image
for the ICO container.
*/

canvas.toBlob(
async function(pngBlob) {

try {

const pngBuffer =
await pngBlob.arrayBuffer();


const headerSize =
6;


const directorySize =
16;


const imageOffset =
headerSize
+
directorySize;


const buffer =
new ArrayBuffer(
imageOffset
+
pngBuffer.byteLength
);


const view =
new DataView(
buffer
);


/* ICO Header */

view.setUint16(
0,
0,
true
);


view.setUint16(
2,
1,
true
);


view.setUint16(
4,
1,
true
);


/* Directory Entry */

view.setUint8(
6,
size === 256
? 0
: size
);


view.setUint8(
7,
size === 256
? 0
: size
);


view.setUint8(
8,
0
);


view.setUint8(
9,
0
);


view.setUint16(
10,
1,
true
);


view.setUint16(
12,
32,
true
);


view.setUint32(
14,
pngBuffer.byteLength,
true
);


view.setUint32(
18,
imageOffset,
true
);


/* Copy PNG */

const output =
new Uint8Array(
buffer
);


output.set(
new Uint8Array(
pngBuffer
),
imageOffset
);


resolve(
new Blob(
[
buffer
],
{

type:
"image/x-icon"

}
)
);

}

catch(error) {

reject(
error
);

}

},
"image/png"
);

}
);

}


/* Show Download */

function showDownload(
blob,
format
) {

if (
downloadUrl
) {

URL.revokeObjectURL(
downloadUrl
);

}


downloadUrl =
URL.createObjectURL(
blob
);


const name =
selectedFile.name.replace(
/\.[^/.]+$/,
""
);


downloadButton.href =
downloadUrl;


downloadButton.download =
name
+
"."
+
format;


resultText.textContent =
"Your "
+
format.toUpperCase()
+
" image is ready.";


result.style.display =
"block";


result.scrollIntoView({

behavior:
"smooth",

block:
"nearest"

});

}


/* File Size */

function formatFileSize(
bytes
) {

if (
bytes < 1024
) {

return (
bytes
+
" B"
);

}


if (
bytes
<
1024
*
1024
) {

return (
(
bytes
/
1024
).toFixed(1)
+
" KB"
);

}


return (
(
bytes
/
(
1024
*
1024
)
).toFixed(1)
+
" MB"
);

}

</script>
