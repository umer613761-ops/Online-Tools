<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Image Resizer - Free Online Tool | ToolNest
  </title>

  <meta
    name="description"
    content="Resize images online for free with a percentage slider and real-time preview."
  >

  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #d9dee4;
      color: #1f2937;

      min-height: 100vh;
    }


    /* =========================
       HEADER
    ========================= */

    nav {
      width: 100%;

      background: #1f2937;
      border-bottom: 1px solid #374151;

      padding: 16px 32px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;
    }


    .logo-icon {
      width: 43px;
      height: 43px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #5b9a78,
          #3f7659
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 22px;
      font-weight: bold;

      box-shadow:
        0 5px 14px
        rgba(63, 118, 89, 0.25);
    }


    .logo-text {
      font-size: 29px;
      font-weight: 800;

      letter-spacing: -0.8px;
      line-height: 1;
    }


    .logo-tool {
      color: #ffffff;
    }


    .logo-nest {
      color: #a9cdb7;
    }


    /* =========================
       BACK LINK
    ========================= */

    .back-link {
      color: #d1d5db;

      text-decoration: none;

      font-size: 15px;

      transition:
        color 0.2s ease;
    }


    .back-link:hover {
      color: #a9cdb7;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 950px;

      margin: 0 auto;

      padding:
        55px
        24px
        70px;
    }


    /* =========================
       HEADING
    ========================= */

    .heading {
      text-align: center;

      margin-bottom: 35px;
    }


    .heading h1 {
      margin:
        0
        0
        14px;

      font-size: 42px;
      font-weight: 750;

      letter-spacing: -1px;

      color: #202938;
    }


    .heading p {
      margin: 0 auto;

      max-width: 650px;

      font-size: 17px;

      line-height: 1.6;

      color: #667085;
    }


    /* =========================
       TOOL BOX
    ========================= */

    .tool-box {

      background: #dce6df;

      border:
        1px solid
        #c2d0c7;

      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 6px 18px
        rgba(31, 41, 55, 0.08);
    }


    /* =========================
       UPLOAD AREA
    ========================= */

    .upload-area {

      display: block;

      width: 100%;

      padding:
        55px
        20px;

      text-align: center;

      cursor: pointer;

      background: #edf2ee;

      border:
        1px solid
        #d0dbd3;

      border-radius: 14px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;

    }


    .upload-area:hover {

      background: #e4ece6;

      border-color: #9bb8a5;

      transform:
        translateY(-2px);

    }


    .upload-icon {

      width: 64px;
      height: 64px;

      margin:
        0
        auto
        18px;

      border-radius: 16px;

      background: #dce6df;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      border:
        1px solid
        #c2d0c7;

    }


    .upload-area h2 {

      margin:
        0
        0
        10px;

      font-size: 23px;

      color: #2d3a32;

    }


    .upload-area p {

      margin: 0;

      color: #59665e;

      font-size: 15px;

    }


    input[type="file"] {
      display: none;
    }


    /* =========================
       EDITOR
    ========================= */

    .editor {

      display: none;

      margin-top: 30px;

      padding-top: 30px;

      border-top:
        1px solid
        #c2d0c7;

    }


    /* =========================
       PREVIEW
    ========================= */

    .preview-container {

      display: flex;

      justify-content: center;
      align-items: center;

      background: #edf2ee;

      border:
        1px solid
        #d0dbd3;

      border-radius: 14px;

      padding: 25px;

      margin-bottom: 30px;

      min-height: 220px;

    }


    #preview {

      max-width: 100%;

      max-height: 400px;

      display: block;

      border-radius: 10px;

      box-shadow:
        0 4px 12px
        rgba(31, 41, 55, 0.12);

    }


    /* =========================
       CONTROLS
    ========================= */

    .controls {
      margin-top: 10px;
    }


    .control-group {

      margin-bottom: 28px;

      padding:
        20px;

      background: #edf2ee;

      border:
        1px solid
        #d0dbd3;

      border-radius: 12px;

    }


    .control-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 16px;

    }


    .control-header label {

      font-size: 16px;

      font-weight: bold;

      color: #2d3a32;

    }


    .value-display {

      background: #dce6df;

      border:
        1px solid
        #c2d0c7;

      padding:
        7px
        13px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: bold;

      color: #2d3a32;

      white-space: nowrap;

    }


    /* =========================
       SLIDERS
    ========================= */

    input[type="range"] {

      width: 100%;

      cursor: pointer;

      accent-color: #5b9a78;

    }


    /* =========================
       IMAGE INFO
    ========================= */

    .image-info {

      margin-top: 5px;

      padding: 18px;

      background: #edf2ee;

      border:
        1px solid
        #d0dbd3;

      border-radius: 10px;

      text-align: center;

      font-size: 14px;

      color: #59665e;

      line-height: 1.7;

    }


    .image-info strong {
      color: #2d3a32;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      display: flex;

      gap: 12px;

      margin-top: 28px;

      justify-content: center;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 8px;

      padding:
        13px
        22px;

      font-size: 15px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;

    }


    button:hover {

      opacity: 0.9;

      transform:
        translateY(-1px);

    }


    .primary-button {

      background: #1f2937;

      color: white;

    }


    .primary-button:hover {

      background: #273244;

    }


    .secondary-button {

      background: #c9d0d7;

      border:
        1px solid
        #b2bbc5;

      color: #253044;

    }


    .secondary-button:hover {

      background: #bec7d0;

    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      background: #1f2937;

      border-top:
        1px solid
        #374151;

      text-align: center;

      padding:
        32px
        20px;

      color: #aeb7c5;

      font-size: 14px;

    }


    /* =========================
       TABLET
    ========================= */

    @media (
      max-width: 700px
    ) {

      nav {

        padding:
          15px
          20px;

      }


      .container {

        padding:
          45px
          16px
          60px;

      }


      .heading h1 {
        font-size: 34px;
      }


      .tool-box {
        padding: 22px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (
      max-width: 600px
    ) {

      nav {

        padding:
          14px
          16px;

        gap: 12px;

      }


      .logo {
        gap: 8px;
      }


      .logo-icon {

        width: 37px;
        height: 37px;

        border-radius: 10px;

        font-size: 19px;

      }


      .logo-text {
        font-size: 24px;
      }


      .back-link {
        font-size: 13px;
      }


      .heading h1 {

        font-size: 32px;

        letter-spacing:
          -0.5px;

      }


      .heading p {
        font-size: 15px;
      }


      .tool-box {
        padding: 18px;
      }


      .upload-area {

        padding:
          45px
          15px;

      }


      .upload-icon {

        width: 58px;
        height: 58px;

        font-size: 27px;

      }


      .control-group {
        padding: 16px;
      }


      .buttons {

        flex-direction: column;

      }


      button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <nav>


    <!-- LOGO -->

    <a
      href="index.html"
      class="logo"
    >

      <div class="logo-icon">
        T
      </div>


      <div class="logo-text">

        <span class="logo-tool">
          Tool
        </span>

        <span class="logo-nest">
          Nest
        </span>

      </div>

    </a>


    <!-- BACK -->

    <a
      href="index.html"
      class="back-link"
    >

      ← All Tools

    </a>


  </nav>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">


    <!-- HEADING -->

    <div class="heading">

      <h1>
        Image Resizer
      </h1>


      <p>
        Resize and optimize your image with
        a real-time preview.
      </p>

    </div>



    <!-- TOOL BOX -->

    <div class="tool-box">


      <!-- =========================
           UPLOAD AREA
      ========================= -->

      <label
        for="imageInput"
        class="upload-area"
      >


        <div class="upload-icon">
          🖼️
        </div>


        <h2>
          Upload an Image
        </h2>


        <p>
          Click here to choose an image
          from your device.
        </p>


      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >



      <!-- =========================
           EDITOR
      ========================= -->

      <div
        class="editor"
        id="editor"
      >


        <!-- PREVIEW -->

        <div class="preview-container">

          <img
            id="preview"
            alt="Image preview"
          >

        </div>



        <!-- CONTROLS -->

        <div class="controls">


          <!-- RESIZE -->

          <div class="control-group">


            <div class="control-header">

              <label for="resizeSlider">
                Resize Image
              </label>


              <span
                class="value-display"
                id="resizeValue"
              >
                100%
              </span>


            </div>


            <input
              type="range"
              id="resizeSlider"
              min="10"
              max="200"
              value="100"
            >


          </div>



          <!-- QUALITY -->

          <div class="control-group">


            <div class="control-header">

              <label for="qualitySlider">
                Image Quality
              </label>


              <span
                class="value-display"
                id="qualityValue"
              >
                90%
              </span>


            </div>


            <input
              type="range"
              id="qualitySlider"
              min="10"
              max="100"
              value="90"
            >


          </div>


        </div>



        <!-- IMAGE INFORMATION -->

        <div
          class="image-info"
          id="imageInfo"
        >
        </div>



        <!-- BUTTONS -->

        <div class="buttons">


          <button
            class="primary-button"
            id="downloadButton"
          >

            Download Image

          </button>



          <button
            class="secondary-button"
            id="newImageButton"
          >

            Choose Another Image

          </button>


        </div>


      </div>


    </div>


  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const preview =
      document.getElementById(
        "preview"
      );


    const editor =
      document.getElementById(
        "editor"
      );


    const resizeSlider =
      document.getElementById(
        "resizeSlider"
      );


    const qualitySlider =
      document.getElementById(
        "qualitySlider"
      );


    const resizeValue =
      document.getElementById(
        "resizeValue"
      );


    const qualityValue =
      document.getElementById(
        "qualityValue"
      );


    const imageInfo =
      document.getElementById(
        "imageInfo"
      );


    const downloadButton =
      document.getElementById(
        "downloadButton"
      );


    const newImageButton =
      document.getElementById(
        "newImageButton"
      );


    let originalImage =
      new Image();


    let originalWidth =
      0;


    let originalHeight =
      0;


    let processedImage =
      "";


    /* =========================
       UPLOAD IMAGE
    ========================= */

    imageInput.addEventListener(
      "change",
      function(event) {


        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          function(e) {


            originalImage.onload =
              function() {


                originalWidth =
                  originalImage.width;


                originalHeight =
                  originalImage.height;


                resizeSlider.value =
                  100;


                qualitySlider.value =
                  90;


                resizeValue.textContent =
                  "100%";


                qualityValue.textContent =
                  "90%";


                editor.style.display =
                  "block";


                updateImage();


              };


            originalImage.src =
              e.target.result;


          };


        reader.readAsDataURL(
          file
        );


      }
    );



    /* =========================
       RESIZE SLIDER
    ========================= */

    resizeSlider.addEventListener(
      "input",
      function() {


        resizeValue.textContent =
          resizeSlider.value
          +
          "%";


        updateImage();


      }
    );



    /* =========================
       QUALITY SLIDER
    ========================= */

    qualitySlider.addEventListener(
      "input",
      function() {


        qualityValue.textContent =
          qualitySlider.value
          +
          "%";


        updateImage();


      }
    );



    /* =========================
       UPDATE IMAGE
    ========================= */

    function updateImage() {


      if (
        !originalImage.src
      ) {

        return;

      }


      const percentage =
        resizeSlider.value
        /
        100;


      const newWidth =
        Math.max(
          1,
          Math.round(
            originalWidth
            *
            percentage
          )
        );


      const newHeight =
        Math.max(
          1,
          Math.round(
            originalHeight
            *
            percentage
          )
        );


      const quality =
        qualitySlider.value
        /
        100;


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        newWidth;


      canvas.height =
        newHeight;


      const context =
        canvas.getContext(
          "2d"
        );


      context.drawImage(
        originalImage,
        0,
        0,
        newWidth,
        newHeight
      );


      processedImage =
        canvas.toDataURL(
          "image/jpeg",
          quality
        );


      preview.src =
        processedImage;


      imageInfo.innerHTML =

        "<strong>Current dimensions:</strong> "

        +

        newWidth

        +

        " × "

        +

        newHeight

        +

        " pixels";


    }



    /* =========================
       DOWNLOAD IMAGE
    ========================= */

    downloadButton.addEventListener(
      "click",
      function() {


        if (
          !processedImage
        ) {

          return;

        }


        const link =
          document.createElement(
            "a"
          );


        link.download =
          "resized-image.jpg";


        link.href =
          processedImage;


        link.click();


      }
    );



    /* =========================
       CHOOSE ANOTHER IMAGE
    ========================= */

    newImageButton.addEventListener(
      "click",
      function() {


        imageInput.value =
          "";


        preview.src =
          "";


        processedImage =
          "";


        originalWidth =
          0;


        originalHeight =
          0;


        imageInfo.innerHTML =
          "";


        editor.style.display =
          "none";


      }
    );


  </script>


</body>

</html>
