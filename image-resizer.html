<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Image Resizer - Free Online Tool | ToolNest
  </title>

  <meta
    name="description"
    content="Resize and optimize images online for free. Adjust image size and quality with real-time preview."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }

    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;

      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
    }

    .logo span {
      color: #666;
    }

    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .back-link:hover {
      color: #000;
    }


    /* Main */

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px 80px;
    }


    /* Heading */

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .heading h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .heading p {
      margin: 0;
      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }


    /* Tool Box */

    .tool-box {
      background: #ffffff;

      border: 1px solid #e5e5e5;
      border-radius: 14px;

      padding: 30px;
    }


    /* Upload Area */

    .upload-area {

      border: 2px dashed #ccc;
      border-radius: 12px;

      padding: 50px 20px;

      text-align: center;
      cursor: pointer;

      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #888;
      background: #fafafa;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .upload-area h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .upload-area p {
      margin: 0;
      color: #777;
      font-size: 15px;
    }

    input[type="file"] {
      display: none;
    }


    /* Editor */

    .editor {
      display: none;
      margin-top: 30px;
    }


    /* Preview */

    .preview-container {
      text-align: center;
      margin-bottom: 30px;
    }

    #preview {
      display: block;

      max-width: 100%;
      max-height: 450px;

      margin: auto;

      border-radius: 10px;
      border: 1px solid #e5e5e5;
    }


    /* Controls */

    .controls {

      max-width: 650px;
      margin: auto;

    }

    .control-group {

      margin-bottom: 28px;

    }

    .control-header {

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;

    }

    .control-header label {

      font-size: 16px;
      font-weight: bold;

    }

    .value-display {

      background: #f6f7fb;

      padding: 6px 12px;

      border-radius: 6px;

      font-size: 14px;
      font-weight: bold;

    }


    /* Slider */

    input[type="range"] {

      width: 100%;

      cursor: pointer;

    }


    /* Image Information */

    .image-info {

      margin-top: 20px;

      padding: 15px;

      background: #f6f7fb;

      border-radius: 8px;

      text-align: center;

      font-size: 14px;
      color: #666;

      line-height: 1.7;

    }


    /* Buttons */

    .buttons {

      display: flex;

      gap: 12px;

      margin-top: 25px;

      justify-content: center;

    }

    button {

      border: none;

      border-radius: 8px;

      padding: 13px 22px;

      font-size: 15px;

      cursor: pointer;

      transition: opacity 0.2s;

    }

    button:hover {
      opacity: 0.85;
    }

    .primary-button {

      background: #222;
      color: white;

    }

    .secondary-button {

      background: #e9e9e9;
      color: #222;

    }


    /* Footer */

    footer {

      text-align: center;

      padding: 35px 20px;

      background: #ffffff;

      border-top: 1px solid #e5e5e5;

      color: #777;

      font-size: 14px;

    }


    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding: 15px 20px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        padding: 40px 15px 60px;
      }

      .heading h1 {
        font-size: 30px;
      }

      .tool-box {
        padding: 20px;
      }

      .buttons {

        flex-direction: column;

      }

      button {

        width: 100%;

      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- Main -->

  <main class="container">


    <!-- Heading -->

    <div class="heading">

      <h1>
        Image Resizer
      </h1>

      <p>
        Resize and optimize your image with a real-time preview.
      </p>

    </div>



    <!-- Tool Box -->

    <div class="tool-box">


      <!-- Upload Area -->

      <label
        for="imageInput"
        class="upload-area"
      >

        <div class="upload-icon">
          🖼️
        </div>


        <h2>
          Upload an Image
        </h2>


        <p>
          Click here to choose an image from your device.
        </p>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >



      <!-- Editor -->

      <div
        class="editor"
        id="editor"
      >


        <!-- Preview -->

        <div class="preview-container">

          <img
            id="preview"
            alt="Image preview"
          >

        </div>



        <!-- Controls -->

        <div class="controls">


          <!-- Resize Percentage -->

          <div class="control-group">


            <div class="control-header">

              <label
                for="resizeSlider"
              >
                Resize Image
              </label>


              <span
                class="value-display"
                id="resizeValue"
              >
                100%
              </span>

            </div>


            <input
              type="range"
              id="resizeSlider"
              min="10"
              max="200"
              value="100"
            >

          </div>



          <!-- Image Quality -->

          <div class="control-group">


            <div class="control-header">

              <label
                for="qualitySlider"
              >
                Image Quality
              </label>


              <span
                class="value-display"
                id="qualityValue"
              >
                90%
              </span>

            </div>


            <input
              type="range"
              id="qualitySlider"
              min="10"
              max="100"
              value="90"
            >

          </div>


        </div>



        <!-- Image Information -->

        <div
          class="image-info"
          id="imageInfo"
        >
        </div>



        <!-- Buttons -->

        <div class="buttons">


          <button
            class="primary-button"
            id="downloadButton"
          >
            Download Image
          </button>


          <button
            class="secondary-button"
            id="newImageButton"
          >
            Choose Another Image
          </button>


        </div>


      </div>


    </div>


  </main>



  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>



  <script>


    const imageInput =
      document.getElementById("imageInput");


    const preview =
      document.getElementById("preview");


    const editor =
      document.getElementById("editor");


    const resizeSlider =
      document.getElementById("resizeSlider");


    const qualitySlider =
      document.getElementById("qualitySlider");


    const resizeValue =
      document.getElementById("resizeValue");


    const qualityValue =
      document.getElementById("qualityValue");


    const imageInfo =
      document.getElementById("imageInfo");


    const downloadButton =
      document.getElementById("downloadButton");


    const newImageButton =
      document.getElementById("newImageButton");



    let originalImage =
      new Image();


    let originalWidth = 0;


    let originalHeight = 0;


    let processedImage = "";



    /* Upload Image */

    imageInput.addEventListener(
      "change",
      function(event) {


        const file =
          event.target.files[0];


        if (!file) {

          return;

        }



        const reader =
          new FileReader();



        reader.onload =
          function(e) {


            originalImage.onload =
              function() {


                originalWidth =
                  originalImage.width;


                originalHeight =
                  originalImage.height;



                resizeSlider.value =
                  100;


                qualitySlider.value =
                  90;



                resizeValue.textContent =
                  "100%";


                qualityValue.textContent =
                  "90%";



                editor.style.display =
                  "block";



                updateImage();


              };



            originalImage.src =
              e.target.result;


          };



        reader.readAsDataURL(
          file
        );


      }
    );



    /* Resize Slider */

    resizeSlider.addEventListener(
      "input",
      function() {


        resizeValue.textContent =
          resizeSlider.value + "%";


        updateImage();


      }
    );



    /* Quality Slider */

    qualitySlider.addEventListener(
      "input",
      function() {


        qualityValue.textContent =
          qualitySlider.value + "%";


        updateImage();


      }
    );



    /* Update Image In Real Time */

    function updateImage() {


      const percentage =
        resizeSlider.value / 100;



      const newWidth =
        Math.round(
          originalWidth *
          percentage
        );



      const newHeight =
        Math.round(
          originalHeight *
          percentage
        );



      const quality =
        qualitySlider.value / 100;



      const canvas =
        document.createElement(
          "canvas"
        );



      canvas.width =
        newWidth;



      canvas.height =
        newHeight;



      const context =
        canvas.getContext(
          "2d"
        );



      context.drawImage(
        originalImage,
        0,
        0,
        newWidth,
        newHeight
      );



      processedImage =
        canvas.toDataURL(
          "image/jpeg",
          quality
        );



      preview.src =
        processedImage;



      imageInfo.innerHTML =
        "<strong>Current dimensions:</strong> "
        +
        newWidth
        +
        " × "
        +
        newHeight
        +
        " pixels";


    }



    /* Download Image */

    downloadButton.addEventListener(
      "click",
      function() {


        if (!processedImage) {

          return;

        }



        const link =
          document.createElement(
            "a"
          );



        link.download =
          "resized-image.jpg";


        link.href =
          processedImage;


        link.click();


      }
    );



    /* Choose Another Image */

    newImageButton.addEventListener(
      "click",
      function() {


        imageInput.value =
          "";


        preview.src =
          "";


        processedImage =
          "";


        editor.style.display =
          "none";


      }
    );


  </script>


</body>

</html>
