<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Images to PDF - Free Online Tool | ToolNest</title>

  <meta
    name="description"
    content="Convert JPG, PNG and WEBP images to PDF online for free with ToolNest."
  >

  <!-- jsPDF -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }


    /* Navigation */

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;

      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
    }


    .logo span {
      color: #666;
    }


    .back-link {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }


    .back-link:hover {
      color: #000;
    }


    /* Main */

    .container {
      max-width: 950px;
      margin: 0 auto;

      padding: 55px 20px 80px;
    }


    /* Heading */

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }


    .heading h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }


    .heading p {
      margin: 0;
      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }


    /* Tool Box */

    .tool-box {
      background: #ffffff;

      border: 1px solid #e5e5e5;
      border-radius: 14px;

      padding: 28px;
    }


    /* Upload Area */

    .upload-area {
      display: block;

      border: 1.5px dashed #aaa;
      border-radius: 12px;

      padding: 38px 20px;

      text-align: center;
      cursor: pointer;

      transition: 0.2s;
    }


    .upload-area:hover {
      border-color: #555;
      background: #fafafa;
    }


    .upload-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }


    .upload-area h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }


    .upload-area p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }


    input[type="file"] {
      display: none;
    }


    /* Selected Images */

    .selected-section {
      display: none;
      margin-top: 32px;
    }


    .selected-section h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }


    .selected-section p {
      margin: 0 0 20px;
      color: #777;
      font-size: 14px;
    }


    /* Center Images */

    .image-grid {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;

      gap: 18px;

      min-height: 100px;
    }


    /* Image Card */

    .image-card {
      position: relative;

      width: 170px;

      background: #f6f7fb;

      border: 1px solid #ddd;
      border-radius: 10px;

      padding: 8px;
    }


    .image-card img {
      display: block;

      width: 100%;
      height: 130px;

      object-fit: contain;

      background: #ffffff;

      border-radius: 7px;
    }


    .image-name {
      margin-top: 8px;

      color: #666;
      font-size: 12px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Remove Button */

    .remove-button {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background: #333;
      color: #fff;

      font-size: 18px;
      line-height: 28px;

      cursor: pointer;
    }


    .remove-button:hover {
      background: #000;
    }


    /* Divider */

    .divider {
      display: none;

      height: 1px;

      background: #e5e5e5;

      margin: 30px 0;
    }


    /* Settings */

    .settings-section {
      display: none;
    }


    .settings-section h2 {
      margin: 0 0 22px;
      font-size: 21px;
    }


    .settings-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 16px;

      max-width: 600px;
      margin: 0 auto 28px;
    }


    .setting-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: bold;
    }


    select {
      width: 100%;

      padding: 13px;

      border: 1px solid #ccc;
      border-radius: 8px;

      background: #ffffff;

      font-size: 15px;
      color: #222;
    }


    select:focus {
      outline: none;
      border-color: #777;
    }


    /* Buttons */

    .buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    button {
      border: none;

      border-radius: 8px;

      padding: 13px 24px;

      font-size: 15px;

      cursor: pointer;

      transition: opacity 0.2s;
    }


    button:hover {
      opacity: 0.85;
    }


    .primary-button {
      background: #222;
      color: #ffffff;
    }


    .secondary-button {
      background: #e9e9e9;
      color: #222;
    }


    /* Status */

    .status {
      text-align: center;

      margin-top: 18px;

      color: #777;
      font-size: 14px;
    }


    /* Footer */

    footer {
      text-align: center;

      padding: 35px 20px;

      background: #ffffff;
      border-top: 1px solid #e5e5e5;

      color: #777;
      font-size: 14px;
    }


    /* Mobile */

    @media (max-width: 600px) {

      nav {
        padding: 15px 20px;
      }


      .logo {
        font-size: 21px;
      }


      .container {
        padding: 40px 15px 60px;
      }


      .heading h1 {
        font-size: 30px;
      }


      .tool-box {
        padding: 20px;
      }


      .settings-grid {
        grid-template-columns: 1fr;
      }


      .image-card {
        width: 150px;
      }


      .buttons {
        flex-direction: column;
      }


      .buttons button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- Navigation -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >
      Tool<span>Nest</span>
    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- Main -->

  <main class="container">


    <!-- Heading -->

    <div class="heading">

      <h1>
        Images to PDF
      </h1>


      <p>
        Convert your images into a PDF quickly and easily.
      </p>

    </div>



    <!-- Tool -->

    <div class="tool-box">


      <!-- Upload -->

      <label
        for="imageInput"
        class="upload-area"
      >

        <div class="upload-icon">
          🖼️
        </div>


        <h2>
          Upload Images
        </h2>


        <p>
          Select JPG, PNG or WEBP images from your device.
        </p>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >



      <!-- Selected Images -->

      <div
        class="selected-section"
        id="selectedSection"
      >

        <h2>
          Selected Images
        </h2>


        <p>
          Your selected images will appear below.
        </p>


        <div
          class="image-grid"
          id="imageGrid"
        ></div>

      </div>



      <!-- Divider -->

      <div
        class="divider"
        id="divider"
      ></div>



      <!-- PDF Settings -->

      <div
        class="settings-section"
        id="settingsSection"
      >

        <h2>
          PDF Settings
        </h2>


        <div class="settings-grid">


          <!-- Page Size -->

          <div class="setting-group">

            <label for="pageSize">
              Page Size
            </label>


            <select id="pageSize">

              <option value="a4">
                A4
              </option>

              <option value="letter">
                Letter
              </option>

            </select>

          </div>



          <!-- Orientation -->

          <div class="setting-group">

            <label for="orientation">
              Orientation
            </label>


            <select id="orientation">

              <option value="auto">
                Automatic
              </option>

              <option value="portrait">
                Portrait
              </option>

              <option value="landscape">
                Landscape
              </option>

            </select>

          </div>


        </div>



        <!-- Buttons -->

        <div class="buttons">


          <button
            class="primary-button"
            id="createButton"
          >
            Create PDF
          </button>


          <button
            class="secondary-button"
            id="clearButton"
          >
            Clear Images
          </button>


        </div>



        <!-- Status -->

        <div
          class="status"
          id="status"
        >
          0 images selected.
        </div>


      </div>


    </div>


  </main>



  <!-- Footer -->

  <footer>

    &copy; 2026 ToolNest
    &middot;
    Simple, Fast &amp; Free

  </footer>



  <script>

    const imageInput =
      document.getElementById(
        "imageInput"
      );


    const imageGrid =
      document.getElementById(
        "imageGrid"
      );


    const selectedSection =
      document.getElementById(
        "selectedSection"
      );


    const settingsSection =
      document.getElementById(
        "settingsSection"
      );


    const divider =
      document.getElementById(
        "divider"
      );


    const status =
      document.getElementById(
        "status"
      );


    const clearButton =
      document.getElementById(
        "clearButton"
      );


    const createButton =
      document.getElementById(
        "createButton"
      );


    const pageSize =
      document.getElementById(
        "pageSize"
      );


    const orientation =
      document.getElementById(
        "orientation"
      );


    let selectedImages = [];



    /* Upload Images */

    imageInput.addEventListener(
      "change",
      function(event) {

        const files =
          Array.from(
            event.target.files
          );


        files.forEach(
          function(file) {

            const reader =
              new FileReader();


            reader.onload =
              function(e) {

                selectedImages.push({
                  name: file.name,
                  data: e.target.result,
                  type: file.type
                });


                renderImages();

              };


            reader.readAsDataURL(
              file
            );

          }
        );


        imageInput.value = "";

      }
    );



    /* Display Images */

    function renderImages() {

      imageGrid.innerHTML = "";


      selectedImages.forEach(
        function(image, index) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "image-card";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.data;


          const removeButton =
            document.createElement(
              "button"
            );


          removeButton.className =
            "remove-button";


          removeButton.innerHTML =
            "×";


          removeButton.addEventListener(
            "click",
            function() {

              selectedImages.splice(
                index,
                1
              );


              renderImages();

            }
          );


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "image-name";


          name.textContent =
            image.name;


          card.appendChild(
            img
          );


          card.appendChild(
            removeButton
          );


          card.appendChild(
            name
          );


          imageGrid.appendChild(
            card
          );

        }
      );


      const count =
        selectedImages.length;


      status.textContent =
        count +
        (
          count === 1
            ? " image selected."
            : " images selected."
        );


      if (
        count > 0
      ) {

        selectedSection.style.display =
          "block";


        settingsSection.style.display =
          "block";


        divider.style.display =
          "block";

      }

      else {

        selectedSection.style.display =
          "none";


        settingsSection.style.display =
          "none";


        divider.style.display =
          "none";

      }

    }



    /* Clear Images */

    clearButton.addEventListener(
      "click",
      function() {

        selectedImages = [];

        renderImages();

      }
    );



    /* Create PDF */

    createButton.addEventListener(
      "click",
      async function() {


        if (
          selectedImages.length === 0
        ) {

          return;

        }


        createButton.textContent =
          "Creating PDF...";


        createButton.disabled =
          true;


        const {
          jsPDF
        } =
          window.jspdf;


        let pdf;


        for (
          let i = 0;
          i < selectedImages.length;
          i++
        ) {


          const image =
            selectedImages[i];


          const dimensions =
            await getImageDimensions(
              image.data
            );


          let pdfOrientation;


          if (
            orientation.value ===
            "auto"
          ) {

            pdfOrientation =
              dimensions.width >
              dimensions.height
                ? "landscape"
                : "portrait";

          }

          else {

            pdfOrientation =
              orientation.value;

          }


          if (
            i === 0
          ) {

            pdf =
              new jsPDF({
                orientation:
                  pdfOrientation,

                unit:
                  "mm",

                format:
                  pageSize.value
              });

          }

          else {

            pdf.addPage(
              pageSize.value,
              pdfOrientation
            );

          }


          const pageWidth =
            pdf.internal.pageSize.getWidth();


          const pageHeight =
            pdf.internal.pageSize.getHeight();


          const imageRatio =
            dimensions.width /
            dimensions.height;


          const pageRatio =
            pageWidth /
            pageHeight;


          let finalWidth;

          let finalHeight;


          if (
            imageRatio >
            pageRatio
          ) {

            finalWidth =
              pageWidth;


            finalHeight =
              pageWidth /
              imageRatio;

          }

          else {

            finalHeight =
              pageHeight;


            finalWidth =
              pageHeight *
              imageRatio;

          }


          const x =
            (
              pageWidth -
              finalWidth
            ) / 2;


          const y =
            (
              pageHeight -
              finalHeight
            ) / 2;


          let format =
            "JPEG";


          if (
            image.type ===
            "image/png"
          ) {

            format =
              "PNG";

          }


          if (
            image.type ===
            "image/webp"
          ) {

            format =
              "WEBP";

          }


          pdf.addImage(
            image.data,
            format,
            x,
            y,
            finalWidth,
            finalHeight
          );

        }


        pdf.save(
          "toolnest-images.pdf"
        );


        createButton.textContent =
          "Create PDF";


        createButton.disabled =
          false;

      }
    );



    /* Get Image Dimensions */

    function getImageDimensions(
      src
    ) {

      return new Promise(
        function(resolve) {

          const image =
            new Image();


          image.onload =
            function() {

              resolve({
                width:
                  image.width,

                height:
                  image.height
              });

            };


          image.src =
            src;

        }
      );

    }

  </script>


</body>

</html>
