<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Images to PDF - Free Online Tool | ToolNest</title>

  <meta
    name="description"
    content="Convert JPG, PNG and WEBP images to PDF online for free with ToolNest."
  >


  <!-- jsPDF -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <style>

    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      font-family: Arial, Helvetica, sans-serif;

      background: #d9dee4;
      color: #1f2937;
    }


    /* =========================
       HEADER
    ========================= */

    nav {
      width: 100%;

      background: #1f2937;
      border-bottom: 1px solid #374151;

      padding: 16px 32px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;
    }

    .logo-icon {
      width: 43px;
      height: 43px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #5b9a78,
          #3f7659
        );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-size: 22px;
      font-weight: bold;

      box-shadow:
        0 5px 14px
        rgba(63, 118, 89, 0.25);
    }

    .logo-text {
      font-size: 29px;
      font-weight: 800;

      letter-spacing: -0.8px;
      line-height: 1;
    }

    .logo-tool {
      color: #ffffff;
    }

    .logo-nest {
      color: #a9cdb7;
    }


    /* =========================
       BACK LINK
    ========================= */

    .back-link {
      color: #d1d5db;

      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      padding: 9px 14px;

      border-radius: 9px;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .back-link:hover {
      background: #273244;
      color: #ffffff;
    }


    /* =========================
       MAIN
    ========================= */

    .container {
      width: 100%;
      max-width: 950px;

      margin: 0 auto;

      padding: 55px 20px 80px;

      flex: 1;
    }


    /* =========================
       HEADING
    ========================= */

    .heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .heading h1 {
      margin: 0 0 12px;

      font-size: 42px;
      font-weight: 750;

      letter-spacing: -1px;

      color: #202938;
    }

    .heading p {
      max-width: 650px;

      margin: 0 auto;

      color: #667085;

      font-size: 16px;
      line-height: 1.6;
    }


    /* =========================
       TOOL BOX
    ========================= */

    .tool-box {
      background: #e9edf1;

      border: 1px solid #bec7d0;

      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 8px 24px
        rgba(31, 41, 55, 0.07);
    }


    /* =========================
       UPLOAD AREA
    ========================= */

    .upload-area {
      display: block;

      padding: 48px 20px;

      text-align: center;

      background: #eef1f4;

      border:
        2px dashed
        #aeb9c3;

      border-radius: 14px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .upload-area:hover {
      background: #e7ece9;

      border-color: #8bb89c;

      transform:
        translateY(-2px);
    }

    .upload-icon {
      font-size: 46px;
      margin-bottom: 15px;
    }

    .upload-area h2 {
      margin: 0 0 10px;

      font-size: 21px;

      color: #273246;
    }

    .upload-area p {
      margin: 0;

      color: #667085;

      font-size: 14px;
      line-height: 1.6;
    }

    input[type="file"] {
      display: none;
    }


    /* =========================
       SELECTED IMAGES
    ========================= */

    .selected-section {
      display: none;

      margin-top: 32px;
    }

    .selected-section h2 {
      margin: 0 0 7px;

      font-size: 21px;
      color: #273246;
    }

    .selected-section p {
      margin: 0 0 20px;

      color: #667085;

      font-size: 14px;
    }


    /* =========================
       IMAGE GRID
    ========================= */

    .image-grid {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;

      gap: 18px;

      min-height: 100px;
    }


    /* =========================
       IMAGE CARD
    ========================= */

    .image-card {
      position: relative;

      width: 170px;

      background: #dce6df;

      border:
        1px solid
        #c2d0c7;

      border-radius: 12px;

      padding: 8px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .image-card:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 6px 14px
        rgba(31, 41, 55, 0.10);
    }

    .image-card img {
      display: block;

      width: 100%;
      height: 130px;

      object-fit: contain;

      background: #ffffff;

      border-radius: 8px;
    }

    .image-name {
      margin-top: 9px;

      color: #59665e;

      font-size: 12px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* =========================
       REMOVE BUTTON
    ========================= */

    .remove-button {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      padding: 0;

      background: #3f7659;
      color: #ffffff;

      font-size: 19px;
      line-height: 28px;

      cursor: pointer;

      box-shadow:
        0 3px 8px
        rgba(31, 41, 55, 0.18);
    }

    .remove-button:hover {
      background: #35654c;

      transform: none;
    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: none;

      height: 1px;

      background: #bec7d0;

      margin: 32px 0;
    }


    /* =========================
       SETTINGS
    ========================= */

    .settings-section {
      display: none;
    }

    .settings-section h2 {
      margin: 0 0 22px;

      font-size: 21px;

      color: #273246;
    }

    .settings-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;

      max-width: 600px;

      margin:
        0 auto
        28px;
    }

    .setting-group label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 700;

      color: #2d3a32;
    }

    select {
      width: 100%;

      padding: 13px;

      border:
        1px solid
        #b9c4bd;

      border-radius: 9px;

      background: #ffffff;

      color: #1f2937;

      font-size: 15px;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    select:focus {
      outline: none;

      border-color: #5b9a78;

      box-shadow:
        0 0 0 3px
        rgba(91, 154, 120, 0.15);
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    button {
      border: none;

      border-radius: 10px;

      padding: 14px 24px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform:
        translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    /* PRIMARY */

    .primary-button {
      background: #3f7659;

      color: #ffffff;

      box-shadow:
        0 5px 12px
        rgba(63, 118, 89, 0.20);
    }

    .primary-button:hover:not(:disabled) {
      background: #35654c;

      box-shadow:
        0 8px 18px
        rgba(63, 118, 89, 0.28);
    }


    /* SECONDARY */

    .secondary-button {
      background: #dce6df;

      color: #2d3a32;

      border:
        1px solid
        #c2d0c7;
    }

    .secondary-button:hover:not(:disabled) {
      background: #d2ddd6;

      border-color: #9bb8a5;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      text-align: center;

      margin-top: 20px;

      padding: 14px;

      background: #dce6df;

      border:
        1px solid
        #c2d0c7;

      border-radius: 10px;

      color: #59665e;

      font-size: 14px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 100%;

      background: #1f2937;

      border-top:
        1px solid
        #374151;

      text-align: center;

      padding: 32px 20px;

      color: #aeb7c5;

      font-size: 14px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      nav {
        padding: 14px 16px;
        gap: 12px;
      }

      .logo {
        gap: 8px;
      }

      .logo-icon {
        width: 37px;
        height: 37px;

        border-radius: 10px;

        font-size: 19px;
      }

      .logo-text {
        font-size: 24px;
      }

      .back-link {
        padding: 8px 10px;
        font-size: 13px;
      }

      .container {
        padding:
          42px
          16px
          60px;
      }

      .heading {
        margin-bottom: 30px;
      }

      .heading h1 {
        font-size: 32px;
        letter-spacing: -0.5px;
      }

      .heading p {
        font-size: 15px;
      }

      .tool-box {
        padding: 18px;

        border-radius: 14px;
      }

      .upload-area {
        padding:
          40px
          15px;
      }

      .settings-grid {
        grid-template-columns: 1fr;

        max-width: 100%;
      }

      .image-card {
        width: 150px;
      }

      .buttons {
        flex-direction: column;
      }

      .buttons button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >

      <div class="logo-icon">
        T
      </div>

      <div class="logo-text">

        <span class="logo-tool">
          Tool
        </span>

        <span class="logo-nest">
          Nest
        </span>

      </div>

    </a>


    <a
      href="index.html"
      class="back-link"
    >
      ← All Tools
    </a>

  </nav>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">


    <!-- Heading -->

    <div class="heading">

      <h1>
        Images to PDF
      </h1>

      <p>
        Convert JPG, PNG and WEBP images into a PDF quickly and easily.
      </p>

    </div>



    <!-- Tool Box -->

    <div class="tool-box">


      <!-- Upload -->

      <label
        for="imageInput"
        class="upload-area"
      >

        <div class="upload-icon">
          🖼️
        </div>

        <h2>
          Upload Images
        </h2>

        <p>
          Select JPG, PNG or WEBP images from your device.
        </p>

      </label>


      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >



      <!-- Selected Images -->

      <div
        class="selected-section"
        id="selectedSection"
      >

        <h2>
          Selected Images
        </h2>

        <p>
          Your selected images will appear below.
        </p>


        <div
          class="image-grid"
          id="imageGrid"
        ></div>

      </div>



      <!-- Divider -->

      <div
        class="divider"
        id="divider"
      ></div>



      <!-- Settings -->

      <div
        class="settings-section"
        id="settingsSection"
      >

        <h2>
          PDF Settings
        </h2>


        <div class="settings-grid">


          <!-- Page Size -->

          <div class="setting-group">

            <label for="pageSize">
              Page Size
            </label>

            <select id="pageSize">

              <option value="a4">
                A4
              </option>

              <option value="letter">
                Letter
              </option>

            </select>

          </div>



          <!-- Orientation -->

          <div class="setting-group">

            <label for="orientation">
              Orientation
            </label>

            <select id="orientation">

              <option value="auto">
                Automatic
              </option>

              <option value="portrait">
                Portrait
              </option>

              <option value="landscape">
                Landscape
              </option>

            </select>

          </div>


        </div>



        <!-- Buttons -->

        <div class="buttons">

          <button
            class="primary-button"
            id="createButton"
          >
            Create PDF
          </button>


          <button
            class="secondary-button"
            id="clearButton"
          >
            Clear Images
          </button>

        </div>



        <!-- Status -->

        <div
          class="status"
          id="status"
        >
          0 images selected.
        </div>


      </div>


    </div>


  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    &copy; 2026 ToolNest

    &middot;

    Simple, Fast &amp; Free

  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const imageInput =
      document.getElementById(
        "imageInput"
      );

    const imageGrid =
      document.getElementById(
        "imageGrid"
      );

    const selectedSection =
      document.getElementById(
        "selectedSection"
      );

    const settingsSection =
      document.getElementById(
        "settingsSection"
      );

    const divider =
      document.getElementById(
        "divider"
      );

    const status =
      document.getElementById(
        "status"
      );

    const clearButton =
      document.getElementById(
        "clearButton"
      );

    const createButton =
      document.getElementById(
        "createButton"
      );

    const pageSize =
      document.getElementById(
        "pageSize"
      );

    const orientation =
      document.getElementById(
        "orientation"
      );


    let selectedImages = [];


    /* =========================
       UPLOAD IMAGES
    ========================= */

    imageInput.addEventListener(
      "change",
      function(event) {

        const files =
          Array.from(
            event.target.files
          );


        files.forEach(
          function(file) {

            const reader =
              new FileReader();


            reader.onload =
              function(e) {

                selectedImages.push({
                  name: file.name,
                  data: e.target.result,
                  type: file.type
                });


                renderImages();

              };


            reader.readAsDataURL(
              file
            );

          }
        );


        imageInput.value = "";

      }
    );


    /* =========================
       DISPLAY IMAGES
    ========================= */

    function renderImages() {

      imageGrid.innerHTML = "";


      selectedImages.forEach(
        function(image, index) {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "image-card";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.data;


          const removeButton =
            document.createElement(
              "button"
            );


          removeButton.className =
            "remove-button";


          removeButton.innerHTML =
            "×";


          removeButton.addEventListener(
            "click",
            function() {

              selectedImages.splice(
                index,
                1
              );


              renderImages();

            }
          );


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "image-name";


          name.textContent =
            image.name;


          card.appendChild(
            img
          );


          card.appendChild(
            removeButton
          );


          card.appendChild(
            name
          );


          imageGrid.appendChild(
            card
          );

        }
      );


      const count =
        selectedImages.length;


      status.textContent =
        count +
        (
          count === 1
            ? " image selected."
            : " images selected."
        );


      if (
        count > 0
      ) {

        selectedSection.style.display =
          "block";


        settingsSection.style.display =
          "block";


        divider.style.display =
          "block";

      }

      else {

        selectedSection.style.display =
          "none";


        settingsSection.style.display =
          "none";


        divider.style.display =
          "none";

      }

    }


    /* =========================
       CLEAR IMAGES
    ========================= */

    clearButton.addEventListener(
      "click",
      function() {

        selectedImages = [];

        renderImages();

      }
    );


    /* =========================
       CREATE PDF
    ========================= */

    createButton.addEventListener(
      "click",
      async function() {


        if (
          selectedImages.length === 0
        ) {

          return;

        }


        createButton.textContent =
          "Creating PDF...";


        createButton.disabled =
          true;


        try {

          const {
            jsPDF
          } =
            window.jspdf;


          let pdf;


          for (
            let i = 0;
            i < selectedImages.length;
            i++
          ) {

            const image =
              selectedImages[i];


            const dimensions =
              await getImageDimensions(
                image.data
              );


            let pdfOrientation;


            if (
              orientation.value ===
              "auto"
            ) {

              pdfOrientation =
                dimensions.width >
                dimensions.height
                  ? "landscape"
                  : "portrait";

            }

            else {

              pdfOrientation =
                orientation.value;

            }


            if (
              i === 0
            ) {

              pdf =
                new jsPDF({
                  orientation:
                    pdfOrientation,

                  unit:
                    "mm",

                  format:
                    pageSize.value
                });

            }

            else {

              pdf.addPage(
                pageSize.value,
                pdfOrientation
              );

            }


            const pageWidth =
              pdf.internal.pageSize.getWidth();


            const pageHeight =
              pdf.internal.pageSize.getHeight();


            const imageRatio =
              dimensions.width /
              dimensions.height;


            const pageRatio =
              pageWidth /
              pageHeight;


            let finalWidth;

            let finalHeight;


            if (
              imageRatio >
              pageRatio
            ) {

              finalWidth =
                pageWidth;


              finalHeight =
                pageWidth /
                imageRatio;

            }

            else {

              finalHeight =
                pageHeight;


              finalWidth =
                pageHeight *
                imageRatio;

            }


            const x =
              (
                pageWidth -
                finalWidth
              ) / 2;


            const y =
              (
                pageHeight -
                finalHeight
              ) / 2;


            let format =
              "JPEG";


            if (
              image.type ===
              "image/png"
            ) {

              format =
                "PNG";

            }


            if (
              image.type ===
              "image/webp"
            ) {

              format =
                "WEBP";

            }


            pdf.addImage(
              image.data,
              format,
              x,
              y,
              finalWidth,
              finalHeight
            );

          }


          pdf.save(
            "toolnest-images.pdf"
          );


          status.textContent =
            "PDF created successfully.";

        }

        catch (error) {

          console.error(error);


          status.textContent =
            "Something went wrong while creating the PDF.";

        }


        createButton.textContent =
          "Create PDF";


        createButton.disabled =
          false;

      }
    );


    /* =========================
       GET IMAGE DIMENSIONS
    ========================= */

    function getImageDimensions(
      src
    ) {

      return new Promise(
        function(resolve) {

          const image =
            new Image();


          image.onload =
            function() {

              resolve({
                width:
                  image.width,

                height:
                  image.height
              });

            };


          image.src =
            src;

        }
      );

    }

  </script>


</body>

</html>
