<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge PDF - ToolNest</title>
  <meta name="description" content="Merge multiple PDF files into one PDF online for free with ToolNest.">
  
  <!-- PDF.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PDF-LIB -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

  <style>
    /* ========================================
       RESET & BASE STYLES
    ======================================== */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #263548;
    }

    /* ========================================
       HEADER & NAVIGATION
    ======================================== */
    .top-header { width: 100%; background: #ffffff; border-bottom: 1px solid #dfe5eb; }
    .header-inner {
      width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
    .logo-icon {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-radius: 9px; background: linear-gradient(135deg, #3d78b6, #245b96);
      color: #ffffff; font-size: 16px; font-weight: 800; box-shadow: 0 3px 8px rgba(43, 92, 150, 0.18);
    }
    .logo-text { font-size: 22px; letter-spacing: -0.6px; }
    .logo-tool { color: #334155; font-weight: 500; }
    .logo-nest { color: #326ba8; font-weight: 800; }
    .header-search { width: 100%; max-width: 520px; position: relative; }
    .header-search input {
      width: 100%; height: 40px; padding: 0 44px 0 15px; border: 1px solid #d8e0e8;
      border-radius: 7px; background: #f7f9fb; color: #344256; font-size: 14px; outline: none;
    }
    .header-search input:focus { background: #ffffff; border-color: #7fa6cf; box-shadow: 0 0 0 3px rgba(50, 107, 168, 0.08); }
    .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #718096; font-size: 19px; pointer-events: none; }
    .category-nav { background: #ffffff; border-bottom: 1px solid #dfe5eb; }
    .category-nav-inner { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 30px; overflow-x: auto; }
    .category-link { position: relative; display: flex; align-items: center; height: 46px; color: #667588; text-decoration: none; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .category-link:hover { color: #2f67a3; }
    .category-link.active { color: #263548; font-weight: 600; }
    .category-link.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #326ba8; border-radius: 3px 3px 0 0; }

    /* ========================================
       PAGE & TOOLBARS
    ======================================== */
    .page-wrapper { width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
    .page-layout { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 28px; align-items: start; }
    .content { min-width: 0; }
    .tool-category-bar { width: 100%; margin-bottom: 20px; overflow-x: auto; scrollbar-width: thin; }
    .tool-category-list { display: flex; align-items: center; width: max-content; min-width: 100%; gap: 8px; }
    .tool-category-link {
      position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 0 13px; background: #ffffff; border: 1px solid #dce3ea; border-radius: 999px; color: #667588; text-decoration: none; font-size: 11px; font-weight: 600; white-space: nowrap; transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .tool-category-link:hover { color: #326ba8; border-color: #c7d6e5; background: #f7fafd; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(50, 107, 168, 0.08); }
    .tool-category-link.active { background: #326ba8; border-color: #326ba8; color: #ffffff; box-shadow: 0 2px 6px rgba(50, 107, 168, 0.14); }
    .tool-category-link.active:hover { background: #285b91; border-color: #285b91; color: #ffffff; }
    .heading { margin-bottom: 26px; }
    .heading h1 { margin: 0 0 10px; color: #263548; font-size: 36px; font-weight: 700; letter-spacing: -0.8px; }
    .heading p { max-width: 720px; margin: 0; color: #718096; font-size: 16px; line-height: 1.6; }

    /* ========================================
       TOOL BOX & UPLOAD MECHANICS
    ======================================== */
    .tool-box { background: #ffffff; border: 1px solid #dce3ea; border-radius: 12px; padding: 26px; box-shadow: 0 4px 16px rgba(31, 45, 61, 0.05); }
    #pdfInput { display: none; }
    .upload-area {
      width: 100%; min-height: 390px; padding: 30px; position: relative; display: block; text-align: center; background: #fafbfd; border: 2px dashed #8da9c5; border-radius: 12px; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease;
    }
    .upload-area:hover { background: #f4f8fc; border-color: #5f8fbd; }
    .upload-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 330px; }
    .upload-icon { font-size: 48px; color: #326ba8; margin-bottom: 16px; }
    .upload-text { font-size: 18px; font-weight: 600; color: #344256; margin-bottom: 6px; }
    .upload-subtext { font-size: 14px; color: #718096; }

    /* ========================================
       DYNAMIC FILE PREVIEW GRID & ACTION ITEMS
    ======================================== */
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; width: 100%; text-align: left; margin-top: 10px; }
    .file-card {
      position: relative; background: #ffffff; border: 1px solid #dce3ea; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: default; transition: transform 0.2s ease;
    }
    .file-card:hover { transform: translateY(-2px); }
    .canvas-container { width: 100%; aspect-ratio: 1 / 1.414; background: #eee; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid #e2e8f0; }
    .canvas-container canvas { width: 100% !important; height: auto !important; }
    .file-title { font-size: 12px; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #344256; }
    
    /* 🛠️ Opposite Action Edges Rules */
    .action-btn {
      position: absolute; top: -8px; width: 26px; height: 26px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: background 0.2s, transform 0.2s; z-index: 10;
    }
    .action-btn:hover { transform: scale(1.1); }
    .magnify-btn { left: -8px; background: #326ba8; color: white; font-size: 12px; }
    .magnify-btn:hover { background: #245b96; }
    .remove-btn { right: -8px; background: #ef4444; color: white; }
    .remove-btn:hover { background: #dc2626; }

    /* Action Trigger Interface Footer */
    .merge-action-bar { display: none; margin-top: 24px; padding-top: 20px; border-top: 1px solid #dfe5eb; text-align: right; }
    .btn-merge { background: #326ba8; color: white; font-size: 15px; font-weight: bold; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-merge:hover { background: #245b96; }

    /* ========================================
       🔍 FULL SCREEN INTERACTIVE MODAL VISUALIZER
    ======================================== */
    .zoom-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
    }
    .zoom-modal.active { display: flex; opacity: 1; }
    .zoom-modal-content {
      background: white; border-radius: 12px; width: 90%; max-width: 800px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); transform: scale(0.95); transition: transform 0.3s ease;
    }
    .zoom-modal.active .zoom-modal-content { transform: scale(1); }
    .zoom-modal-header { padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; background: #f8fafc; }
    .zoom-modal-title { font-size: 16px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
    .zoom-modal-close { background: none; border: none; font-size: 24px; color: #64748b; cursor: pointer; padding: 0 4px; display: flex; align-items: center; justify-content: center; }
    .zoom-modal-close:hover { color: #1e293b; }
    .zoom-modal-body { flex: 1; overflow-y: auto; padding: 24px; background: #f1f5f9; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .zoom-page-wrapper { background: white; padding: 10px; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; }
    .zoom-page-wrapper canvas { max-width: 100%; height: auto !important; border: 1px solid #cbd5e1; }
    .zoom-page-number { margin-top: 8px; font-size: 12px; color: #64748b; font-weight: 500; }
  </style>
</head>
