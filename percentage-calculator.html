<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Percentage Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      text-align: center;
      background: #f4f4f4;
      border-radius: 10px;
    }

    #answer {
      display: block;
      font-size: 32px;
      margin-top: 8px;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Percentage Calculator</h1>

    <p class="subtitle">
      Calculate a percentage of any number instantly.
    </p>

    <label>Percentage</label>
    <input
      type="number"
      id="percentage"
      placeholder="Example: 20"
    >

    <label>Number</label>
    <input
      type="number"
      id="number"
      placeholder="Example: 500"
    >

    <button onclick="calculate()">
      Calculate
    </button>

    <div id="result">
      Result
      <strong id="answer">0</strong>
    </div>

    <a href="index.html">
      ← Back to Word Counter
    </a>

  </div>

  <script>

    function calculate() {

      const percentage =
        document.getElementById("percentage").value;

      const number =
        document.getElementById("number").value;

      const result =
        (percentage / 100) * number;

      document.getElementById("answer").textContent =
        result;

      document.getElementById("result").style.display =
        "block";

    }

  </script>

</body>
</html>
