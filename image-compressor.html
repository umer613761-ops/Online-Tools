
<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Compressor - ToolNest</title>

  <style>

    /* ========================================
       RESET
    ======================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f5f7;
      color: #263548;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }


    /* ========================================
       HEADER
    ======================================== */

    .top-header {
      width: 100%;

      background: #ffffff;

      border-bottom:
        1px solid #dfe5eb;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .header-inner {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        10px 24px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 24px;
    }


    /* ========================================
       LOGO
    ======================================== */

    .logo {
      display: flex;

      align-items: center;

      gap: 8px;

      text-decoration: none;

      white-space: nowrap;
    }

    .logo-icon {
      width: 32px;
      height: 32px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          #3d78b6,
          #245b96
        );

      color: #ffffff;

      font-size: 16px;

      font-weight: 800;

      box-shadow:
        0 3px 8px
        rgba(43, 92, 150, 0.18);
    }

    .logo-text {
      font-size: 22px;

      letter-spacing: -0.6px;
    }

    .logo-tool {
      color: #334155;

      font-family:
        "Brush Script MT",
        "Brush Script Std",
        cursive;

      font-size: 32px;

      font-weight: 400;

      letter-spacing: 0;

      transition:
        color 0.2s ease;
    }

    .logo-nest {
      color: #326ba8;

      font-weight: 800;
    }


    /* ========================================
       HEADER RIGHT SIDE
    ======================================== */

    .header-right {
      width: 100%;

      max-width: 570px;

      display: flex;

      align-items: center;
      justify-content: flex-end;

      gap: 10px;
    }


    /* ========================================
       SEARCH
    ======================================== */

    .header-search {
      width: 100%;

      max-width: 312px;

      position: relative;
    }

    .header-search input {
      width: 100%;

      height: 40px;

      padding:
        0 44px 0 15px;

      border:
        1px solid #d8e0e8;

      border-radius: 7px;

      background: #f7f9fb;

      color: #344256;

      font-size: 14px;

      outline: none;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .header-search input::placeholder {
      color: #8996a5;
    }

    .header-search input:focus {
      background: #ffffff;

      border-color: #7fa6cf;

      box-shadow:
        0 0 0 3px
        rgba(50, 107, 168, 0.08);
    }

    .search-icon {
      position: absolute;

      right: 14px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #718096;

      font-size: 19px;

      pointer-events: none;

      transition:
        color 0.2s ease;
    }


    /* ========================================
       DARK MODE TOGGLE
    ======================================== */

    .theme-toggle {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 0;

      border:
        1px solid #d8e0e8;

      border-radius: 7px;

      background: #f7f9fb;

      color: #526273;

      cursor: pointer;

      font-size: 18px;

      line-height: 1;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .theme-toggle:hover {
      background: #edf2f7;

      border-color: #c7d3df;

      color: #326ba8;
    }

    .theme-toggle:active {
      transform:
        scale(0.94);
    }


    /* ========================================
       CATEGORY NAVIGATION
    ======================================== */

    .category-nav {
      background: #ffffff;

      border-bottom:
        1px solid #dfe5eb;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .category-nav-inner {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        0 24px;

      display: flex;

      align-items: center;

      gap: 30px;

      overflow-x: auto;
    }

    .category-link {
      position: relative;

      display: flex;

      align-items: center;

      height: 46px;

      color: #667588;

      text-decoration: none;

      font-size: 14px;

      white-space: nowrap;

      cursor: pointer;

      transition:
        color 0.2s ease;
    }

    .category-link:hover {
      color: #2f67a3;
    }

    .category-link.active {
      color: #263548;

      font-weight: 600;
    }

    .category-link.active::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 3px;

      background: #326ba8;

      border-radius:
        3px 3px 0 0;
    }


    /* ========================================
       ADVERTISEMENT
    ======================================== */

    .ad-column {
      width: 200px;

      position: sticky;

      top: 20px;
    }

    .ad-box {
      width: 200px;
      height: 400px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background: #ffffff;

      border:
        1px solid #dce3ea;

      border-radius: 10px;

      text-align: center;

      box-shadow:
        0 4px 16px
        rgba(31, 45, 61, 0.04);

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .ad-content {
      width: 100%;
    }

    .ad-label {
      margin-bottom: 14px;

      color: #a0acb8;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 1.5px;

      transition:
        color 0.2s ease;
    }

    .sample-ad {
      padding:
        22px 12px;

      background:
        linear-gradient(
          135deg,
          #f5f8fc,
          #edf3f9
        );

      border:
        1px solid #d8e3ed;

      border-radius: 9px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .sample-ad-badge {
      display: inline-block;

      margin-bottom: 12px;

      padding:
        5px 9px;

      background: #326ba8;

      border-radius: 20px;

      color: #ffffff;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.5px;
    }

    .sample-ad h3 {
      margin:
        0 0 9px;

      color: #344255;

      font-size: 18px;

      line-height: 1.3;

      transition:
        color 0.2s ease;
    }

    .sample-ad p {
      margin:
        0 0 16px;

      color: #718096;

      font-size: 12px;

      line-height: 1.5;

      transition:
        color 0.2s ease;
    }

    .sample-ad-button {
      display: inline-block;

      padding:
        9px 14px;

      background: #ffffff;

      border:
        1px solid #cbd8e4;

      border-radius: 6px;

      color: #326ba8;

      font-size: 12px;

      font-weight: 700;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }


    /* ========================================
       DARK MODE
    ======================================== */

    html.dark-mode body {
      background: #11161d;
      color: #e7edf4;
    }

    html.dark-mode .top-header {
      background: #171d25;
      border-bottom-color: #293340;
    }

    html.dark-mode .logo-tool {
      color: #d7dee7;
    }

    html.dark-mode .logo-nest {
      color: #5b95c9;
    }

    html.dark-mode .header-search input {
      background: #202731;
      border-color: #343f4c;
      color: #edf2f7;
    }

    html.dark-mode .header-search input:focus {
      background: #252d38;
      border-color: #5f8fbd;
    }

    html.dark-mode .search-icon {
      color: #9aa8b7;
    }

    html.dark-mode .theme-toggle {
      background: #202731;
      border-color: #343f4c;
      color: #d7e1eb;
    }

    html.dark-mode .theme-toggle:hover {
      background: #29323d;
      border-color: #465463;
      color: #7eb0df;
    }

    html.dark-mode .category-nav {
      background: #171d25;
      border-bottom-color: #293340;
    }

    html.dark-mode .category-link {
      color: #9ba8b7;
    }

    html.dark-mode .category-link:hover {
      color: #6fa2d2;
    }

    html.dark-mode .category-link.active {
      color: #e8eef5;
    }


    html.dark-mode .ad-box {
      background: #171d25;
      border-color: #2e3946;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.18);
    }

    html.dark-mode .ad-label {
      color: #778493;
    }

    html.dark-mode .sample-ad {
      background:
        linear-gradient(
          135deg,
          #202934,
          #18212b
        );

      border-color: #354352;
    }

    html.dark-mode .sample-ad h3 {
      color: #dce4ec;
    }

    html.dark-mode .sample-ad p {
      color: #9ba8b7;
    }

    html.dark-mode .sample-ad-button {
      background: #202731;
      border-color: #455361;
      color: #6fa2d2;
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      .header-inner {
        padding:
          9px 16px;
      }

      .header-search,
      .theme-toggle {
        display: none;
      }

      .header-right {
        width: auto;
        max-width: none;
      }

      .category-nav-inner {
        padding:
          0 16px;

        gap: 22px;
      }
    }


    /* ========================================
       MOBILE ADVERTISEMENT
    ======================================== */

    @media (max-width: 900px) {

      .ad-column {
        width: 100%;

        position: static;
      }

      .ad-box {
        width: 100%;

        height: 180px;
      }

    }


    /* ========================================
       FOOTER
    ======================================== */

    footer {
      background: #ffffff;

      border-top:
        1px solid #dfe5eb;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .footer-inner {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 24px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      color: #7b8998;

      font-size: 13px;

      transition:
        color 0.2s ease;
    }

    .footer-links {
      display: flex;

      gap: 20px;
    }

    .footer-links a {
      color: #7b8998;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }

    .footer-links a:hover {
      color: #326ba8;
    }


    /* ========================================
       FOOTER DARK MODE
    ======================================== */

    html.dark-mode footer {
      background: #171d25;
      border-top-color: #293340;
    }

    html.dark-mode .footer-inner {
      color: #8d9aaa;
    }

    html.dark-mode .footer-links a {
      color: #8d9aaa;
    }

    html.dark-mode .footer-links a:hover {
      color: #6fa2d2;
    }


    /* ========================================
       SYSTEM DARK MODE
    ======================================== */

    @media (prefers-color-scheme: dark) {

      html:not(.light-mode) footer {
        background: #171d25;
        border-top-color: #293340;
      }

      html:not(.light-mode) .footer-inner {
        color: #8d9aaa;
      }

      html:not(.light-mode) .footer-links a {
        color: #8d9aaa;
      }

      html:not(.light-mode) .footer-links a:hover {
        color: #6fa2d2;
      }
    }


    /* ========================================
       MOBILE FOOTER
    ======================================== */

    @media (max-width: 550px) {

      .footer-inner {
        flex-direction: column;

        text-align: center;
      }
    }


    /* ========================================
       MAIN CONTENT
    ======================================== */

    main {
      flex: 1;
    }


  </style>

</head>

<body>

  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="top-header">


<div class="header-inner">


  <!-- LOGO -->

  <a href="index.html" class="logo">

    <span class="logo-icon">T</span>

    <span class="logo-text">

      <span class="logo-tool">
        Tool
      </span>

      <span class="logo-nest">
        NEST
      </span>

    </span>

  </a>


  <!-- HEADER RIGHT SIDE -->

  <div class="header-right">


    <!-- SEARCH -->

    <div class="header-search">

      <input
        type="text"
        id="toolSearch"
        placeholder="Search tools..."
        autocomplete="off"
      >

      <span class="search-icon">
        ⌕
      </span>

    </div>


    <!-- DARK MODE -->

    <button
      type="button"
      class="theme-toggle"
      id="themeToggle"
      aria-label="Switch to dark mode"
      title="Switch to dark mode"
    >
      🌙
    </button>


  </div>

</div>


  </header>

  <!-- ========================================
       MAIN CATEGORY NAVIGATION
  ========================================= -->

  <nav class="category-nav">


<div class="category-nav-inner">


  <a
    href="index.html"
    class="category-link"
  >
    Popular Tools
  </a>


  <a
    href="index.html?category=pdf"
    class="category-link"
  >
    PDF Tools
  </a>


  <a
    href="index.html?category=text"
    class="category-link"
  >
    Text Tools
  </a>


  <a
    href="index.html?category=image"
    class="category-link active"
  >
    Image Tools
  </a>


</div>


  </nav>

  <!-- ========================================
       EMPTY PAGE CONTENT
  ========================================= -->

  <main>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 28px; align-items: start; width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px;">

      <div>
      </div>

      <!-- ADVERTISEMENT -->

      <aside class="ad-column" aria-label="Advertisement">

        <div class="ad-box">

          <div class="ad-content">

            <div class="ad-label">
              ADVERTISEMENT
            </div>

            <div class="sample-ad">

              <div class="sample-ad-badge">
                TOOLNEST
              </div>

              <h3>
                Simple Tools.<br>
                Better Productivity.
              </h3>

              <p>
                Fast, free and easy-to-use online tools for everyday tasks.
              </p>

              <a class="sample-ad-button" href="index.html">
                Explore Tools
              </a>

            </div>

          </div>

        </div>

      </aside>

    </div>

  </main>

  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer>


<div class="footer-inner">

  <div>
    © 2026 ToolNest · Simple, Fast &amp; Free
  </div>

  <div class="footer-links">

    <a href="#">
      About
    </a>

    <a href="#">
      Privacy
    </a>

    <a href="#">
      Terms
    </a>

    <a href="#">
      Contact
    </a>

  </div>

</div>


  </footer>

  <!-- ========================================
       THEME SCRIPT
  ========================================= -->

  <script>

    /* ========================================
       THEME
    ======================================== */

    const themeToggle =
      document.getElementById("themeToggle");

    function updateThemeIcon() {

      if (
        document.documentElement.classList.contains(
          "dark-mode"
        )
      ) {

        themeToggle.textContent = "☀";
        themeToggle.setAttribute(
          "aria-label",
          "Switch to light mode"
        );
        themeToggle.setAttribute(
          "title",
          "Switch to light mode"
        );

      } else {

        themeToggle.textContent = "🌙";
        themeToggle.setAttribute(
          "aria-label",
          "Switch to dark mode"
        );
        themeToggle.setAttribute(
          "title",
          "Switch to dark mode"
        );

      }

    }

    themeToggle.addEventListener(
      "click",
      function () {

        const isDark =
          document.documentElement.classList.toggle(
            "dark-mode"
          );

        localStorage.setItem(
          "toolnest-theme",
          isDark ? "dark" : "light"
        );

        updateThemeIcon();

      }
    );

    const savedTheme =
      localStorage.getItem("toolnest-theme");

    if (savedTheme === "dark") {
      document.documentElement.classList.add("dark-mode");
    }

    if (savedTheme === "light") {
      document.documentElement.classList.add("light-mode");
    }

    updateThemeIcon();


  </script>

</body>

</html>
